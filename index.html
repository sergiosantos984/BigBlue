}

/* ============ 4–5. ATHLETE PROFILE & APPLICATION STATE ============ */
const State = {
  settings: Object.assign({}, DEFAULT_SETTINGS),
  profile: null,        // {id,name,createdAt,updatedAt,baselines:{squat:{w,cls,date,notes}},athletic:{vj,sprint10,sprint110},initialBw,targetBw,startDate,goals,baselineHistory:[]}
  meta: { schema: SCHEMA_VERSION, onboarded: false, introSeen: false, activeSessionId: null, finaleSeen: false, timer: null, dashSeen: false },
  program: null,
  sessions: [], results: [], bodyweight: [], achievements: [],
  version: 0,           // bumped on every data change; analytics cache key
  storageMode: 'idb'
};
const Program = {
  get: () => State.program,
  byId: id => State.program.workouts.find(w => w.id === id),
  week: n => State.program.workouts.filter(w => w.week === n),
  exDef: id => EXERCISES[id] || (State.program.customExercises || {})[id] || { name: id, cat: 'strength', equip: '—', notes: '' },
  cycleOf: w => { const cs = State.program.cycles; for (const k in cs) { const [a, b] = cs[k].weeks; if (w >= a && w <= b) return Object.assign({ id: +k }, cs[k]); } return { id: 0, name: '—', phase: '—' }; },
  schedDate(w) { const p = State.profile; if (!p || !p.startDate) return null; return addDays(p.startDate, (w.week - 1) * 7 + (State.program.dayOffsets[w.day - 1] || 0)); }
};

/* ============ 6. STORAGE & MIGRATIONS ============
   localStorage  → small documents: settings, profile, meta, onboarding draft, active-session mirror.
   IndexedDB     → structured history: sessions, results, bodyweight, achievements.
   If IndexedDB is unavailable the same stores fall back to localStorage; if that also fails
   the app keeps working in memory and tells Cliff his data is not being saved. */
const LSX = {
  ok: true,
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { this.fail(e); return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { } },
  fail(e) { if (e && /quota/i.test(e.name + e.message)) UI.toast('Storage is full. Export a backup from More → Backup.', 'bad'); }
};
const STORES = ['sessions', 'results', 'bodyweight', 'achievements'];
const DB = {
  db: null, mode: 'idb',
  open() {
    return new Promise(res => {
      if (!window.indexedDB) return res(this.useFallback());
      let req; try { req = indexedDB.open(APP_ID, 1); } catch (e) { return res(this.useFallback()); }
      const timer = setTimeout(() => res(this.useFallback()), 2500);
      req.onupgradeneeded = () => { const d = req.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
      req.onsuccess = () => { clearTimeout(timer); this.db = req.result; this.mode = 'idb'; res('idb'); };
      req.onerror = req.onblocked = () => { clearTimeout(timer); res(this.useFallback()); };
    });
  },
  useFallback() {
    try { localStorage.setItem('bbp.probe', '1'); localStorage.removeItem('bbp.probe'); this.mode = 'ls'; } catch (e) { this.mode = 'memory'; }
    return this.mode;
  },
  all(store) {
    if (this.mode === 'idb') return new Promise((res, rej) => { try { const r = this.db.transaction(store).objectStore(store).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
    if (this.mode === 'ls') return Promise.resolve(LSX.get('bbp.store.' + store, []));
    return Promise.resolve([]);
  },
  put(store, obj) {
    obj.updatedAt = Date.now();
    if (this.mode === 'idb') return new Promise(res => {
      try { const tx = this.db.transaction(store, 'readwrite'); tx.objectStore(store).put(JSON.parse(JSON.stringify(obj))); tx.oncomplete = () => res(true); tx.onerror = tx.onabort = () => { LSX.fail(tx.error); UI.toast("Couldn't save to this device. Export a backup soon.", 'bad'); res(false); }; }
      catch (e) { UI.toast("Couldn't save to this device.", 'bad'); res(false); }
    });
    if (this.mode === 'ls') return Promise.resolve(LSX.set('bbp.store.' + store, State[store]));
    return Promise.resolve(false);
  },
  del(store, id) {
    if (this.mode === 'idb') return new Promise(res => { try { const tx = this.db.transaction(store, 'readwrite'); tx.objectStore(store).delete(id); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });
    if (this.mode === 'ls') return Promise.resolve(LSX.set('bbp.store.' + store, State[store]));
    return Promise.resolve(false);
  },
  clear(store) {
    if (this.mode === 'idb') return new Promise(res => { try { const tx = this.db.transaction(store, 'readwrite'); tx.objectStore(store).clear(); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } });
    if (this.mode === 'ls') LSX.del('bbp.store.' + store);
    return Promise.resolve(true);
  }
};
const Store = {
  /* upsert into memory + persistent store; bumps version so analytics recompute */
  async save(store, obj) { const arr = State[store], i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); State.version++; return DB.put(store, obj); },
  async remove(store, id) { State[store] = State[store].filter(x => x.id !== id); State.version++; return DB.del(store, id); },
  saveSettings() { LSX.set(LS.settings, State.settings); State.version++; },
  saveProfile() { if (State.profile) State.profile.updatedAt = Date.now(); LSX.set(LS.profile, State.profile); State.version++; },
  saveMeta() { LSX.set(LS.meta, State.meta); }
};

/* schema migrations: each step takes the raw stored bundle and returns the next version */
const MIGRATIONS = {
  // v1 → v2: baseline values moved from plain numbers to {w:{kg,v,u}} weight objects; athletic baselines added.
  1(b) {
    const p = b.profile;
    if (p && p.baselines) for (const k in p.baselines) { const x = p.baselines[k]; if (x && typeof x.value === 'number') { p.baselines[k] = { w: Units.wt(x.value, x.unit || 'lb'), cls: x.cls || 'recorded', date: x.date || null, notes: x.notes || '' }; } }
    if (p && !p.athletic) p.athletic = {};
    return b;
  }
};
function runMigrations(bundle, from) {
  let v = from;
  while (v < SCHEMA_VERSION) { if (!MIGRATIONS[v]) throw new Error(`No migration from schema ${v}`); bundle = MIGRATIONS[v](bundle); v++; }
  return bundle;
}

/* ============ 7. WEIGHT CONVERSION ============
   Internal canonical units: kg (weight), cm (height), seconds (time).
   Every entered weight is stored as {kg, v, u} — the canonical value plus exactly what
   was typed — so showing it back in the same unit never drifts through repeated conversion. */
const Units = {
  toKg: (v, u) => u === 'kg' ? v : v / LB_PER_KG,
  fromKg: (kg, u) => u === 'kg' ? kg : kg * LB_PER_KG,
  wt(v, u) { v = +v; return { kg: Units.toKg(v, u), v, u }; },
  showW(o, u = State.settings.unit) { if (!o) return null; return o.u === u ? o.v : Units.fromKg(o.kg, u); },
  fmtW(o, u = State.settings.unit, d = 1) { const v = Units.showW(o, u); return v == null ? '—' : fmtNum(v, d); },
  hUnit: () => State.settings.unit === 'kg' ? 'cm' : 'in',
  ht(v, u) { v = +v; return { cm: u === 'cm' ? v : v * CM_PER_IN, v, u }; },
  showH(o, u = Units.hUnit()) { if (!o) return null; return o.u === u ? o.v : (u === 'cm' ? o.cm : o.cm / CM_PER_IN); },
  /* canonical numeric value of a metric result */
  canon(metric, o) { const k = METRICS[metric].kind; return k === 'weight' ? o.kg : k === 'height' ? o.cm : o.sec; },
  showMetric(metric, o, withUnit = true) {
    if (!o) return '—'; const k = METRICS[metric].kind;
    if (k === 'weight') return fmtNum(Units.showW(o), 1) + (withUnit ? ' ' + State.settings.unit : '');
    if (k === 'height') return fmtNum(Units.showH(o), 1) + (withUnit ? ' ' + Units.hUnit() : '');
    return fmtNum(o.sec, 2) + (withUnit ? ' s' : '');
  },
  metricUnit(metric) { const k = METRICS[metric].kind; return k === 'weight' ? State.settings.unit : k === 'height' ? Units.hUnit() : 's'; },
  makeMetric(metric, v) { const k = METRICS[metric].kind; return k === 'weight' ? Units.wt(v, State.settings.unit) : k === 'height' ? Units.ht(v, Units.hUnit()) : { sec: +v }; },
  /* metric value expressed in a given display unit, for change maths */
  metricIn(metric, o) { const k = METRICS[metric].kind; return k === 'weight' ? Units.showW(o) : k === 'height' ? Units.showH(o) : o.sec; },
  inc() { return State.settings.unit === 'kg' ? State.settings.incKg : State.settings.incLb; }
};

/* ============ 8. PERCENTAGE CALCULATIONS ============
   Target = reference max × prescribed %. The raw value is always kept and shown.
   Rounding (to the plate increment in the display unit):
   - 'down' (default): never rounds a load above the prescription.
   - 'nearest': may round up; when it does, the target is flagged "rounded up". */
const Calc = {
  refFor(lift) { const b = State.profile && State.profile.baselines && State.profile.baselines[lift]; return b && b.w ? b : null; },
  target(ref, pct, unit = State.settings.unit, inc = Units.inc(), mode = State.settings.rounding) {
    if (!ref || !ref.w || !(pct > 0)) return null;
    const refU = Units.showW(ref.w, unit), raw = refU * pct / 100;
    const q = raw / inc, steps = mode === 'nearest' ? Math.round(q) : Math.floor(q + 1e-9);
    const rounded = Math.round(steps * inc * 1000) / 1000;
    return { raw, rounded, unit, pct, kg: Units.toKg(rounded, unit), roundedUp: rounded > raw + 1e-9, over100: pct > 100, refV: refU, refCls: ref.cls };
  },
  clsLabel: c => ({ tested: 'TESTED 1RM', recorded: 'RECORDED MAX', training: 'TRAINING MAX', estimated: 'ESTIMATED' }[c] || 'MAX'),
  /* Epley estimate from a submaximal set; reported only as an estimate */
  epley: (kg, reps) => reps >= 1 && reps <= 10 ? (reps === 1 ? kg : kg * (1 + reps / 30)) : null
};

/* ============ 9. WORKOUT EXECUTION ============ */
const Workout = {
  busy: false,
  active() { const id = State.meta.activeSessionId; return id ? State.sessions.find(s => s.id === id && s.status === 'in_progress') || null : null; },
  elapsed(s) { if (!s || !s.startedAt) return 0; const end = s.endedAt || s.pausedAt || Date.now(); return Math.max(0, end - s.startedAt - (s.pausedMs || 0)); },
  prescText(e) {
    if (e.type === 'pct') { const g = {}; e.scheme.forEach(([r, p]) => { const k = `${r}@${p}`; g[k] = (g[k] || 0) + 1; }); return Object.entries(g).map(([k, n]) => { const [r, p] = k.split('@'); return `${n}×${r} @ ${p}%`; }).join(', '); }
    if (e.type === 'reps') return `${e.sets} × ${e.reps}${e.unitLabel ? ' ' + e.unitLabel + (e.reps > 1 ? 's' : '') : ''}`;
    if (e.type === 'timed') return e.sets > 1 ? `${e.sets} × ${e.sec}s` : `${Math.round(e.sec / 60)} min`;
    if (e.type === 'sprint') return `${e.sets} × ${e.dist} yd`;
    if (e.type === 'test') return `Up to ${e.sets} attempts`;
    return '';
  },
  setCount(w) { return w.exercises.reduce((n, e) => n + (e.type === 'pct' ? e.scheme.length : e.sets || 1), 0); },
  estMinutes(w) { let s = 0; w.exercises.forEach(e => { const n = e.type === 'pct' ? e.scheme.length : e.sets || 1, work = e.type === 'timed' ? e.sec : e.type === 'test' ? 60 : 40; s += n * (work + (e.rest || 60)); }); return Math.round(s / 60 / 5) * 5; },
  build(w) {
    const s = { id: uid('ses'), tid: w.id, week: w.week, day: w.day, cycle: w.cycle, title: w.title, category: w.category, date: todayISO(), startedAt: Date.now(), endedAt: null, pausedAt: null, pausedMs: 0, status: 'in_progress', cur: 0, notes: '', ex: [], createdAt: Date.now() };
    w.exercises.forEach(e => {
      const def = Program.exDef(e.ex), x = { uid: e.uid, exId: e.ex, name: def.name, cat: def.cat, type: e.type, rest: e.rest || 0, lift: def.lift || null, metric: def.metric || null, dist: e.dist || null, unitLabel: e.unitLabel || null, presc: this.prescText(e), notes: '', skipped: false, sets: [] };
      if (e.type === 'pct') {
        const ref = Calc.refFor(def.lift);
        x.ref = ref ? { w: ref.w, cls: ref.cls } : null;     // frozen reference: later baseline edits never rewrite this session
        e.scheme.forEach(([reps, pct], i) => {
          const t = Calc.target(ref, pct);
          x.sets.push({ id: uid('set'), n: i + 1, warm: false, pReps: reps, pPct: pct, pT: t ? { v: t.rounded, u: t.unit, kg: t.kg, raw: t.raw, roundedUp: t.roundedUp } : null, w: t ? Units.wt(t.rounded, t.unit) : null, reps, done: false, rpe: null, ts: null });
        });
      } else {
        const n = e.sets || 1;
        for (let i = 0; i < n; i++) {
          const st = { id: uid('set'), n: i + 1, warm: false, done: false, ts: null };
          if (e.type === 'reps') Object.assign(st, { pReps: e.reps, reps: e.reps });
          if (e.type === 'timed') Object.assign(st, { pSec: e.sec, sec: e.sec });
          if (e.type === 'sprint') Object.assign(st, { dist: e.dist, sec: null });
          if (e.type === 'test') Object.assign(st, { val: null });
          x.sets.push(st);
        }
      }
      s.ex.push(x);
    });
    return s;
  },
  async start(tid) {
    if (this.busy) return; this.busy = true;
    try {
      const act = this.active();
      if (act) {
        if (act.tid === tid) { Nav.go('workout'); return; }
        const c = await Sheet.choose({ title: 'Unfinished mission', body: `<p>You have <b>${esc(act.title)}</b> (Week ${act.week} · Day ${act.day}) in progress. Finish or resume it before starting another.</p>`, options: [{ id: 'resume', label: 'Resume it', cls: 'primary' }, { id: 'abandon', label: 'Abandon it and start this one', cls: 'danger' }] });
        if (c === 'resume') { Nav.go('workout'); return; }
        if (c !== 'abandon') return;
        await this.abandon(act, true);
      }
      const w = Program.byId(tid); if (!w) return;
      if (Stats.statusOf(tid) === 'completed') {
        const ok = await Sheet.confirm({ title: 'Log this workout again?', body: '<p>This workout is already completed. A second log is kept as its own session; the first one stays on the record.</p>', ok: 'Log again' });
        if (!ok) return;
      }
      const s = this.build(w);
      await this.persist(s, true);
      State.meta.activeSessionId = s.id; Store.saveMeta();
      WakeLock.on();
      Nav.go('workout', null, { big: true });
      Quotes.flash(s);
    } finally { this.busy = false; }
  },
  async persist(s, now = false) {
    s.rev = (s.rev || 0) + 1;
    if (s.status === 'in_progress') LSX.set(LS.active, s); // synchronous mirror survives an abrupt tab close
    if (now) return Store.save('sessions', s);
    State.version++; this._deb = this._deb || debounce(x => Store.save('sessions', x), 350); this._deb(s);
  },
  flush() { if (this._deb) { const s = this.active(); if (s) this._deb.flush(s); } },
  async pause(s) { if (s.pausedAt) { s.pausedMs += Date.now() - s.pausedAt; s.pausedAt = null; } else s.pausedAt = Date.now(); await this.persist(s, true); UI.render(); },
  async saveExit(s) { await this.persist(s, true); UI.toast('Saved. Resume any time from Home.'); Nav.go('home'); },
  async abandon(s, silent) {
    if (!silent) { const ok = await Sheet.confirm({ title: 'Discard this workout?', body: '<p>The session is kept in history as <b>Abandoned</b> and will not count as completed. Logged sets stay visible in its report.</p>', ok: 'Discard workout', danger: true }); if (!ok) return; }
    if (s.pausedAt) { s.pausedMs += Date.now() - s.pausedAt; s.pausedAt = null; }
    s.status = 'abandoned'; s.endedAt = Date.now();
    await Store.save('sessions', s); State.meta.activeSessionId = null; Store.saveMeta(); LSX.del(LS.active); Rest.stop(); WakeLock.off();
    if (!silent) { UI.toast('Workout discarded.'); Nav.go('home'); }
  },
  async finish(s) {
    const open = s.ex.filter(x => !x.skipped).reduce((n, x) => n + x.sets.filter(t => !t.done && !t.warm).length, 0);
    if (open) {
      const ok = await Sheet.confirm({ title: 'Finish the workout?', body: `<p>${open} prescribed set${open > 1 ? 's are' : ' is'} not logged. ${open > 1 ? 'They' : 'It'} will be recorded as not completed.</p>`, ok: 'Finish workout' });
      if (!ok) return;
    }
    if (s.pausedAt) { s.pausedMs += Date.now() - s.pausedAt; s.pausedAt = null; }
    s.status = 'completed'; s.endedAt = Date.now();
    await Store.save('sessions', s);            // saved before any celebration
    State.meta.activeSessionId = null; Store.saveMeta(); LSX.del(LS.active); Rest.stop(); WakeLock.off();
    const fresh = Achievements.evaluate();
    Celebrate.workout(s, fresh);
  },
  async skipWorkout(tid) {
    const w = Program.byId(tid);
    const ok = await Sheet.confirm({ title: `Skip ${w.title}?`, body: '<p>Skipped workouts are recorded honestly, break the streak and do not count toward completion. You can undo this.</p>', ok: 'Skip workout' });
    if (!ok) return;
    await Store.save('sessions', { id: uid('ses'), tid, week: w.week, day: w.day, cycle: w.cycle, title: w.title, category: w.category, date: todayISO(), status: 'skipped', ex: [], startedAt: null, endedAt: null, createdAt: Date.now() });
    Achievements.evaluate(); UI.render();
  },
  async unskip(tid) { const s = State.sessions.filter(x => x.tid === tid && x.status === 'skipped'); for (const x of s) await Store.remove('sessions', x.id); UI.render(); },
  lastPerf(exId, excludeSid) {
    const prev = State.sessions.filter(s => s.status === 'completed' && s.id !== excludeSid && s.ex.some(x => x.exId === exId && x.sets.some(t => t.done))).sort((a, b) => b.endedAt - a.endedAt)[0];
    if (!prev) return null;
    const x = prev.ex.find(x => x.exId === exId), done = x.sets.filter(t => t.done && !t.warm);
    return { date: prev.date, sets: done, type: x.type, metric: x.metric };
  },
  perfText(p) {
    if (!p || !p.sets.length) return null;
    const t = p.sets;
    if (p.type === 'pct') { const top = t.reduce((a, b) => (b.w && (!a.w || b.w.kg > a.w.kg)) ? b : a, t[0]); return `${t.length} sets · top ${Units.fmtW(top.w)} ${State.settings.unit} × ${top.reps}`; }
    if (p.type === 'reps') return `${t.length} sets · ${t.reduce((a, b) => a + (b.reps || 0), 0)} total reps`;
    if (p.type === 'timed') return `${t.length} × ${fmtNum(t[0].sec, 0)}s`;
    if (p.type === 'sprint') { const tm = t.filter(x => x.sec); return `${t.length} reps${tm.length ? ' · best ' + fmtNum(Math.min(...tm.map(x => x.sec)), 2) + 's' : ''}`; }
    if (p.type === 'test') { const v = t.filter(x => x.val); return v.length ? `${v.length} attempts` : null; }
    return null;
  }
};

/* ============ 10. SET LOGGING ============ */
const SetLog = {
  validate(x, t) {
    if (x.type === 'pct') { if (!(t.w && t.w.v > 0)) return 'Enter the weight you lifted.'; if (!(Number.isInteger(t.reps) && t.reps >= 1 && t.reps <= 100)) return 'Reps must be a whole number of at least 1.'; }
    if (x.type === 'reps' && !(Number.isInteger(t.reps) && t.reps >= 0 && t.reps <= 1000)) return 'Reps must be a whole number.';
    if (x.type === 'timed' && !(t.sec > 0 && t.sec < 36000)) return 'Enter the time in seconds.';
    if (x.type === 'sprint' && t.sec != null && !(t.sec > 0 && t.sec < 600)) return 'Sprint time must be a positive number of seconds.';
    if (x.type === 'test' && !(t.val && Units.canon(x.metric, t.val) > 0)) return 'Enter the result you achieved.';
    if (t.rpe != null && !(t.rpe >= 1 && t.rpe <= 10)) return 'RPE must be between 1 and 10.';
    return null;
  },
  /* write a single field from an input into the session model */
  setField(s, ei, si, f, raw) {
    const x = s.ex[ei], t = x && x.sets[si]; if (!t) return;
    const v = String(raw).trim() === '' ? null : Number(String(raw).replace(',', '.'));
    if (v != null && !isFinite(v)) return 'Numbers only.';
    if (f === 'w') t.w = v == null ? null : Units.wt(v, State.settings.unit);
    else if (f === 'reps') t.reps = v == null ? null : v;
    else if (f === 'sec') t.sec = v;
    else if (f === 'rpe') t.rpe = v;
    else if (f === 'val') t.val = v == null ? null : Units.makeMetric(x.metric, v);
    if (t.done) { const err = this.validate(x, t); if (err) return err; t.editedAt = Date.now(); }
    Workout.persist(s);
    if (t.done && x.type === 'test') PR.recordFromSession(s, x);
    return null;
  },
  async toggle(s, ei, si, btn) {
    const x = s.ex[ei], t = x.sets[si];
    if (t.done) { t.done = false; t.ts = null; await Workout.persist(s, true); if (x.type === 'test') await PR.recordFromSession(s, x); UI.renderLogger(); return; }
    const err = this.validate(x, t);
    if (err) { UI.toast(err, 'bad'); const row = $(`[data-set="${ei}-${si}"]`); if (row) Motion.anim(row, [{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], { duration: 260 }); return; }
    t.done = true; t.ts = Date.now();
    await Workout.persist(s, true);         // immediate persistence
    let pr = null;
    if (x.type === 'test') pr = await PR.recordFromSession(s, x);
    UI.renderLogger({ pulse: `${ei}-${si}` });
    if (!t.warm && x.rest && !pr) Rest.offer(x.rest);
    if (pr) Celebrate.pr(pr);
    // all prescribed sets finished → bring the next exercise into focus (never blocks logging)
    if (x.sets.every(z => z.done || z.warm) && ei === s.cur) {
      const nxt = s.ex.findIndex((z, i) => i > ei && !z.skipped && z.sets.some(q => !q.done));
      if (nxt > -1) setTimeout(() => { const a = Workout.active(); if (a && a.cur === ei) { a.cur = nxt; Workout.persist(a); UI.renderLogger({ dir: 1 }); } }, Motion.off ? 0 : 750);
    }
  },
  addSet(s, ei, warm) {
    const x = s.ex[ei], base = x.sets.find(t => !t.warm) || {};
    const t = { id: uid('set'), n: 0, warm, extra: true, done: false, ts: null };
    if (x.type === 'pct') Object.assign(t, { pReps: warm ? null : base.pReps, pPct: warm ? null : base.pPct, pT: null, w: warm && base.w ? Units.wt(Math.max(0, Math.round(Units.showW(base.w) * .5 / Units.inc()) * Units.inc()), State.settings.unit) : base.w ? Object.assign({}, base.w) : null, reps: warm ? 5 : base.reps, rpe: null });
    if (x.type === 'reps') Object.assign(t, { pReps: base.pReps, reps: base.reps });
    if (x.type === 'timed') Object.assign(t, { pSec: base.pSec, sec: base.sec });
    if (x.type === 'sprint') Object.assign(t, { dist: x.dist, sec: null });
    if (x.type === 'test') Object.assign(t, { val: null });
    if (warm) x.sets.unshift(t); else x.sets.push(t);
    this.renumber(x); Workout.persist(s, true); UI.renderLogger();
  },
  async removeSet(s, ei, si) { const x = s.ex[ei]; x.sets.splice(si, 1); this.renumber(x); await Workout.persist(s, true); if (x.type === 'test') await PR.recordFromSession(s, x); UI.renderLogger(); },
  renumber(x) { let n = 0; x.sets.forEach(t => { if (!t.warm) t.n = ++n; }); }
};

/* ============ 11. PERSONAL RECORD TRACKING ============
   Results have a classification: 'tested' (a real max attempt), 'recorded' (a logged best).
   A result is a PR only when it is TESTED and strictly beats every earlier result and the
   baseline (if the baseline was a tested or recorded max). Estimated maxima are never PRs. */
const PR = {
  better: (metric, a, b) => METRICS[metric].better === 'higher' ? a > b : a < b,
  baseline(metric) {
    const p = State.profile; if (!p) return null; const m = METRICS[metric];
    if (m.lift) { const b = p.baselines && p.baselines[m.lift]; return b && b.w ? { o: b.w, value: b.w.kg, cls: b.cls, date: b.date || p.startDate } : null; }
    const a = p.athletic && p.athletic[metric]; return a && a.o ? { o: a.o, value: Units.canon(metric, a.o), cls: a.cls || 'recorded', date: a.date || p.startDate } : null;
  },
  /* annotate results chronologically: r._pr, r._prev (previous best value object) */
  annotate() {
    const out = {};
    Object.keys(METRICS).forEach(metric => {
      const b = this.baseline(metric), comparable = b && (b.cls === 'tested' || b.cls === 'recorded');
      let best = comparable ? { value: b.value, o: b.o, src: 'baseline' } : null;
      const rs = State.results.filter(r => r.metric === metric).sort((a, c) => (a.date || '').localeCompare(c.date || '') || (a.createdAt - c.createdAt));
      rs.forEach(r => {
        const v = Units.canon(metric, r.o); r._prev = best; r._pr = false;
        if (!best || this.better(metric, v, best.value)) { r._pr = r.cls === 'tested' && !!best; best = { value: v, o: r.o, src: r.id }; }
      });
      out[metric] = { baseline: b, results: rs, best: rs.length ? rs.reduce((a, c) => this.better(metric, Units.canon(metric, c.o), Units.canon(metric, a.o)) ? c : a) : null, latest: rs[rs.length - 1] || null };
    });
    return out;
  },
  /* keep one result per (session, metric) = best completed attempt. Returns PR info if this write produced a new PR. */
  async recordFromSession(s, x) {
    const metric = x.metric; if (!metric) return null;
    const vals = x.sets.filter(t => t.done && t.val).map(t => t.val);
    const id = `${s.id}:${metric}`, existing = State.results.find(r => r.id === id);
    if (!vals.length) { if (existing) await Store.remove('results', id); return null; }
    const best = vals.reduce((a, c) => this.better(metric, Units.canon(metric, c), Units.canon(metric, a)) ? c : a);
    if (existing && Units.canon(metric, existing.o) === Units.canon(metric, best)) return null;
    const r = Object.assign(existing || { id, metric, sid: s.id, week: s.week, cls: 'tested', src: 'session', createdAt: Date.now(), notes: '' }, { o: best, date: s.date });
    await Store.save('results', r);
    this.annotate();
    if (r._pr) { Achievements.evaluate(); return { metric, o: r.o, prev: r._prev }; }
    return null;
  }
};

/* ============ 12. ANALYTICS ============ */
const Stats = {
  _c: null, _v: -1, _u: null,
  get() {
    if (this._c && this._v === State.version && this._u === State.settings.unit + State.settings.includeWarmups) return this._c;
    this._v = State.version; this._u = State.settings.unit + State.settings.includeWarmups; return (this._c = this.compute());
  },
  statusOf(tid) {
    const ss = State.sessions.filter(s => s.tid === tid);
    if (ss.some(s => s.status === 'completed')) return 'completed';
    if (ss.some(s => s.status === 'in_progress')) return 'in_progress';
    if (ss.some(s => s.status === 'skipped')) return 'skipped';
    const w = Program.byId(tid), d = w && Program.schedDate(w);
    if (d && d < todayISO()) return 'missed';
    if (d && d === todayISO()) return 'due';
    return 'upcoming';
  },
  setVolumeKg(x, t) { return (x.type === 'pct' && t.done && t.w && t.reps > 0 && (!t.warm || State.settings.includeWarmups)) ? t.w.kg * t.reps : 0; },
  sessionStats(s) {
    let vol = 0, sets = 0, reps = 0, dist = 0, secs = 0, exDone = 0;
    (s.ex || []).forEach(x => {
      let any = false;
      x.sets.forEach(t => {
        if (!t.done) return; any = true;
        if (!t.warm) sets++;
        vol += this.setVolumeKg(x, t);
        if ((x.type === 'pct' || x.type === 'reps') && !t.warm) reps += t.reps || 0;
        if (x.type === 'sprint') { dist += t.dist || 0; if (t.sec) secs += t.sec; }
        if (x.type === 'timed' && x.cat !== 'core') secs += t.sec || 0;
      });
      if (any) exDone++;
    });
    const total = (s.ex || []).reduce((n, x) => n + x.sets.filter(t => !t.warm).length, 0);
    return { vol, sets, reps, dist, secs, exDone, exTotal: (s.ex || []).length, total, prs: State.results.filter(r => r.sid === s.id && r._pr).length };
  },
  compute() {
    const P = State.program, today = todayISO(), prof = State.profile || {};
    PR.annotate();
    const completed = State.sessions.filter(s => s.status === 'completed');
    const order = P.workouts, status = {}; order.forEach(w => status[w.id] = this.statusOf(w.id));
    const doneTids = new Set(completed.map(s => s.tid));
    let vol = 0, sets = 0, reps = 0, dist = 0, secs = 0;
    completed.forEach(s => { const st = this.sessionStats(s); vol += st.vol; sets += st.sets; reps += st.reps; dist += st.dist; secs += st.secs; });
    // streak rule: consecutive scheduled workouts (program order) completed; a skipped or past-due unfinished workout breaks it.
    const due = order.filter(w => { const d = Program.schedDate(w); return (d && d <= today) || doneTids.has(w.id); });
    let run = 0, longest = 0;
    order.forEach(w => { const st = status[w.id]; if (st === 'completed') { run++; longest = Math.max(longest, run); } else if (st === 'skipped' || st === 'missed') run = 0; });
    // current streak counts back from the latest scheduled workout; not-yet-due workouts are ignored
    let cur = 0, started = false;
    for (let i = order.length - 1; i >= 0; i--) { const st = status[order[i].id]; if (st === 'completed') { cur++; started = true; } else if (st === 'skipped' || st === 'missed') break; else if (started) break; }
    const dueCount = order.filter(w => { const d = Program.schedDate(w); return d && d < today; }).length + order.filter(w => Program.schedDate(w) === today && status[w.id] === 'completed').length;
    const doneOfDue = order.filter(w => { const d = Program.schedDate(w); return d && d <= today && status[w.id] === 'completed'; }).length;
    const missed = order.filter(w => status[w.id] === 'missed').length, skipped = order.filter(w => status[w.id] === 'skipped').length;
    const weekly = Array.from({ length: P.weeks }, (_, i) => { const ws = order.filter(w => w.week === i + 1); return { week: i + 1, scheduled: ws.length, done: ws.filter(w => status[w.id] === 'completed').length, vol: completed.filter(s => s.week === i + 1).reduce((a, s) => a + this.sessionStats(s).vol, 0) }; });
    const weeksComplete = weekly.filter(w => w.done === w.scheduled && w.scheduled).length;
    let curWeek = 1, preSeason = false;
    if (prof.startDate) { const d = daysBetween(prof.startDate, today); preSeason = d < 0; curWeek = preSeason ? 1 : Math.floor(d / 7) + 1; }
    const programWeek = clamp(curWeek, 1, P.weeks);
    const next = order.find(w => status[w.id] !== 'completed' && status[w.id] !== 'skipped') || null;
    const firstDate = completed.length ? completed.map(s => s.date).sort()[0] : null;
    const spanWeeks = firstDate ? Math.max(1, Math.ceil((daysBetween(firstDate, today) + 1) / 7)) : 0;
    const pr = PR.annotate();
    const prCount = State.results.filter(r => r._pr).length;
    const testIds = order.filter(w => w.category === 'test').map(w => w.id);
    const testingDone = testIds.length > 0 && testIds.every(id => status[id] === 'completed');
    return {
      status, completed, doneUnique: doneTids.size, total: order.length, programPct: order.length ? order.filter(w => status[w.id] === 'completed').length / order.length : 0,
      vol, sets, reps, dist, secs, streak: cur, longest, adherence: dueCount ? doneOfDue / dueCount : null, dueCount, doneOfDue, missed, skipped,
      weekly, weeksComplete, curWeek, programWeek, preSeason, postProgram: curWeek > P.weeks, next, avgPerWeek: spanWeeks ? completed.length / spanWeeks : 0,
      pr, prCount, testingDone, bw: this.bwSeries()
    };
  },
  bwSeries() {
    const p = State.profile, pts = [];
    if (p && p.initialBw) pts.push({ date: p.bwDate || p.startDate || toISO(new Date(p.createdAt || Date.now())), o: p.initialBw, initial: true, id: 'initial' });
    State.bodyweight.slice().sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt).forEach(e => pts.push({ date: e.date, o: e.w, id: e.id }));
    return pts;
  },
  currentBw() { const s = this.bwSeries(); return s.length ? s[s.length - 1].o : null; },
  estimates(lift) {
    // Epley estimates from completed working sets, kept separate from tested values
    const out = [];
    State.sessions.filter(s => s.status === 'completed').forEach(s => s.ex.forEach(x => { if (x.type !== 'pct' || x.lift !== lift || x.exId === 'clean_pull') return; let best = null; x.sets.forEach(t => { if (!t.done || t.warm || !t.w) return; const e = Calc.epley(t.w.kg, t.reps); if (e && (!best || e > best.kg)) best = { kg: e, from: t }; }); if (best) out.push({ date: s.date, kg: best.kg, from: best.from, sid: s.id }); }));
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }
};

/* ============ 13. ACHIEVEMENT ENGINE ============ */
const ACH = [
  { id: 'first_workout', name: 'First Snap', desc: 'Completed your first workout.', test: s => s.completed.length >= 1 },
  { id: 'first_week', name: 'First Drive', desc: 'Completed every workout in a training week.', test: s => s.weeksComplete >= 1 },
  { id: 'streak_3', name: 'Three and Out', desc: 'Three scheduled workouts completed in a row.', test: s => s.longest >= 3 },
  { id: 'streak_8', name: 'Two-Week Drive', desc: 'Eight scheduled workouts completed in a row.', test: s => s.longest >= 8 },
  { id: 'streak_16', name: 'Iron Line', desc: 'Sixteen scheduled workouts completed in a row.', test: s => s.longest >= 16 },
  { id: 'prog_25', name: 'First Quarter', desc: '25% of the program completed.', test: s => s.programPct >= .25 },
  { id: 'prog_50', name: 'Halftime', desc: '50% of the program completed.', test: s => s.programPct >= .5 },
  { id: 'prog_75', name: 'Fourth Quarter', desc: '75% of the program completed.', test: s => s.programPct >= .75 },
  { id: 'prog_100', name: 'Full Season', desc: 'Every scheduled workout completed.', test: s => s.programPct >= 1 },
  { id: 'sets_100', name: '100 Working Sets', desc: '100 working sets logged.', test: s => s.sets >= 100 },
  { id: 'sets_250', name: '250 Working Sets', desc: '250 working sets logged.', test: s => s.sets >= 250 },
  { id: 'sets_500', name: '500 Working Sets', desc: '500 working sets logged.', test: s => s.sets >= 500 },
  { id: 'reliable', name: 'Reliable', desc: '90%+ adherence after at least 8 scheduled workouts.', test: s => s.dueCount >= 8 && s.adherence >= .9 },
  { id: 'testing_done', name: 'Game Day', desc: 'Completed every Week 11 testing session.', test: s => s.testingDone }
];
const Achievements = {
  evaluate() {
    const s = Stats.get(), have = new Map(State.achievements.map(a => [a.id, a])), fresh = [], valid = new Set();
    ACH.forEach(a => { if (a.test(s)) { valid.add(a.id); if (!have.has(a.id)) fresh.push({ id: a.id, type: 'milestone', name: a.name, desc: a.desc, date: todayISO(), createdAt: Date.now() }); } });
    State.results.filter(r => r._pr).forEach(r => {
      const id = 'pr_' + r.id, m = METRICS[r.metric]; valid.add(id);
      if (!have.has(id)) fresh.push({ id, type: m.group === 'strength' ? 'strength_pr' : (m.kind === 'time' ? 'sprint_best' : 'jump_best'), name: `${m.name} PR`, desc: `${Units.showMetric(r.metric, r.o)} — new personal record`, date: r.date, result: r.id, workout: r.sid || null, createdAt: Date.now() });
    });
    fresh.forEach(a => Store.save('achievements', a));
    // achievements are data-driven: remove any whose evidence was edited away
    State.achievements.filter(a => !valid.has(a.id)).forEach(a => Store.remove('achievements', a.id));
    return fresh;
  },
  def: id => ACH.find(a => a.id === id)
};

/* wake lock while a workout is active (optional) */

  async on() { try { if (navigator.wakeLock && !this.lock) { this.lock = await navigator.wakeLock.request('screen'); this.lock.addEventListener('release', () => this.lock = null); } } catch (e) { this.lock = null; } },
  off() { try { this.lock && this.lock.release(); } catch (e) { } this.lock = null; }
};

/* ============ REST TIMER (timestamp based — accurate in background tabs) ============ */
const Rest = {
  t: null, iv: null,
  get st() { return State.meta.timer; },
  save() { Store.saveMeta(); },
  offer(sec) {
    const d = sec || State.settings.restDefault;
    State.meta.timer = { duration: d, endAt: null, remaining: d, running: false, done: false };
    if (State.settings.restAuto) this.start(); else { this.save(); this.render(); }
  },
  start() { const t = this.st; if (!t) return; t.endAt = Date.now() + t.remaining * 1000; t.running = true; t.done = false; this.save(); this.loop(); this.render(); },
  pause() { const t = this.st; if (!t || !t.running) return; t.remaining = Math.max(0, (t.endAt - Date.now()) / 1000); t.running = false; t.endAt = null; this.save(); this.render(); },
  reset() { const t = this.st; if (!t) return; t.remaining = t.duration; t.running = false; t.endAt = null; t.done = false; this.save(); this.render(); },
  add(s) { const t = this.st; if (!t) return; if (t.running) t.endAt = Math.max(Date.now(), t.endAt + s * 1000); else t.remaining = Math.max(0, t.remaining + s); t.duration = Math.max(15, t.duration + s); t.done = false; this.save(); this.render(); },
  stop() { State.meta.timer = null; this.save(); clearInterval(this.iv); this.iv = null; this.render(); },
  left() { const t = this.st; if (!t) return 0; return t.running ? Math.max(0, (t.endAt - Date.now()) / 1000) : t.remaining; },
  loop() { clearInterval(this.iv); this.iv = setInterval(() => this.tick(), 250); },
  tick() {
    const t = this.st; if (!t) { clearInterval(this.iv); return; }
    if (t.running && Date.now() >= t.endAt) { t.running = false; t.remaining = 0; t.done = true; this.save(); Haptics.beep(); Haptics.buzz(); UI.toast('Rest complete. Next set.'); }
    this.paint();
  },
  render() {
    const el = $('#rest'), t = this.st, show = !!t && !!Workout.active() && UI.route.name === 'workout';
    el.hidden = !show; document.body.classList.toggle('rest-on', show);
    if (!show) return;
    el.innerHTML = `<div class="dock">
      <div class="rring" aria-hidden="true"><svg viewBox="0 0 46 46" width="46" height="46"><circle cx="23" cy="23" r="20" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle id="restArc" cx="23" cy="23" r="20" fill="none" stroke="${C.glow}" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="0"/></svg></div>
      <div class="grow"><div class="label">${t.done ? 'Rest complete' : t.running ? 'Resting' : 'Rest ready'}</div><div class="rt" id="restT">0:00</div><div class="rq">${esc(Quotes.forRest())}</div></div>
      <button class="btn icon sm" type="button" data-act="rest-add" data-v="-15" aria-label="Remove 15 seconds">−15</button>
      <button class="btn icon sm" type="button" data-act="rest-add" data-v="15" aria-label="Add 15 seconds">+15</button>
      ${t.running ? `<button class="btn icon sm primary" type="button" data-act="rest-pause" aria-label="Pause rest">${icon('pause')}</button>` : `<button class="btn icon sm primary" type="button" data-act="rest-start" aria-label="${t.remaining < t.duration && !t.done ? 'Resume rest' : 'Start rest'}">${icon('play')}</button>`}
      <button class="btn icon sm" type="button" data-act="rest-reset" aria-label="Reset rest">${icon('rotate-ccw')}</button>
      <button class="btn icon sm" type="button" data-act="rest-skip" aria-label="Skip rest">${icon('x')}</button></div>`;
    el.classList.toggle('done', !!t.done);
    UI.icons(el); this.paint();
    if (t.running) this.loop();
  },
  paint() {
    const t = this.st, tx = $('#restT'), arc = $('#restArc'); if (!t || !tx) return;
    const l = this.left(); tx.textContent = fmtDur(Math.ceil(l) * 1000);
    if (arc) arc.setAttribute('stroke-dashoffset', String(125.66 * (1 - (t.duration ? l / t.duration : 0))));
  }
};

/* ============ 14. NAVIGATION ============ */
const TABS = ['home', 'training', 'workout', 'progress', 'more'];
const TAB_OF = { home: 'home', training: 'training', workout: 'workout', progress: 'progress', more: 'more', history: 'more', session: 'more', settings: 'more', profile: 'more', backup: 'more', summary: 'more', about: 'more' };
const Nav = {
  stack: [],
  go(name, param = null, opts = {}) {
    const prev = UI.route, pt = TABS.indexOf(TAB_OF[prev.name]), nt = TABS.indexOf(TAB_OF[name]);
    if (opts.back) this.stack.pop(); else if (TAB_OF[name] === TAB_OF[prev.name] && name !== prev.name && !opts.replace) this.stack.push(prev); else if (!opts.keep) this.stack = [];

          f.style.transform = `translateZ(${z.toFixed(1)}px)`;
          f.style.opacity = z > 200 ? Math.max(0, (300 - z) / 100) : clamp((z + 1680) / 700, 0, 1);
        });
      }
      this.raf = requestAnimationFrame(tick);
    };
    if (!this.raf) this.raf = requestAnimationFrame(tick);
  },
  /* about two seconds from black to title: skyline → stadium rises → louvres light up blue → title */
  play(onDone) {
    this.onDone = onDone; this.build();
    const el = $('#intro'); el.hidden = false; el.className = ''; $('#flash').style.opacity = 0;
    $$('#tunnel .tf').forEach(f => { f.style.opacity = 0; });
    this.stars(); this.speed = .4; this.camZ = 0; this.loop();
    $('#enterStadium').disabled = false;
    const name = Motion.modeName();
    if (name === 'minimal') { this.finish(); return; }
    const T = name === 'cinematic' ? [40, 250, 650, 1100, 1550] : [0, 120, 320, 560, 850];
    ['s-a', 's-b', 's-c', 's-lit', 's-e'].forEach((c, i) => this.timers.push(setTimeout(() => el.classList.add(c), T[i])));
    setTimeout(() => $('#skipIntro').focus({ preventScroll: true }), 50);
  },
  finish() { this.timers.forEach(clearTimeout); this.timers = []; $('#intro').classList.add('s-a', 's-b', 's-c', 's-lit', 's-e'); setTimeout(() => $('#enterStadium').focus({ preventScroll: true }), 50); },
  /* press: lights flare, the camera pushes through the gate and down the tunnel */
  enter() {
    const btn = $('#enterStadium'); if (btn.disabled) return; btn.disabled = true;
    Motion.press(btn); this.finish();
    const el = $('#intro');
    const done = () => { cancelAnimationFrame(this.raf); this.raf = null; el.hidden = true; this.onDone && this.onDone(); };
    if (Motion.off) return done();
    el.classList.add('s-d');
    const dur = Motion.modeName() === 'cinematic' ? 950 : 550, t0 = performance.now();
    Motion.anim($('#intro .ui'), [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(30px) scale(.97)' }], { duration: dur * .4, fill: 'forwards', easing: EASE.io });
    const acc = t => { const k = clamp((t - t0) / dur, 0, 1); this.speed = .4 + k * k * 7; $('#flash').style.opacity = Math.max(0, (k - .65) / .35); if (k < 1) requestAnimationFrame(acc); else setTimeout(done, 60); };
    requestAnimationFrame(acc);
    Haptics.tap();
  }
};

/* football-field progress strip: 11 yard lines, the route drawn to the current position */
function fieldStrip(pct) {
  let lines = '', nums = ['G', '10', '20', '30', '40', '50', '40', '30', '20', '10', 'G'];
  for (let i = 0; i <= 10; i++) { const x = 21 + i * 25.8; lines += `<line x1="${x}" y1="6" x2="${x}" y2="54" stroke="rgba(255,255,255,${i === 0 || i === 10 ? .5 : .16})" stroke-width="${i === 0 || i === 10 ? 1.4 : 1}"/><text x="${x}" y="58" text-anchor="middle" fill="rgba(255,255,255,.35)" font-size="6" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="800">${nums[i]}</text>`; for (let k = 1; k < 5 && i < 10; k++) { const hx = x + k * 5.16; lines += `<line x1="${hx}" y1="22" x2="${hx}" y2="25" stroke="rgba(255,255,255,.12)"/><line x1="${hx}" y1="35" x2="${hx}" y2="38" stroke="rgba(255,255,255,.12)"/>`; } }
  const endX = 21 + pct * 258;
  let d = `M21 30`; const n = 12; for (let i = 1; i <= n; i++) { const x = 21 + (endX - 21) * i / n, y = 30 + Math.sin(i * 1.1) * 9 * (i < n ? 1 : 0); d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
  return `<div class="field-strip" aria-label="Program progress ${Math.round(pct * 100)} percent"><svg viewBox="0 0 300 62" preserveAspectRatio="none" aria-hidden="true">${lines}
    <path d="M21 30 H279" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 4" fill="none"/>
    <path class="route-draw" d="${d}" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 0 3px #A5ACAF)"/>
    <g transform="translate(${endX.toFixed(1)} 30)"><ellipse rx="6" ry="3.8" fill="#A71930" stroke="#fff" stroke-width="1"/><path d="M-2.5 0h5" stroke="#fff" stroke-width=".8"/></g></svg></div>`;
}

/* ---- simple accessible SVG charts (all values are real recorded data) ---- */
const Chart = {
  nice(min, max, n = 4) {
    if (min === max) { min -= 1; max += 1; }
    const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag, step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    return { lo, hi, ticks };
  },
  line({ series, hline, yUnit = '', dec = 1, h = 200, title = 'Chart' }) {
    const all = series.flatMap(s => s.pts); if (!all.length) return '';
    const W = 340, L = 44, R = 14, T = 14, B = 28;
    const xs = all.map(p => p.t), ys = all.map(p => p.y).concat(hline ? [hline.y] : []);
    let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 86400000 * 3; x1 += 86400000 * 3; }
    const pad = (Math.max(...ys) - Math.min(...ys)) * .12 || Math.abs(ys[0]) * .05 || 1;
    const { lo, hi, ticks } = this.nice(Math.min(...ys) - pad, Math.max(...ys) + pad);
    const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (h - T - B);
    let g = `<g class="grid">${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${fmtNum(v, dec)}</text>`).join('')}</g>`;
    const dts = [x0, (x0 + x1) / 2, x1].map(t => { const d = new Date(t); return `<text x="${X(t).toFixed(1)}" y="${h - 8}" text-anchor="middle">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</text>`; }).join('');
    let body = '';
    if (hline) body += `<line x1="${L}" x2="${W - R}" y1="${Y(hline.y).toFixed(1)}" y2="${Y(hline.y).toFixed(1)}" class="hline" stroke="#A5ACAF" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - R}" y="${(Y(hline.y) - 5).toFixed(1)}" text-anchor="end" class="hl-t">${esc(hline.label)}</text>`;
    series.forEach(s => {
      const pts = s.pts.slice().sort((a, b) => a.t - b.t);
      if (pts.length > 1) body += `<path class="cline" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ')}" fill="none" stroke="${Theme.c(s.color)}" stroke-width="2.2" ${s.dashed ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach(p => body += `<g class="pt" tabindex="0" role="button" data-tip="${esc(p.tip)}" aria-label="${esc(p.tip)}"><circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="11" fill="transparent"/><circle class="dot" cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.big ? 5.5 : 4}" fill="${s.hollow ? Theme.c('#050B1F') : Theme.c(p.color || s.color)}" stroke="${Theme.c(p.color || s.color)}" stroke-width="2"/></g>`);
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(title)}"><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${h - B}"/><line class="axis" x1="${L}" x2="${W - R}" y1="${h - B}" y2="${h - B}"/>${g}${dts}${body}<text x="${L}" y="9" text-anchor="start">${esc(yUnit)}</text></svg><div class="chart-tip" aria-live="polite">Tap a point for details.</div>`;
  },
  bars({ items, fmt = v => fmtNum(v, 0), h = 170, title = 'Chart', max }) {
    const W = 340, L = 8, R = 8, T = 18, B = 24, n = items.length; if (!n) return '';
    const mx = max || Math.max(1, ...items.map(i => Math.max(i.v, i.v2 || 0)));
    const bw = (W - L - R) / n, Y = v => T + (1 - v / mx) * (h - T - B);
    const body = items.map((it, i) => {
      const x = L + i * bw + bw * .18, w = bw * .64;
      const bg = it.v2 != null ? `<rect x="${x.toFixed(1)}" y="${Y(it.v2).toFixed(1)}" width="${w.toFixed(1)}" height="${(h - B - Y(it.v2)).toFixed(1)}" rx="3" fill="rgba(165,172,175,.12)"/>` : '';
      return `${bg}<g class="pt" tabindex="0" role="button" data-tip="${esc(it.tip)}" aria-label="${esc(it.tip)}"><rect class="bar" x="${x.toFixed(1)}" y="${Y(it.v).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, h - B - Y(it.v)).toFixed(1)}" rx="3" fill="${it.hl ? '#A71930' : '#1B3B93'}" style="transform-origin:${(x + w / 2).toFixed(1)}px ${h - B}px"/></g>
        <text x="${(x + w / 2).toFixed(1)}" y="${h - 9}" text-anchor="middle">${esc(it.label)}</text>${it.v ? `<text x="${(x + w / 2).toFixed(1)}" y="${(Y(it.v) - 4).toFixed(1)}" text-anchor="middle" class="vl">${fmt(it.v)}</text>` : ''}`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(title)}"><line class="axis" x1="${L}" x2="${W - R}" y1="${h - B}" y2="${h - B}"/>${body}</svg><div class="chart-tip" aria-live="polite">Tap a bar for details.</div>`;
  }
};

  /* ---------- Training: journey, plan, library, calculator ---------- */

    const body = tab === 'plan' ? this.plan() : tab === 'library' ? this.library() : tab === 'calc' ? this.calc() : this.journey();
    return `<div class="screen"><div class="topbar" data-stg><h1 class="h2">Training</h1>${sampleTag()}</div>${Quotes.ticker(Quotes.today() + 5)}
      <div class="seg" role="tablist" data-stg>${tabs.map(([k, l]) => `<button type="button" role="tab" data-act="go" data-r="training" data-p="${k}" aria-pressed="${tab === k}" aria-selected="${tab === k}">${l}</button>`).join('')}</div>${body}</div>`;
  },
  journey() {
    const st = Stats.get(); const sel = UI.ui.selWeek || st.programWeek;
    return `${Season.html(st, { compact: true, key: 'season-j' })}<div class="two"><div class="journey" data-stg>${this.journeyMap(st, sel)}</div><div id="weekDetail" class="week-detail stack">${this.weekDetail(sel, st)}</div></div>`;
  },
  journeyMap(st, sel) {
    const W = 360, top = 70, gap = 112, n = State.program.weeks, H = top + (n - 1) * gap + 110;
    const xs = [108, 252, 108, 252, 108, 252, 108, 252, 108, 252, 108];
    const pts = Array.from({ length: n }, (_, i) => ({ x: xs[i % xs.length], y: top + i * gap }));
    const pathOf = arr => arr.map((p, i) => i ? `C${arr[i - 1].x} ${(arr[i - 1].y + gap / 2).toFixed(0)} ${p.x} ${(p.y - gap / 2).toFixed(0)} ${p.x} ${p.y}` : `M${p.x} ${p.y}`).join(' ');
    const yard = ['G', '10', '20', '30', '40', '50', '40', '30', '20', '10', 'G'];
    let field = '';
    pts.forEach((p, i) => { field += `<line x1="16" x2="${W - 16}" y1="${p.y}" y2="${p.y}" stroke="rgba(255,255,255,${i === 0 || i === n - 1 ? .45 : .14})" stroke-width="${i === 0 || i === n - 1 ? 2 : 1}"/><text x="26" y="${p.y - 6}" fill="rgba(255,255,255,.28)" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="800" font-size="15">${yard[i] || ''}</text>`; if (i < n - 1) for (let k = 1; k < 5; k++) { const y = p.y + k * gap / 5; field += `<line x1="128" x2="140" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.1)"/><line x1="220" x2="232" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.1)"/>`; } });
    const endY = pts[n - 1].y;
    field += `<rect x="16" y="${endY}" width="${W - 32}" height="80" fill="url(#ez)"/><text x="${W / 2}" y="${endY + 54}" text-anchor="middle" fill="rgba(255,255,255,.5)" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="30" letter-spacing="6">GAME DAY</text>`;
    const done = st.weekly.map(w => w.done === w.scheduled && w.scheduled > 0), curIdx = Math.max(0, done.findIndex(d => !d)), litTo = done.every(Boolean) ? n - 1 : curIdx;
    const ms = pts.map((p, i) => {
      const w = st.weekly[i], isDone = done[i], isCur = i === litTo && !done.every(Boolean), isSel = i + 1 === sel, right = p.x < 180;
      const lx = right ? p.x + 30 : p.x - 30, anchor = right ? 'start' : 'end';
      return `<g class="ms" tabindex="0" role="button" data-act="week" data-w="${i + 1}" aria-label="Week ${i + 1}, ${WEEK_LABELS[i]}, ${w.done} of ${w.scheduled} workouts done" aria-pressed="${isSel}">
        <circle class="hit" cx="${p.x}" cy="${p.y}" r="26" fill="transparent"/>
        ${isCur ? `<circle class="cur-ring" cx="${p.x}" cy="${p.y}" r="24" fill="none" stroke="#A71930" stroke-width="2.5"/>` : ''}
        ${isSel ? `<circle cx="${p.x}" cy="${p.y}" r="${isCur ? 29 : 25}" fill="none" stroke="#fff" stroke-width="1.2" stroke-dasharray="3 3"/>` : ''}
        <circle cx="${p.x}" cy="${p.y}" r="19" fill="${isDone ? '#FFFFFF' : isCur ? '#A71930' : '#0B2265'}" stroke="${isDone ? '#fff' : '#A5ACAF'}" stroke-width="2"/>
        ${isDone ? `<path d="M${p.x - 7} ${p.y} l5 5 l9 -10" stroke="#0B2265" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : `<text x="${p.x}" y="${p.y + 6}" text-anchor="middle" fill="#fff" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="18">${i + 1}</text>`}
        <text class="ml" x="${lx}" y="${p.y - 3}" text-anchor="${anchor}" fill="${isSel ? '#fff' : '#A5ACAF'}" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="800" font-size="14" letter-spacing=".3" paint-order="stroke" stroke="#071233" stroke-width="5">${WEEK_LABELS[i] || 'WEEK ' + (i + 1)}</text>
        <text class="ml" x="${lx}" y="${p.y + 13}" text-anchor="${anchor}" fill="#A5ACAF" font-family="JetBrains Mono,monospace" font-size="9.5" letter-spacing="1" paint-order="stroke" stroke="#071233" stroke-width="4">WK ${i + 1} · ${w.done}/${w.scheduled}${i === n - 1 ? ' · TESTING' : ''}</text></g>`;
    }).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Eleven-week journey map"><defs><pattern id="ez" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="rgba(167,25,48,.28)"/><line x1="0" y1="0" x2="0" y2="14" stroke="rgba(255,255,255,.12)" stroke-width="5"/></pattern></defs>
      ${field}<path d="${pathOf(pts)}" fill="none" stroke="rgba(165,172,175,.25)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
      <path class="route-draw" d="${pathOf(pts.slice(0, litTo + 1))}" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="drop-shadow(0 0 6px #A5ACAF)"/>${ms}</svg>`;
  },
  weekDetail(n, st) {

  },

  libList() {
    const f = UI.ui, q = f.libQ.trim().toLowerCase();

    const items = Object.entries(EXERCISES).filter(([id, e]) => {
      if (f.libCat !== 'all' && e.cat !== f.libCat) return false;
      if (f.libEquip !== 'all' && !e.equip.split(/,\s*/).includes(f.libEquip)) return false;
      if (q && !(e.name + ' ' + e.muscles + ' ' + e.cat + ' ' + e.equip).toLowerCase().includes(q)) return false;
      const ws = used[id] || [];
      if (f.libCycle !== 'all' && !ws.some(w => w.cycle == f.libCycle)) return false;
      if (f.libWeek !== 'all' && !ws.some(w => w.week == f.libWeek)) return false;

  calc() {

    const wi = Number(String(f.calcWhatIf).replace(',', '.')), what = f.calcWhatIf !== '' && wi > 0 ? { w: Units.wt(wi, u), cls: 'training', whatIf: true } : null;
    const ref = what || ref0, pct = +f.calcPct, t = Calc.target(ref, pct), other = u === 'lb' ? 'kg' : 'lb', tOther = Calc.target(ref, pct, other, other === 'kg' ? State.settings.incKg : State.settings.incLb);

      <div class="field"><label for="calcWhatIf">What-if max (not saved)</label><div class="input-unit"><input class="input num" id="calcWhatIf" inputmode="decimal" placeholder="${ref0 ? 'Using your baseline' : 'Enter a max to explore'}" value="${esc(f.calcWhatIf)}" data-ui="calcWhatIf"><span>${u}</span></div></div>
      <div class="field"><label for="calcPct">Percentage · <b id="calcPctOut" class="num acc">${pct}%</b></label><input type="range" id="calcPct" min="46" max="106" step="0.5" value="${pct}" data-ui="calcPct"></div>

      ${ref ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>%</th><th>Raw</th><th>Target</th><th>${other}</th></tr></thead><tbody>${[...new Set(rows.concat(used))].sort((a, b) => a - b).map(p => { const a = Calc.target(ref, p), b = Calc.target(ref, p, other, other === 'kg' ? State.settings.incKg : State.settings.incLb); return `<tr class="${p === pct ? 'hl' : ''} ${p > 100 ? 'over' : ''}" data-act="ui" data-k="calcPct" data-v="${p}" style="cursor:pointer"><td>${p}%${used.includes(p) ? ' <span class="badge blue">PLAN</span>' : ''}${p > 100 ? ' <span class="badge red">&gt;100</span>' : ''}</td><td>${fmtNum(a.raw, 1)}</td><td><b>${fmtNum(a.rounded, 2)}</b>${a.roundedUp ? ' ↑' : ''}</td><td>${fmtNum(b.rounded, 2)}</td></tr>`; }).join('')}</tbody></table></div>` : `<div class="empty"><span class="display">No reference max</span><span>Add a baseline in your profile or enter a what-if max to see loads.</span></div>`}
      <p class="muted" style="font-size:12.5px;margin-top:10px">Target = reference max × percentage, rounded ${State.settings.rounding === 'down' ? 'down' : 'to the nearest'} ${Units.inc()} ${u}. ${State.settings.rounding === 'nearest' ? 'Rows marked ↑ were rounded above the prescription.' : 'Loads are never rounded above the prescription.'} Tap a row to select it.</p></section>`;
  },
  calcOut(t, tOther, pct, ref) {

  logger(s) {

          <button class="btn icon sm" type="button" data-act="pause" aria-label="${s.pausedAt ? 'Resume clock' : 'Pause clock'}">${icon(s.pausedAt ? 'play' : 'pause')}</button></div>
        <div class="yardbar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${doneSets}" aria-label="Sets completed"><i style="width:${total ? doneSets / total * 100 : 0}%"></i></div>
        <div class="ex-tabs" role="tablist" aria-label="Exercises">${s.ex.map((z, i) => `<button type="button" role="tab" class="ex-tab ${i === ei ? 'cur' : ''} ${z.skipped ? 'skip' : exDone(z) ? 'done' : ''}" data-act="ex-go" data-i="${i}" aria-selected="${i === ei}" aria-label="Exercise ${i + 1}: ${esc(z.name)}${exDone(z) && !z.skipped ? ', done' : ''}">${exDone(z) && !z.skipped ? icon('check') : i + 1}</button>`).join('')}</div>

  setRow(s, x, ei, t, si, isNext) {

  prCard(metric, st) {

  },
  pConsistency(st) {
    const items = st.weekly.map(w => ({ label: 'W' + w.week, v: w.done, v2: w.scheduled, hl: w.week === st.programWeek, tip: `Week ${w.week}: ${w.done} of ${w.scheduled} workouts completed` }));
    return `<div class="metrics" data-stg>
      ${metric('Current streak', st.streak, 'c-st', 0, '', 'workouts in a row')}${metric('Longest streak', st.longest, 'c-lg', 0, '', 'workouts in a row')}
      ${metric('Adherence', st.adherence == null ? null : st.adherence * 100, 'c-ad', 0, st.adherence == null ? '' : '<small>%</small>', st.dueCount ? `${st.doneOfDue} of ${st.dueCount} due` : 'nothing due yet')}${metric('Avg per week', st.avgPerWeek, 'c-avg', 1, '', 'since first workout')}
      ${metric('Missed', st.missed, 'c-mi', 0, '', 'past due, not logged')}${metric('Skipped', st.skipped, 'c-sk', 0, '', 'marked skipped')}</div>
      <section class="panel" data-stg><div class="panel-head"><h2 class="h3">Workouts per week</h2><span class="label">done / scheduled</span></div>${Chart.bars({ items, max: 4, fmt: v => v, title: 'Workouts completed per week' })}</section>
      <section class="panel flat" data-stg><div class="label">Streak rule</div><p style="margin-top:6px;font-size:14px">Your streak counts scheduled workouts completed in program order, back from the most recent one that is due. A skipped workout, or a scheduled workout whose date has passed without being logged, ends it. Future workouts never count as missed; unfinished workouts never count as completed.</p></section>`;
  },
  pBody(st) {
    const p = State.profile, u = unitW(), pts = st.bw, cur = pts.length ? pts[pts.length - 1].o : null, init = p.initialBw;
    const change = cur && init ? Units.showW(cur) - Units.showW(init) : null;
    return `<div class="metrics" data-stg>${metric('Current', cur ? Units.showW(cur) : null, 'b-c', 1, cur ? `<small> ${u}</small>` : '', 'latest entry')}${metric('Initial', init ? Units.showW(init) : null, 'b-i', 1, init ? `<small> ${u}</small>` : '', 'baseline')}
      ${metric('Change', change, 'b-ch', 1, change != null ? `<small> ${u}</small>` : '', 'from baseline')}${metric('Target', p.targetBw ? Units.showW(p.targetBw) : null, 'b-t', 1, p.targetBw ? `<small> ${u}</small>` : '', 'optional goal')}</div>
      <section class="panel" data-stg><div class="panel-head"><h2 class="h3">Body weight</h2><span class="label">${u}</span></div>
      ${pts.length ? Chart.line({ series: [{ pts: pts.map(e => ({ t: +parseISO(e.date), y: Units.showW(e.o), tip: `${fmtDate(e.date)} · ${Units.fmtW(e.o)} ${u}${e.initial ? ' (initial)' : ''}` })), color: '#FFFFFF' }], hline: p.targetBw ? { y: Units.showW(p.targetBw), label: 'Target' } : null, yUnit: u, title: 'Body weight' }) : `<div class="empty"><span class="display">No entries</span><span>Log your body weight below.</span></div>`}</section>
      <section class="panel stack" data-stg><h2 class="h3">Log body weight</h2><div class="grid2"><div class="field"><label for="bwDate">Date</label><input class="input" type="date" id="bwDate" value="${todayISO()}"></div><div class="field"><label for="bwVal">Weight</label><div class="input-unit"><input class="input num" id="bwVal" inputmode="decimal"><span>${u}</span></div></div></div>
        <button class="btn primary" type="button" data-act="bw-add">${icon('plus')} Add entry</button>
        ${State.bodyweight.length ? `<div>${State.bodyweight.slice().sort((a, b) => b.date.localeCompare(a.date)).map(e => `<div class="list-item"><div class="grow">${fmtDate(e.date)}</div><b class="num">${Units.fmtW(e.w)} ${u}</b><button class="btn sm ghost" type="button" data-act="bw-del" data-id="${e.id}" aria-label="Delete entry">${icon('trash-2')}</button></div>`).join('')}</div>` : ''}</section>`;
  },
  testRows(st) {
    return Object.keys(METRICS).map(metric => {
      const m = METRICS[metric], b = st.pr[metric].baseline, fin = State.results.filter(r => r.metric === metric && r.week === State.program.weeks).sort((a, c) => c.date.localeCompare(a.date))[0];
      const bv = b ? Units.metricIn(metric, b.o) : null, fv = fin ? Units.metricIn(metric, fin.o) : null, dec = m.kind === 'time' ? 2 : 1, u = Units.metricUnit(metric);
      const ch = bv != null && fv != null ? fv - bv : null, good = ch != null && (m.better === 'higher' ? ch > 0 : ch < 0);
      return { metric, m, b, fin, bv, fv, ch, good, dec, u, pct: ch != null && bv ? ch / bv * 100 : null };
    });
  },
  pReport(st) {
    const rows = this.testRows(st);
    return `<section class="panel" data-stg><div class="panel-head"><h2 class="h3">Week 11 testing report</h2><span class="label">baseline → final</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Test</th><th>Baseline</th><th>Final</th><th>Change</th><th>Dir.</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><b>${r.m.name}</b><br><span class="label">${r.b ? Calc.clsLabel(r.b.cls).toLowerCase() : 'no baseline'}${r.fin ? ' → ' + r.fin.cls : ''}</span></td><td>${r.bv != null ? fmtNum(r.bv, r.dec) + ' ' + r.u : '—'}</td><td>${r.fv != null ? `<b>${fmtNum(r.fv, r.dec)} ${r.u}</b>` : '<span class="badge warn">Not tested</span>'}</td><td>${r.ch != null ? `${r.ch > 0 ? '+' : ''}${fmtNum(r.ch, r.dec)}${r.pct != null ? `<br><span class="label">${r.pct > 0 ? '+' : ''}${fmtNum(r.pct, 1)}%</span>` : ''}` : '—'}</td><td>${r.ch == null ? '—' : r.ch === 0 ? 'Same' : r.good ? '<span class="badge ok">Better</span>' : '<span class="badge">Lower</span>'}</td></tr>`).join('')}
      </tbody></table></div><p class="muted" style="font-size:12.5px;margin-top:10px">Final = the most recent result recorded during Week ${State.program.weeks}. Missing tests show “Not tested”; nothing is estimated or filled in.</p></section>
      <button class="btn primary block" type="button" data-act="go" data-r="summary" data-stg>Program summary & finale</button>`;
  },

  /* ---------- More ---------- */
  more() {
    const it = (r, ic, t, d) => `<button class="list-item" type="button" data-act="go" data-r="${r}">${icon(ic)}<div class="grow"><b>${t}</b><div class="muted" style="font-size:12.5px">${d}</div></div>${icon('chevron-right')}</button>`;
    return `<div class="screen"><div class="topbar" data-stg>${brand()}</div>
      <section class="panel" data-stg>${it('history', 'history', 'Workout history', 'Search, filter and edit every session')}${it('summary', 'trophy', 'Program summary', 'Completion, testing report and the Game Day finale')}${it('profile', 'user', 'Athlete profile & baselines', 'Body weight, maxima, start date, goals')}${it('settings', 'settings', 'Settings', 'Units, plates, rest timer, sound, animation')}${it('backup', 'hard-drive-download', 'Backup & restore', 'Export or import your data as JSON')}${it('about', 'info', 'About this app', 'Curriculum source, data and disclaimer')}</section>
      <button class="btn block" type="button" data-act="replay-intro" data-stg>${icon('clapperboard')} Replay the arrival</button></div>`;
  },
  history() {
    const f = UI.ui, q = f.histQ.toLowerCase();
    const list = State.sessions.filter(s => {
      if (f.histStatus !== 'all' && s.status !== f.histStatus) return false;
      if (f.histWeek !== 'all' && s.week != f.histWeek) return false;
      if (f.histCycle !== 'all' && s.cycle != f.histCycle) return false;
      if (f.histFrom && s.date < f.histFrom) return false; if (f.histTo && s.date > f.histTo) return false;
      if (f.histPR && !State.results.some(r => r.sid === s.id && r._pr)) return false;
      if (f.histEx !== 'all' && !(s.ex || []).some(x => x.exId === f.histEx && x.sets.some(t => t.done))) return false;
      if (q && !(s.title + ' week ' + s.week + ' day ' + s.day + ' ' + (s.notes || '') + ' ' + (s.ex || []).map(x => x.name).join(' ')).toLowerCase().includes(q)) return false;
      return true;
    }).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
    const u = unitW(), sel = (k, opts, label) => `<div class="field"><label for="h-${k}">${label}</label><select class="input" id="h-${k}" data-ui="${k}">${opts.map(([v, l]) => `<option value="${v}" ${String(f[k]) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    return `<div class="screen">${backBar('Workout history')}
      <div class="stack" data-stg><div class="input-unit"><input class="input" type="search" id="histQ" placeholder="Search workouts, exercises, notes" value="${esc(f.histQ)}" data-ui="histQ" aria-label="Search history"><span>${icon('search')}</span></div>
      <div class="chips">${['all', 'completed', 'in_progress', 'skipped', 'abandoned'].map(k => `<button class="chip" type="button" data-act="ui" data-k="histStatus" data-v="${k}" aria-pressed="${f.histStatus === k}">${k === 'all' ? 'All' : ST_LABEL[k]}</button>`).join('')}<button class="chip" type="button" data-act="ui" data-k="histPR" data-v="${!f.histPR}" aria-pressed="${f.histPR}">${icon('trophy')} With PRs</button></div>
      <details><summary class="label" style="cursor:pointer;min-height:32px;display:flex;align-items:center">More filters</summary><div class="grid2" style="margin-top:8px">
        ${sel('histWeek', [['all', 'Any week'], ...Array.from({ length: State.program.weeks }, (_, i) => [i + 1, 'Week ' + (i + 1)])], 'Week')}
        ${sel('histCycle', [['all', 'Any cycle'], ...Object.entries(State.program.cycles).map(([k, c]) => [k, c.name])], 'Macro-cycle')}
        ${sel('histEx', [['all', 'Any exercise'], ...Object.entries(EXERCISES).map(([k, e]) => [k, e.name])], 'Exercise')}
        <div></div>
        <div class="field"><label for="h-from">From</label><input class="input" type="date" id="h-from" data-ui="histFrom" value="${esc(f.histFrom)}"></div><div class="field"><label for="h-to">To</label><input class="input" type="date" id="h-to" data-ui="histTo" value="${esc(f.histTo)}"></div>
      </div></details></div>
      <section class="stack" data-stg>${list.length ? list.map(s => { const ss = Stats.sessionStats(s); return `<button class="wk-item" type="button" data-act="go" data-r="session" data-p="${s.id}"><span class="wk-day" style="font-size:15px;line-height:1">W${s.week}<br>D${s.day}</span><span class="grow"><b style="display:block">${esc(s.title)}</b><span class="muted" style="font-size:12.5px">${fmtDate(s.date)}${s.status !== 'skipped' ? ` · ${s.endedAt ? fmtDur(Workout.elapsed(s)) : '—'} · ${ss.exDone}/${ss.exTotal} ex · ${ss.sets} sets${ss.vol ? ` · ${fmtNum(Units.fromKg(ss.vol, u), 0)} ${u}` : ''}` : ''}</span></span><span class="stack" style="gap:4px;align-items:flex-end">${stBadge(s.status)}${ss.prs ? `<span class="badge red">${ss.prs} PR</span>` : ''}</span></button>`; }).join('') : `<div class="empty"><span class="display">${State.sessions.length ? 'No sessions match' : 'No sessions yet'}</span><span>${State.sessions.length ? 'Clear a filter to see more.' : 'Completed, skipped and abandoned workouts appear here.'}</span></div>`}</section></div>`;
  },
  session(id) {
    const s = State.sessions.find(x => x.id === id);
    if (!s) return `<div class="screen">${backBar('Session')}<div class="empty"><span class="display">Session not found</span></div></div>`;
    const ss = Stats.sessionStats(s), u = unitW(), edit = UI.ui.editSid === s.id, prs = State.results.filter(r => r.sid === s.id);
    const w = Program.byId(s.tid);
    const exRows = (s.ex || []).map((x, ei) => `<section class="panel" data-stg><div class="spread"><h3 class="h3">${esc(x.name)}</h3>${x.skipped ? '<span class="badge">Skipped</span>' : ''}</div><div class="label" style="margin:4px 0 8px">Prescribed: ${esc(x.presc)}${x.ref ? ` · ref ${Units.fmtW(x.ref.w)} ${u} (${Calc.clsLabel(x.ref.cls).toLowerCase()})` : ''}</div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Set</th><th>Target</th><th>Actual</th><th>Diff</th></tr></thead><tbody>${x.sets.map((t, si) => {
      const lab = t.warm ? 'W' : t.n; let tgt = '—', act = '—', diff = '';
      if (x.type === 'pct') { tgt = t.pT ? `${frozenTargetText(t.pT)} × ${t.pReps}` : t.pReps ? `× ${t.pReps}` : '—'; act = edit ? `<span class="row" style="justify-content:flex-end"><input class="input num" style="width:84px;min-height:38px" inputmode="decimal" data-hf="w" data-e="${ei}" data-s="${si}" value="${numVal(Units.showW(t.w))}" aria-label="Set ${lab} weight"><input class="input num" style="width:58px;min-height:38px" inputmode="numeric" data-hf="reps" data-e="${ei}" data-s="${si}" value="${numVal(t.reps)}" aria-label="Set ${lab} reps"></span>` : t.done ? `${Units.fmtW(t.w)} × ${t.reps}` : '<span class="muted">not done</span>'; if (t.done && t.pT && t.w) { const dw = Units.showW(t.w) - Units.showW({ kg: t.pT.kg, v: t.pT.v, u: t.pT.u }), dr = t.reps - t.pReps; diff = `${dw ? (dw > 0 ? '+' : '') + fmtNum(dw, 1) + ' ' + u : '='}${dr ? ` · ${dr > 0 ? '+' : ''}${dr} reps` : ''}`; } }
      else if (x.type === 'reps') { tgt = t.pReps; act = edit ? `<input class="input num" style="width:70px;min-height:38px" data-hf="reps" data-e="${ei}" data-s="${si}" value="${numVal(t.reps)}" aria-label="Reps">` : t.done ? t.reps : '<span class="muted">not done</span>'; if (t.done && t.pReps != null) diff = t.reps - t.pReps ? (t.reps - t.pReps > 0 ? '+' : '') + (t.reps - t.pReps) : '='; }
      else if (x.type === 'timed' || x.type === 'sprint') { tgt = x.type === 'timed' ? t.pSec + 's' : t.dist + ' yd'; act = edit ? `<input class="input num" style="width:70px;min-height:38px" data-hf="sec" data-e="${ei}" data-s="${si}" value="${numVal(t.sec)}" aria-label="Seconds">` : t.done ? (t.sec ? fmtNum(t.sec, 2) + 's' : 'done') : '<span class="muted">not done</span>'; }
      else if (x.type === 'test') { tgt = 'max'; act = edit ? `<input class="input num" style="width:80px;min-height:38px" data-hf="val" data-e="${ei}" data-s="${si}" value="${t.val ? numVal(Units.metricIn(x.metric, t.val)) : ''}" aria-label="Result">` : t.done && t.val ? Units.showMetric(x.metric, t.val) : '<span class="muted">—</span>'; }
      return `<tr><td>${lab}${t.rpe ? `<br><span class="label">RPE ${t.rpe}</span>` : ''}</td><td>${tgt}</td><td>${act}</td><td>${diff}</td></tr>`;
    }).join('')}</tbody></table></div>${x.notes ? `<p class="muted" style="margin-top:8px;font-size:13.5px">“${esc(x.notes)}”</p>` : ''}</section>`).join('');
    return `<div class="screen">${backBar(esc(s.title), stBadge(s.status))}
      <section class="panel" data-stg><div class="label">Week ${s.week} · Day ${s.day} · ${esc(Program.cycleOf(s.week).name)} · ${fmtDate(s.date)}</div>
        <div class="c-stats" style="margin-top:10px"><div><div class="label">Duration</div><div class="sb-val">${s.endedAt ? fmtDur(Workout.elapsed(s)) : '—'}</div></div><div><div class="label">Exercises</div><div class="sb-val">${ss.exDone}<small>/${ss.exTotal}</small></div></div><div><div class="label">Working sets</div><div class="sb-val">${ss.sets}<small>/${ss.total}</small></div></div><div><div class="label">Volume</div><div class="sb-val">${ss.vol ? fmtNum(Units.fromKg(ss.vol, u), 0) : '—'}<small> ${ss.vol ? u : ''}</small></div></div></div>
        ${prs.length ? `<div class="row wrap" style="margin-top:10px">${prs.map(r => `<span class="badge ${r._pr ? 'red' : ''}">${METRICS[r.metric].name} ${Units.showMetric(r.metric, r.o)}${r._pr ? ' · PR' : ''}</span>`).join('')}</div>` : ''}
        ${s.notes ? `<p class="muted" style="margin-top:10px">“${esc(s.notes)}”</p>` : ''}
        ${w && w.instructions ? `<p class="muted" style="margin-top:10px;font-size:12.5px">${esc(w.instructions)}</p>` : ''}</section>
      ${s.status === 'skipped' ? `<button class="btn block" type="button" data-act="unskip" data-id="${s.tid}">${icon('undo-2')} Undo skip</button>` : ''}
      ${s.status === 'in_progress' ? `<button class="btn big red block" type="button" data-act="go" data-r="workout">Resume this workout</button>` : ''}
      ${exRows}
      ${(s.ex || []).length && s.status !== 'in_progress' ? `<div class="grid2" data-stg>${edit ? `<button class="btn" type="button" data-act="hist-cancel">Cancel</button><button class="btn primary" type="button" data-act="hist-save" data-id="${s.id}">${icon('save')} Save changes</button>` : `<button class="btn" type="button" data-act="hist-edit" data-id="${s.id}">${icon('pencil')} Edit results</button><button class="btn danger" type="button" data-act="hist-del" data-id="${s.id}">${icon('trash-2')} Delete session</button>`}</div><div id="histErr" class="err-msg" role="alert"></div>` : ''}</div>`;
  },
  profile() {
    const p = State.profile, u = unitW(), hu = Units.hUnit();
    return `<div class="screen">${backBar('Athlete profile')}
      <section class="panel stack" data-stg><div class="field"><label for="pf-name">Athlete name</label><input class="input" id="pf-name" data-set="name" value="${esc(State.settings.name)}"></div>
        <div class="grid2"><div class="field"><label for="pf-ibw">Initial body weight</label><div class="input-unit"><input class="input num" id="pf-ibw" inputmode="decimal" data-pf="initialBw" value="${numVal(Units.showW(p.initialBw))}"><span>${u}</span></div></div>
        <div class="field"><label for="pf-tbw">Target body weight</label><div class="input-unit"><input class="input num" id="pf-tbw" inputmode="decimal" data-pf="targetBw" value="${numVal(Units.showW(p.targetBw))}" placeholder="Optional"><span>${u}</span></div></div></div>
        <div class="field"><label for="pf-start">Program start date</label><input class="input" type="date" id="pf-start" data-pf="startDate" value="${esc(p.startDate || '')}"><span class="muted" style="font-size:12.5px">Changing it moves every scheduled date. Logged sessions keep their real dates.</span></div>
        <div class="field"><label for="pf-goals">Goals</label><textarea class="input" id="pf-goals" rows="3" data-pf="goals">${esc(p.goals || '')}</textarea></div></section>
      <section class="panel stack" data-stg><div class="panel-head" style="margin:0"><h2 class="h3">Lift baselines</h2><span class="label">${u}</span></div>
        ${Object.keys(LIFTS).map(k => { const b = p.baselines[k]; return `<div class="lift-card"><div class="spread"><b>${LIFTS[k].name}</b><span class="label">${b && b.date ? 'since ' + fmtDate(b.date) : ''}</span></div>
          <div class="grid2"><div class="input-unit"><input class="input num" id="bl-${k}" inputmode="decimal" value="${b ? numVal(Units.showW(b.w)) : ''}" placeholder="Unknown" aria-label="${LIFTS[k].name} max"><span>${u}</span></div>
          <select class="input" id="blc-${k}" aria-label="${LIFTS[k].name} max type">${['tested', 'recorded', 'training'].map(c => `<option value="${c}" ${(b ? b.cls : 'tested') === c ? 'selected' : ''}>${Calc.clsLabel(c)}</option>`).join('')}</select></div>
          <input class="input" id="bln-${k}" placeholder="Notes (optional)" value="${esc(b ? b.notes || '' : '')}" aria-label="${LIFTS[k].name} notes"></div>`; }).join('')}
        <p class="muted" style="font-size:12.5px">Future prescriptions use the new values. Workouts already started or logged keep the targets they were given.</p>
        <div id="blErr" class="err-msg" role="alert"></div><button class="btn primary" type="button" data-act="save-baselines">${icon('save')} Save baselines</button>
        ${p.baselineHistory && p.baselineHistory.length ? `<details><summary class="label" style="cursor:pointer">Baseline history (${p.baselineHistory.length})</summary>${p.baselineHistory.slice().reverse().map(h => `<div class="kv"><span>${LIFTS[h.lift].name} · ${fmtDate(h.date)}</span><span>${Units.fmtW(h.w)} ${u} · ${Calc.clsLabel(h.cls).toLowerCase()} <span class="muted">replaced ${fmtDate(h.replaced)}</span></span></div>`).join('')}</details>` : ''}</section>
      <section class="panel stack" data-stg><h2 class="h3">Athletic baselines</h2><div class="grid3">${[['vj', 'Vertical jump', hu], ['sprint10', '10-yd sprint', 's'], ['sprint110', '110-yd sprint', 's']].map(([k, l, uu]) => { const a = p.athletic && p.athletic[k]; return `<div class="field"><label for="ab-${k}">${l}</label><div class="input-unit"><input class="input num" id="ab-${k}" inputmode="decimal" value="${a ? numVal(Units.metricIn(k, a.o)) : ''}" placeholder="—"><span>${uu}</span></div></div>`; }).join('')}</div>
        <button class="btn" type="button" data-act="save-athletic">${icon('save')} Save athletic baselines</button></section></div>`;
  },
  settings() {
    const s = State.settings, sw = (k, l, d) => `<div class="toggle"><span><b style="font-weight:600">${l}</b>${d ? `<br><span class="muted" style="font-size:12.5px">${d}</span>` : ''}</span><button class="switch" type="button" role="switch" aria-checked="${!!s[k]}" data-act="set-toggle-setting" data-k="${k}" aria-label="${l}"></button></div>`;
    const seg = (k, opts, label) => `<div class="field"><span class="label">${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v, l]) => `<button type="button" data-act="set-seg" data-k="${k}" data-v="${v}" aria-pressed="${String(s[k]) === String(v)}">${l}</button>`).join('')}</div></div>`;
    return `<div class="screen">${backBar('Settings')}
      <section class="panel stack" data-stg><h2 class="h3">Units & plates</h2>${seg('unit', [['lb', 'Pounds'], ['kg', 'Kilograms']], 'Weight unit')}
        <div class="grid2"><div class="field"><label for="st-incLb">Plate increment (lb)</label><select class="input" id="st-incLb" data-set="incLb">${[1, 2.5, 5, 10].map(v => `<option ${s.incLb == v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        <div class="field"><label for="st-incKg">Plate increment (kg)</label><select class="input" id="st-incKg" data-set="incKg">${[.5, 1, 1.25, 2.5, 5].map(v => `<option ${s.incKg == v ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
        ${seg('rounding', [['down', 'Round down'], ['nearest', 'Round to nearest']], 'Target rounding')}

/* post-render choreography per screen */
const After = {
