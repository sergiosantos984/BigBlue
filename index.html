  State.storageMode = await DB.open();
  try { for (const s of STORES) State[s] = await DB.all(s); }
  catch (e) { State.storageMode = 'memory'; UI.toast('Could not read saved workouts. Nothing was deleted.', 'bad'); }
  if (Cloud.on && Cloud.sb) { const t0 = State.profile && State.profile.position; await Cloud.pull(); if (State.profile && State.profile.position !== t0 && !LSX.get(LS.program, null)) State.program = buildVTProgram(State.profile.track, State.profile.position); }
  // crash recovery: the synchronous mirror may be newer than the async store
  const mirror = LSX.get(LS.active, null);
  if (mirror && mirror.status === 'in_progress') {
    const i = State.sessions.findIndex(s => s.id === mirror.id);
    if (i < 0 || (mirror.rev || 0) > (State.sessions[i].rev || 0)) { if (i < 0) State.sessions.push(mirror); else State.sessions[i] = mirror; DB.put('sessions', mirror); }
    State.meta.activeSessionId = mirror.id;
  }
  if (State.meta.activeSessionId && !State.sessions.some(s => s.id === State.meta.activeSessionId && s.status === 'in_progress')) State.meta.activeSessionId = null;
  if (!State.meta.activeSessionId) { const ip = State.sessions.filter(s => s.status === 'in_progress').sort((a, b) => b.startedAt - a.startedAt)[0]; if (ip) State.meta.activeSessionId = ip.id; }
  Store.saveMeta(); State.version++;
  bindEvents();
  if (State.profile && State.meta.onboarded) Achievements.evaluate();
  if (State.meta.timer && State.meta.timer.running) Rest.loop();
  await Splash.done;                          // let the load-up finish so the next scene's entrance is seen
  if (!Cloud.on && !Gate.unlocked()) await Gate.show();   // landing page: athlete code (accounts replace it when the cloud is set up)

  if (!State.meta.onboarded || !State.profile) {
    const hasDraft = !!LSX.get(LS.draft, null);
    if (State.meta.introSeen && hasDraft) App.locker();
    else Intro.play(() => { State.meta.introSeen = true; Store.saveMeta(); App.locker(); });
    $('#skipIntro').onclick = () => Intro.finish();
    $('#enterStadium').onclick = () => Intro.enter();
    return;
  }
  $('#skipIntro').onclick = () => Intro.finish();
  $('#enterStadium').onclick = () => Intro.enter();
  App.show(false);
  try { const q = new URLSearchParams(location.search); if (q.get('go') === 'admin') { history.replaceState(null, '', location.pathname); if (Cloud.isAdmin()) setTimeout(() => Nav.go('admin'), Motion.off ? 0 : 600); } } catch (e) { }
  const act = Workout.active();
  if (act) setTimeout(async () => {
    const c = await Sheet.choose({ title: 'Resume your workout?', body: `<p><b>${esc(act.title)}</b> (${wkLabel(act.week)} · Day ${act.day}) was not finished. ${Stats.sessionStats(act).sets} sets are saved.</p>`, options: [{ id: 'resume', label: 'Resume mission', cls: 'red' }, { id: 'later', label: 'Keep it for later' }, { id: 'discard', label: 'Discard it', cls: 'danger' }] });
    if (c === 'resume') Nav.go('workout', null, { big: true }); else if (c === 'discard') Workout.abandon(act);
  }, Motion.off ? 50 : 900);
}


/* ============ ACCESS GATE (landing page) ============
   Six-digit athlete code entered on a stadium keypad. The code is stored only as a hash,
   which keeps it out of plain sight in the source; it is a gate, not real security.
   A correct code is remembered on this device. */
const GATE_HASH = '97040106', GATE_KEY = 'bbp.gate', GATE_SLOTS = 6;
const Gate = {
  vals: Array(GATE_SLOTS).fill(''), i: 0, resolve: null, busy: false,
  hash(s) { let h = 0x811c9dc5; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); },
  unlocked() { return LSX.get(GATE_KEY, null) === GATE_HASH; },
  show() {
    return new Promise(res => {
      this.resolve = res; this.vals = Array(GATE_SLOTS).fill(''); this.i = 0;
      const g = $('#gate'); g.hidden = false; g.className = '';
      g.innerHTML = `<div class="gbg" aria-hidden="true"><div class="gbeam" style="left:4%"></div><div class="gbeam" style="left:96%;transform:translateX(-50%) rotate(14deg)"></div><div class="gfield"></div><div class="gendzone">HOKIES</div></div>
        <div class="gwrap"><div class="gcol">
          <header class="ghead" data-gs>${shield(40)}<div><b>HOKIE POWER</b><small>FLIGHT 2005 TO GLORY</small></div></header>
          <div class="ghero" data-gs><span class="label">Restricted access · Athlete entrance</span>
            <h1 class="gtitle">Welcome to Blacksburg, <span>Cliff.</span></h1>
            <p class="gsub">Eleven weeks. One mission. Enter your athlete code to open the facility.<br><small style="opacity:.75">Nothing is sent to you by text or email — use the code you were given. Each phone asks once, then remembers it.</small></p></div></div><div class="gcol">
          <div class="gcode" data-gs>
            <div class="spread"><span class="label" id="gateLbl">Athlete code · 6 digits</span><span class="label" id="gateStep">Digit 1 of 6</span></div>
            <div class="slots" role="group" aria-labelledby="gateLbl">${Array.from({ length: GATE_SLOTS }, (_, k) => `<button type="button" class="slot" data-gate-slot="${k}" aria-label="Digit ${k + 1}"><span></span></button>`).join('')}</div>
            <p class="gmsg" id="gateMsg" role="status" aria-live="polite">Type your six-digit code.</p>
          </div>
          <div class="keypad" data-gs role="group" aria-label="Keypad">
            ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button type="button" class="key" data-gate-key="${n}">${n}</button>`).join('')}
            <button type="button" class="key k-fn" data-gate-key="back" aria-label="Delete">${icon('delete')}</button>
            <button type="button" class="key" data-gate-key="0">0</button>
            <button type="button" class="key k-fn" data-gate-key="clear" aria-label="Clear code">${icon('x')}</button>
          </div>
          <button type="button" class="btn big red block" id="gateGo" data-gs disabled>Unlock the facility</button>
          <p class="gfoot" data-gs>Fan-inspired personal training app · not affiliated with Virginia Tech</p>
        </div></div>`;
      UI.icons(g); this.paint();
      $$('[data-gs]', g).forEach((el, k) => Motion.anim(el, [{ opacity: 0, transform: 'translateY(24px)' }, { opacity: 1, transform: 'none' }], { duration: Motion.m.std + 200, delay: 80 + k * Motion.m.stagger * 1.6 }));
      Motion.anim($('.gfield', g), [{ opacity: 0 }, { opacity: 1 }], { duration: Motion.m.cine });
      g.onclick = e => {
        const k = e.target.closest('[data-gate-key]'), s = e.target.closest('[data-gate-slot]');
        if (k) { Motion.press(k); this.key(k.dataset.gateKey); }
        else if (e.target.closest('#gateGo')) this.submit();
      };
      this.onKey = e => {
        if ($('#gate').hidden) return;
        if (/^[0-9]$/.test(e.key)) { e.preventDefault(); this.key(e.key); }
        else if (e.key === 'Backspace') { e.preventDefault(); this.key('back'); }
        else if (e.key === 'Escape') { e.preventDefault(); this.key('clear'); }
        else if (e.key === 'Enter') { e.preventDefault(); if (this.vals.every(Boolean)) this.submit(); else { const t = e.target.closest('[data-gate-key]'); t && this.key(t.dataset.gateKey); } }
      };
      document.addEventListener('keydown', this.onKey);
      setTimeout(() => { const f = $('[data-gate-key="1"]'); f && f.focus({ preventScroll: true }); }, 60);
    });
  },
  key(k) {
    if (this.busy) return; const g = $('#gate'); g.classList.remove('err');
    // one digit per box: typing fills left to right, backspace removes the last digit
    const n = this.vals.findIndex(v => !v), filled = n < 0 ? GATE_SLOTS : n;
    if (k === 'clear') this.vals = Array(GATE_SLOTS).fill('');
    else if (k === 'back') { if (filled > 0) this.vals[filled - 1] = ''; }
    else if (filled < GATE_SLOTS) {
      this.vals[filled] = k;
      const box = $(`[data-gate-slot="${filled}"]`); box && Motion.anim(box, [{ transform: 'scale(.86)' }, { transform: 'scale(1)' }], { duration: Motion.m.std, easing: Motion.m.spring });
    }
    const m = this.vals.findIndex(v => !v); this.i = m < 0 ? GATE_SLOTS - 1 : m;
    Haptics.tap(); this.paint();
    if (this.vals.every(Boolean)) setTimeout(() => this.submit(), 180);   // auto-check on the 6th digit
  },
  paint() {
    $$('[data-gate-slot]').forEach((s, k) => { $('span', s).textContent = this.vals[k]; s.classList.toggle('active', k === this.i); s.classList.toggle('filled', !!this.vals[k]); s.setAttribute('aria-label', `Digit ${k + 1}${this.vals[k] ? ': ' + this.vals[k] : ', empty'}`); });
    const st = $('#gateStep'); if (st) st.textContent = this.vals.every(Boolean) ? 'Checking…' : `Digit ${this.i + 1} of ${GATE_SLOTS}`;
    const go = $('#gateGo'); if (go) go.disabled = !this.vals.every(Boolean);
  },
  async submit() {
    if (this.busy || !this.vals.every(Boolean)) return;
    const g = $('#gate'), code = this.vals.join('');
    if (this.hash('bbp:' + code) !== GATE_HASH) {
      g.classList.add('err'); $('#gateMsg').textContent = "That code doesn't match. Try again.";
      Haptics.buzz(); Motion.anim($('.slots', g), [{ transform: 'translateX(0)' }, { transform: 'translateX(-12px)' }, { transform: 'translateX(10px)' }, { transform: 'translateX(-6px)' }, { transform: 'none' }], { duration: 420 });
      setTimeout(() => { this.vals = Array(GATE_SLOTS).fill(''); this.i = 0; this.paint(); }, 700);
      return;
    }
    this.busy = true; g.classList.add('ok'); $('#gateMsg').textContent = 'Access granted. Welcome to the facility, Cliff.';
    LSX.set(GATE_KEY, GATE_HASH); Haptics.beep([523, 784, 1047], .12);
    $$('[data-gate-slot]', g).forEach((s, k) => Motion.anim(s, [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }], { duration: Motion.m.std, delay: k * 60, easing: Motion.m.spring }));
    await new Promise(r => setTimeout(r, Motion.off ? 0 : 750));
    await Motion.anim(g, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `scale(${1 + .15 * Motion.m.camera})` }], { duration: Motion.m.cine * .6, easing: EASE.io, fill: 'forwards' });
    document.removeEventListener('keydown', this.onKey);
    g.hidden = true; g.innerHTML = ''; this.busy = false;
    const r = this.resolve; this.resolve = null; r && r();
  }
};

/* ============ v4: THEME · QUOTES · SEASON PROGRESS · SCROLL REVEALS ============ */
const Theme = {
  get light() { return State.settings.theme !== 'dark'; },
  apply() {
    document.body.classList.toggle('theme-light', this.light);
    let m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', this.light ? '#F8F5EF' : '#16171A');
    FX.setDensity(Motion.m.particles);
  },
  /* map chart colours designed for the night theme onto the light theme */
  c(col) {
    if (!this.light || !col) return col;
    if (/^#fff(fff)?$/i.test(col)) return '#861F41';      // primary data: maroon
    if (/^#B7BEC3$/i.test(col)) return '#E87722';         // secondary / estimated data: orange
    if (/^#16171A$/i.test(col)) return '#FFFFFF';
    return col;
  }
};

/* motivation: daily quote + kinetic rotator + ribbon ticker + pre-mission flash */
const Quotes = {
  iv: null, idx: 0, t0: 0, dur: 8000, raf: null, paused: false,
  today() { return ((daysBetween('2026-01-01', todayISO()) % MOTIVATION.length) + MOTIVATION.length) % MOTIVATION.length; },
  plain(q) { return q.replace(/<[^>]+>/g, ''); },
  /* split into words; words inside <em> keep the highlight */
  words(q) {
    const out = []; let em = false;
    q.replace(/<em>|<\/em>|[^\s<]+/g, t => { if (t === '<em>') em = true; else if (t === '</em>') em = false; else out.push(em ? `<em>${t}</em>` : t); return t; });
    return out.map((w, i) => `<span class="w" style="--wi:${i}">${w}</span>`).join(' ');
  },
  hero() {
    this.idx = this.today(); const q = MOTIVATION[this.idx];
    return `<section class="quote-hero" data-stg aria-label="Today's call" aria-roledescription="carousel">
      <div class="qspot" aria-hidden="true"></div><div class="qmark" aria-hidden="true">“</div>
      <div class="qtop"><span class="label">Today's call · ${esc(State.settings.name)}</span></div>
      <p class="qtext" id="qText" aria-live="polite">${this.words(q)}</p>
      <div class="qbar" aria-hidden="true"><i id="qBar"></i></div>
      <div class="qctl"><button class="btn icon sm" type="button" data-act="q-prev" aria-label="Previous quote">${icon('chevron-left')}</button><button class="btn icon sm" type="button" data-act="q-pause" aria-label="Pause quotes" id="qPause">${icon('pause')}</button><button class="btn icon sm" type="button" data-act="q-next" aria-label="Next quote">${icon('chevron-right')}</button><span class="qcount" id="qCount">${pad2(this.idx + 1)} / ${MOTIVATION.length}</span></div></section>`;
  },
  ticker(offset = 0) {
    const items = MOTIVATION.map((_, i) => MOTIVATION[(i + offset) % MOTIVATION.length]).map(q => `<span>${q}</span><span class="dot" aria-hidden="true"></span>`).join('');
    return `<div class="ticker" data-stg role="marquee" aria-label="Motivation ribbon"><div class="track" style="--tk:${MOTIVATION.length * 7}s">${items}${items}</div></div>`;
  },
  start(root) {
    this.stop(); const el = $('#qText', root); if (!el) return;
    this.reveal(el); this.paused = false;
    if (Motion.off) return;
    this.t0 = performance.now();
    const tick = t => {
      if (!$('#qText')) { this.raf = null; return; }
      if (!this.paused && !document.hidden) {
        const k = (t - this.t0) / this.dur; const bar = $('#qBar'); if (bar) bar.style.width = Math.min(100, k * 100) + '%';
        if (k >= 1) this.go(1);
      } else this.t0 = t - (parseFloat(($('#qBar') || {}).style?.width || 0) / 100) * this.dur;
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
    const hero = root.querySelector('.quote-hero');
    hero.addEventListener('pointerenter', () => this.paused = true); hero.addEventListener('pointerleave', () => { if (!this.held) this.paused = false; });
  },
  stop() { cancelAnimationFrame(this.raf); this.raf = null; },
  go(d) {
    const el = $('#qText'); if (!el) return;
    this.idx = (this.idx + d + MOTIVATION.length) % MOTIVATION.length; this.t0 = performance.now();
    const swap = () => { el.innerHTML = this.words(MOTIVATION[this.idx]); this.reveal(el); const c = $('#qCount'); if (c) c.textContent = `${pad2(this.idx + 1)} / ${MOTIVATION.length}`; };
    if (Motion.off) return swap();
    Motion.anim(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-30 * d}px) skewX(${6 * d}deg)` }], { duration: 260, easing: EASE.io, fill: 'forwards' }).then(() => { el.getAnimations && el.getAnimations().forEach(a => a.cancel()); swap(); });
  },
  togglePause(btn) { this.held = !this.held; this.paused = this.held; btn.innerHTML = icon(this.held ? 'play' : 'pause'); btn.setAttribute('aria-label', this.held ? 'Play quotes' : 'Pause quotes'); UI.icons(btn); },
  /* kinetic type: each word drops in, highlighted words land last with a punch */
  reveal(el) {
    if (Motion.off) return;
    $$('.w', el).forEach((w, i) => {
      const hot = !!w.querySelector('em');
      Motion.anim(w, [{ opacity: 0, transform: 'translateY(.6em) rotateX(-70deg)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'none' }], { duration: 520, delay: 80 + i * 70 + (hot ? 160 : 0), easing: 'cubic-bezier(.2,1.3,.4,1)' });
    });
  },
  /* short full-screen pre-mission quote; tap anywhere to skip; never blocks logging */
  flash(s) {
    if (Motion.off) return;
    const q = MOTIVATION[(((s.week * 4 + s.day + this.today()) % MOTIVATION.length) + MOTIVATION.length) % MOTIVATION.length];
    const el = document.createElement('div'); el.id = 'qflash'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Mission start');
    el.innerHTML = `<div class="qbeam" aria-hidden="true"></div><div class="qk">MISSION START · WEEK ${s.week} · DAY ${s.day}</div><p class="qtext">${this.words(q)}</p><div class="qline"><i></i></div><div class="qtap">TAP TO START LOGGING</div>`;
    document.body.appendChild(el);
    const dur = Motion.modeName() === 'cinematic' ? 2600 : 1600;
    this.reveal($('.qtext', el));
    Motion.anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
    Motion.anim($('.qline i', el), [{ width: '0%' }, { width: '100%' }], { duration: dur, easing: 'linear', fill: 'forwards' });
    let gone = false;
    const close = () => { if (gone) return; gone = true; Motion.anim(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(1.06)' }], { duration: 260, fill: 'forwards' }).then(() => el.remove()); };
    el.addEventListener('click', close); setTimeout(close, dur);
    Haptics.beep([392, 523], .12);
  },
  forRest() { return this.plain(MOTIVATION[Math.floor(Date.now() / 20000) % MOTIVATION.length]); }
};

/* season progress block: big %, field bar with ball, 11 week bars, this week's sessions, next milestone */
const Season = {
  html(st, opts = {}) {
    const pct = st.programPct, P = State.program, wk = st.programWeek, done = st.doneUnique, total = st.total;
    const fillPct = pct * 100;
    const yards = ['G', '10', '20', '30', '40', '50', '40', '30', '20', '10', 'G'];
    const bars = st.weekly.map((w, i) => { const f = w.scheduled ? w.done / w.scheduled : 0, cls = (f >= 1 ? 'done ' : '') + (i + 1 === wk && !st.preSeason ? 'cur' : ''); return `<button class="wb ${cls}" type="button" data-act="go-week" data-w="${i + 1}" style="--f:${f.toFixed(3)};--i:${i}" aria-label="Week ${i + 1}: ${w.done} of ${w.scheduled} workouts"><span class="col"><i></i></span><span>W${i + 1}</span></button>`; }).join('');
    const ws = Program.week(wk), stIcon = { completed: 'check', in_progress: 'play', missed: 'x', skipped: 'skip-forward', due: 'flag', upcoming: 'circle' };
    const pills = ws.map(w => { const s = st.status[w.id]; return `<button class="wp ${s}" type="button" data-act="preview" data-id="${w.id}" aria-label="Day ${w.day}, ${esc(w.title)}, ${ST_LABEL[s]}"><span class="ic">${s === 'upcoming' ? '' : icon(stIcon[s] || 'circle')}</span><b>${DAYN(w.day)}</b><small>${esc(w.title)}</small></button>`; }).join('');
    const weekDone = ws.filter(w => st.status[w.id] === 'completed').length;
    const ms = [[.25, 'First Quarter'], [.5, 'Halftime'], [.75, 'Fourth Quarter'], [1, 'Full Season']].find(([t]) => pct < t);
    const msText = ms ? `<b>${Math.max(1, Math.ceil(ms[0] * total) - done)}</b> more workout${Math.ceil(ms[0] * total) - done === 1 ? '' : 's'} to <b>${ms[1]}</b> (${ms[0] * 100}%)` : '<b>Every scheduled workout is complete.</b>';
    return `<section class="panel season" data-stg aria-label="Season progress">

      <div class="sfield" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(fillPct)}" aria-label="Program completion">
        <span class="ez" style="left:0">START</span><span class="ez" style="right:0">GAME DAY</span>
        <div class="lines"></div><div class="sfill" data-w="${fillPct.toFixed(2)}"></div>
        <div class="nums" aria-hidden="true">${yards.map(y => `<span>${y}</span>`).join('')}</div>
        <span class="bubble" data-l="${(7 + fillPct * .86).toFixed(2)}" style="left:7%">${Math.round(fillPct)}%</span>
        <svg class="ball" data-l="${(7 + fillPct * .86).toFixed(2)}" style="left:7%" viewBox="0 0 34 22" aria-hidden="true"><ellipse cx="17" cy="11" rx="15" ry="9" fill="#E87722" stroke="#FFFFFF" stroke-width="1.6"/><path d="M9 11h16M13 8.5v5M16 8.5v5M19 8.5v5M22 8.5v5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/></svg>
      </div>
      <div><div class="label" style="margin-bottom:6px">Week by week</div><div class="weekbars">${bars}</div></div>

      <div class="milestone">${icon('trophy')}<span>${msText}</span></div>

  },
  /* animate the field fill and the ball from the goal line to today's position */
  run(root) {
    $$('.sfield', root).forEach(f => {
      const fill = $('.sfill', f), ball = $('.ball', f), bub = $('.bubble', f);
      const go = () => { fill.style.width = (fill.dataset.w * .86) + '%'; ball.style.left = ball.dataset.l + '%'; bub.style.left = bub.dataset.l + '%'; };
      if (Motion.off) { fill.style.transition = ball.style.transition = bub.style.transition = 'none'; go(); } else requestAnimationFrame(() => setTimeout(go, 250));
    });
  }
};

/* scroll reveals for anything that starts below the fold (already visible content is never hidden) */
const Reveal = {
  io: null,
  observe(root) {
    if (this.io) this.io.disconnect();
    if (Motion.off || !('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return; this.io.unobserve(e.target);
      const m = Motion.m; Motion.anim(e.target, [{ opacity: 0, transform: `translateY(${28 * m.camera + 10}px) scale(.97) rotateX(${6 * m.camera}deg)` }, { opacity: 1, transform: 'none' }], { duration: m.std + 220, easing: EASE.out });
    }), { threshold: .12 });
    const vh = innerHeight;
    $$('.panel, .metric, .wk-item, .lib-item, .quote-hero, .ticker, .season, .journey', root).forEach(el => { if (el.getBoundingClientRect().top > vh * .92) this.io.observe(el); });

const AWARD_ORDER = ['Maroon', 'Orange', 'Hokie', 'Iron Hokie'];

   Videos play inside the app in a bottom sheet (youtube-nocookie embed, inline on phones),
   so Cliff never leaves the workout: the clock, rest timer and logged sets keep going.
   Where a host blocks embedded players (for example a preview frame), the sheet says so
   after a few seconds and offers the YouTube link as a fallback. */
const WARMUP_VIDEO = [   // order matters: the more specific names first
  [/pnf/i, '@pnf'], [/toe touch/i, '@toe'], [/knee hug/i, '@knee'], [/butt kick/i, '@butt'], [/low shuffle/i, '@shuffle'],
  [/a-series|a-skips|a-runs/i, '@aseries'], [/fast leg/i, '@fastleg'],
  [/lunge (and|with) reach/i, '@backlunge'], [/backward high knee/i, '@backhigh'], [/backward skip/i, '@backskip'],
  [/low carioca/i, '@lowcarioca'], [/carioca/i, '@carioca'], [/duck walk/i, '@duck'], [/high knee crossover/i, '@highcross'],
  [/^high knees?$/i, '@highknees'], [/lunge walk with twist/i, '@lungewalk'], [/lunge and twist/i, '@lungetwist'],
  [/power skip/i, '@powerskip'], [/single leg speed hop/i, '@slspeed'], [/single leg hops?$/i, '@slhops']
];
const Video = {
  for(exId) { return VIDEOS[exId] || (VT_AB_ALIAS[exId] && VIDEOS[VT_AB_ALIAS[exId]]) || null; },
  forDrill(name) { const m = WARMUP_VIDEO.find(([re]) => re.test(name)); return m ? VIDEOS[m[1]] : null; },
  btn(exId, label = 'Watch how', cls = 'btn sm') { return this.for(exId) ? `<button type="button" class="${cls} vbtn" data-act="video" data-ex="${esc(exId)}">${icon('play')} ${esc(label)}</button>` : ''; },
  dot(exId) { return this.for(exId) ? `<span class="vdot" title="Technique video" aria-label="Has technique video">${icon('play')}</span>` : ''; },
  url(id, short) { return short ? `https://www.youtube.com/shorts/${id}` : `https://www.youtube.com/watch?v=${id}`; },
  src(id) {
    const o = /^https?:/.test(location.origin) ? `&origin=${encodeURIComponent(location.origin)}` : '';
    return `https://www.youtube-nocookie.com/embed/${id}?playsinline=1&rel=0&modestbranding=1&enablejsapi=1&autoplay=1${o}`;
  },
  open(exId, title, list) {
    list = list || this.for(exId); if (!list || !list.length) return;
    const def = exId ? Program.exDef(exId) : null;
    const name = title || (def ? def.name : 'Technique');
    const notes = def && def.notes && !/^Not described/.test(def.notes) ? def.notes : '';
    Sheet.open({
      title: name,
      html: `<div class="vstage ${list[0][1] === 's' ? 'short' : ''}" id="vStage"><div class="vload" id="vLoad"><span class="vspin"></span><span>Loading video…</span></div></div>
        ${list.length > 1 ? `<div class="chips" style="margin:0">${list.map((v, i) => `<button type="button" class="chip" data-vi="${i}" aria-pressed="${i === 0}">Video ${i + 1}${v[1] === 's' ? ' · short' : ''}</button>`).join('')}</div>` : ''}
        ${Workout.active() ? `<p class="muted" style="font-size:12.5px">${icon('timer')} Your workout clock and rest timer keep running while you watch.</p>` : ''}
        ${notes ? `<details class="panel flat"><summary class="label" style="cursor:pointer">Coaching points from the book</summary><p style="margin-top:6px;font-size:14px">${esc(notes)}</p></details>` : ''}
        <p class="muted" style="font-size:12px">Videos from Cliff's VT Workout document, played from YouTube.</p>`,
      onMount: sh => {
        this.load(list[0], sh);
        $$('[data-vi]', sh).forEach(b => b.onclick = () => { $$('[data-vi]', sh).forEach(x => x.setAttribute('aria-pressed', x === b)); this.load(list[+b.dataset.vi], sh); });
      },
      onClose: () => this.stop()
    });
  },
  load([id, kind, start], sh) {
    this.stop();
    const stage = $('#vStage', sh); stage.classList.toggle('short', kind === 's');
    stage.innerHTML = `<div class="vload" id="vLoad"><span class="vspin"></span><span>Loading video…</span></div>`;
    const f = document.createElement('iframe');
    f.className = 'vframe'; f.title = 'Technique video'; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen = true;
    f.referrerPolicy = 'strict-origin-when-cross-origin'; f.src = this.src(id) + (start ? `&start=${start}` : '');
    stage.appendChild(f);
    this.ok = false;
    // the YouTube player talks back via postMessage once it is running; silence means the embed was blocked
    this.onMsg = e => { if (/youtube(-nocookie)?\.com$/.test((() => { try { return new URL(e.origin).hostname; } catch (x) { return ''; } })())) { this.ok = true; const l = $('#vLoad'); l && l.remove(); } };
    addEventListener('message', this.onMsg);
    f.addEventListener('load', () => { try { f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch (x) { } });
    this.timer = setTimeout(() => {
      if (this.ok) return;
      const l = $('#vLoad'); if (!l) return;
      l.classList.add('fail');
      l.innerHTML = `${icon('circle-alert')}<b>The video can't play in this view.</b><span>Some previews block embedded players. In the installed app it plays right here. For now you can open it on YouTube.</span><a class="btn sm primary" href="${this.url(id, kind === 's')}${start ? (kind === 's' ? '' : `&t=${start}s`) : ''}" target="_blank" rel="noopener">${icon('play')} Open on YouTube</a>`;
      UI.icons(l);
    }, 6000);
  },
  stop() { clearTimeout(this.timer); if (this.onMsg) removeEventListener('message', this.onMsg); this.onMsg = null; const f = $('.vframe'); if (f) f.src = 'about:blank'; }
};

TAB_OF.nutrition = 'nutrition';

Actions['water-set'] = el => { const v = +el.dataset.v; Water.set(Water.get() === v ? v - 1 : v); const y = scrollY; UI.render(); scrollTo(0, y); };

/* ============ ACCOUNTS & CLOUD SYNC (Supabase) ============
   Turned on only when index.html carries a HOKIE_CLOUD config (Project URL + anon key) and the
   page is served from a web address. Without it the app runs exactly as before (code gate, data on
   this device only).
   • Each person logs in with a username + password (stored by Supabase as username@loginDomain).
   • Everything is saved on the phone under that person's own namespace, so two people sharing a
     phone never see each other's data, and copied to the cloud so it follows them to any phone.
   • New accounts wait for the admin's approval; the admin can approve, revoke, reset or delete. */
const CLOUD_CFG = (typeof window !== 'undefined' && window.HOKIE_CLOUD) || {};
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
const USER_RE = /^[a-z0-9][a-z0-9._-]{2,23}$/;

const Cloud = {
  on: !!(CLOUD_CFG.url && CLOUD_CFG.anonKey) && /^https?:$/.test(location.protocol),
  sb: null, user: null, profile: null, ns: '',
  status: 'idle', lastSync: null, lastPull: 0, timer: null, retry: null, pushing: false, again: false, admin: { list: null, at: 0, err: '' },

  /* loginDomain 'example.com' → u@example.com · or a real inbox 'me@gmail.com' → me+u@gmail.com (plus-addressing; nothing is ever sent) */
  email(u) { const d = String(CLOUD_CFG.loginDomain || 'hokiepower.app').trim(); if (d.includes('@')) { const [l, h] = d.split('@'); return `${l}+${u}@${h}`; } return `${u}@${d}`; },
  load() {
    if (window.supabase && window.supabase.createClient) return Promise.resolve();
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = SUPABASE_JS; s.onload = () => res(); s.onerror = () => rej(new Error('offline')); document.head.appendChild(s); });
  },
  msg(e) {
    const m = String((e && (e.message || e.error_description || e.msg)) || e || '');
    if (/invalid login credentials/i.test(m)) return 'Username or password is wrong.';
    if (/already registered|already exists|duplicate key/i.test(m)) return 'That username is taken. Pick another one.';
    if (/not authori[sz]ed|cannot be used as it is not/i.test(m)) return 'Supabase tried to send a confirmation email. Turn "Confirm email" off in Supabase (setup guide, step 2), click Save, then try again.';
    if (/email.*invalid|invalid.*email|email_address_invalid/i.test(m)) return 'Supabase rejected the made-up login address. Change loginDomain in index.html (setup guide, troubleshooting), then try again.';
    if (/signups? not allowed|signup.*disabled/i.test(m)) return 'New accounts are switched off in Supabase (Authentication → Sign In / Providers → Allow new users to sign up).';
    if (/password/i.test(m) && /(short|least|weak)/i.test(m)) return 'Password is too short — use at least 8 characters.';
    if (/rate limit|too many/i.test(m)) return 'Too many tries. Wait a minute and try again.';
    if (/failed to fetch|network|offline|load failed/i.test(m)) return 'No connection. Check your internet and try again.';
    if (/relation .*profiles.* does not exist|profiles/i.test(m) && /exist|schema/i.test(m)) return 'The database is not set up yet — run setup.sql in Supabase (setup guide, step 3).';
    return m || 'Something went wrong.';
  },

  /* ---------- start-up: log in, check access, pick this person's storage ---------- */
  async start() {
    try { await this.load(); }
    catch (e) {
      // offline with a saved login: keep training on this phone, sync later
      const last = LSX.get('bbp.cloud.last', null);
      if (last && last.status === 'active') { this.useNamespace(last.id); this.user = { id: last.id }; this.profile = last; this.status = 'offline'; return true; }
      await this.screen('offline'); return false;
    }
    this.sb = window.supabase.createClient(CLOUD_CFG.url, CLOUD_CFG.anonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'bbp.auth' } });
    let sess = null;
    try { const { data } = await this.sb.auth.getSession(); sess = data && data.session; } catch (e) { }
    if (!sess) { const ok = await this.authScreen(); if (!ok) return false; }
    else this.user = sess.user;
    // access check
    for (;;) {
      const r = await this.fetchProfile();
      if (r === 'ok') break;
      if (r === 'offline') {
        const last = LSX.get('bbp.cloud.last', null);
        if (last && last.id === this.user.id && last.status === 'active') { this.profile = last; this.status = 'offline'; break; }
        await this.screen('offline'); return false;
      }
      const again = await this.screen(r);   // pending / revoked / nodb
      if (again === 'logout') { await this.logout(true); return false; }
    }
    this.useNamespace(this.user.id);
    await this.claimLegacy();
    if (!LSX.get(LS.settings, null)) {   // a new athlete: the intro and locker greet them by name
      const u = this.profile.username, nm = u.charAt(0).toUpperCase() + u.slice(1).replace(/[._-].*$/, '');
      DEFAULT_SETTINGS.name = nm;
    }
    this.sb.rpc('touch_last_seen').then(() => { }, () => { });
    this.watch();
    return true;
  },
  async fetchProfile() {
    try {
      const { data, error } = await this.sb.from('profiles').select('id,username,role,status').eq('id', this.user.id).maybeSingle();
      if (error) return /fetch|network/i.test(error.message) ? 'offline' : /does not exist|schema cache/i.test(error.message) ? 'nodb' : 'nodb';
      if (!data) return 'nodb';
      this.profile = data; LSX.set('bbp.cloud.last', data);
      return data.status === 'active' ? 'ok' : data.status;
    } catch (e) { return 'offline'; }
  },
  useNamespace(uid) {
    this.ns = 'u' + String(uid).replace(/-/g, '').slice(0, 12);
    Object.keys(LS).forEach(k => { LS[k] = LS[k].replace(/^bbp\.(u[0-9a-f]{12}\.)?/, `bbp.${this.ns}.`); });
    DB.name = `${APP_ID}.${this.ns}`; DB.lsPrefix = `bbp.${this.ns}.store.`;
    Water.key = `bbp.${this.ns}.water`;
  },

  /* ---------- the login / sign-up screen (stadium look, in the gate layer) ---------- */
  shell(inner) {
    const g = $('#gate'); g.hidden = false; g.className = 'auth';
    g.innerHTML = `<div class="gbg" aria-hidden="true"><div class="gbeam" style="left:4%"></div><div class="gbeam" style="left:96%;transform:translateX(-50%) rotate(14deg)"></div><div class="gfield"></div><div class="gendzone">HOKIES</div></div>
      <div class="gwrap"><div class="gcol"><header class="ghead" data-gs>${shield(40)}<div><b>HOKIE POWER</b><small>FLIGHT 2005 TO GLORY</small></div></header>${inner}</div></div>`;
    UI.icons(g);
    $$('[data-gs]', g).forEach((el, k) => Motion.anim(el, [{ opacity: 0, transform: 'translateY(20px)' }, { opacity: 1, transform: 'none' }], { duration: Motion.m.std + 160, delay: 60 + k * Motion.m.stagger * 1.4 }));
    return g;
  },
  close() { const g = $('#gate'); return Motion.anim(g, [{ opacity: 1 }, { opacity: 0 }], { duration: Motion.m.std + 120, fill: 'forwards' }).then(() => { g.hidden = true; g.innerHTML = ''; g.className = ''; g.style.opacity = ''; g.getAnimations && g.getAnimations().forEach(a => a.cancel()); }); },
  authScreen(mode = 'login') {
    return new Promise(res => {
      const draw = m => {
        mode = m;
        const g = this.shell(`
          <div class="ghero" data-gs><span class="label">Athlete entrance</span>
            <h1 class="gtitle">${m === 'login' ? 'Welcome back' : 'Join the team'}<span>.</span></h1>
            <p class="gsub">${m === 'login' ? 'Log in with your username and password.' : 'Pick a username and password. The coach approves new accounts before you can train.'}</p></div>
          <form class="gcode gauth" data-gs id="authForm" novalidate>
            <div class="seg auth-seg" role="tablist"><button type="button" role="tab" data-auth-mode="login" aria-selected="${m === 'login'}" aria-pressed="${m === 'login'}">Log in</button><button type="button" role="tab" data-auth-mode="signup" aria-selected="${m === 'signup'}" aria-pressed="${m === 'signup'}">Create account</button></div>
            <div class="field"><label for="authUser">Username</label><input class="input" id="authUser" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" required></div>
            <div class="field"><label for="authPass">Password</label><input class="input" id="authPass" name="password" type="password" autocomplete="${m === 'login' ? 'current-password' : 'new-password'}" required minlength="8"></div>
            ${m === 'signup' ? '<div class="field"><label for="authPass2">Repeat password</label><input class="input" id="authPass2" type="password" autocomplete="new-password" required></div><p class="gnote">3–24 characters: letters, numbers, dot, dash or underscore. Password: at least 8 characters.</p>' : ''}
            <p class="gmsg" id="authMsg" role="status" aria-live="polite"></p>
            <button type="submit" class="btn big red block" id="authGo">${m === 'login' ? 'Enter the facility' : 'Create my account'}</button>
          </form>
          <p class="gfoot" data-gs>Forgot your password? Ask the coach to reset it.</p>`);
        $$('[data-auth-mode]', g).forEach(b => b.onclick = () => { if (b.dataset.authMode !== mode) draw(b.dataset.authMode); });
        $('#authForm', g).onsubmit = async e => {
          e.preventDefault();
          const u = $('#authUser').value.trim().toLowerCase(), p = $('#authPass').value, msg = $('#authMsg'), go = $('#authGo');
          const fail = (t, raw) => { msg.innerHTML = esc(t) + (raw && raw !== t ? `<small class="graw">Supabase said: ${esc(raw)}</small>` : ''); g.classList.add('err'); Haptics.buzz(); setTimeout(() => g.classList.remove('err'), 500); };
          if (!USER_RE.test(u)) return fail('Usernames are 3–24 characters: letters, numbers, dot, dash or underscore.');
          if (p.length < 8) return fail('Password must be at least 8 characters.');
          if (mode === 'signup' && p !== $('#authPass2').value) return fail("The two passwords don't match.");
          go.disabled = true; msg.innerHTML = Kinetic.wave(mode === 'login' ? 'CHECKING…' : 'BUILDING YOUR LOCKER…'); Kinetic.busy(true);
          try {
            const r = mode === 'login'
              ? await this.sb.auth.signInWithPassword({ email: this.email(u), password: p })
              : await this.sb.auth.signUp({ email: this.email(u), password: p, options: { data: { username: u } } });
            if (r.error) throw r.error;
            if (!r.data.session) { Kinetic.busy(false); go.disabled = false; return fail('Account created, but Supabase is asking for email confirmation. Turn "Confirm email" off (setup guide, step 2), then log in.'); }
            Kinetic.busy(false); this.user = r.data.session.user; msg.innerHTML = Kinetic.wave('WELCOME.'); Haptics.beep([523, 784], .1);
            await this.close(); res(true);
          } catch (err) { Kinetic.busy(false); go.disabled = false; fail(this.msg(err), String((err && (err.message || err.msg)) || '')); }
        };
        setTimeout(() => { const f = $('#authUser'); f && f.focus({ preventScroll: true }); }, 80);
      };
      draw(mode);
    });
  },
  /* waiting / revoked / not set up / offline */
  screen(kind) {
    const T = {
      pending: ['Waiting for approval', `Your account <b>${esc(this.profile ? this.profile.username : '')}</b> is created. The coach needs to approve it before you can train. Ask them to open Admin in the app.`],
      revoked: ['Access switched off', 'Your access to this app has been turned off by the coach. Your saved training is kept. Ask the coach if you think this is a mistake.'],
      nodb: ['Database not set up', 'You are logged in, but the app could not find its tables. The admin needs to run setup.sql in Supabase (setup guide, step 3).'],
      offline: ['No connection', 'The app needs the internet the first time you log in on this phone. Connect and try again.']
    }[kind];
    return new Promise(res => {
      const g = this.shell(`<div class="ghero" data-gs><span class="label">Athlete entrance</span><h1 class="gtitle">${T[0]}<span>.</span></h1><p class="gsub">${T[1]}</p></div>
        <div class="stack" data-gs><button class="btn big red block" type="button" id="authAgain">${icon('refresh-cw')} Check again</button>${kind !== 'offline' ? '<button class="btn block ghost" type="button" id="authOut">Log out</button>' : ''}</div>`);
      $('#authAgain', g).onclick = async () => { if (kind === 'offline') { location.reload(); return; } await this.close(); res('again'); };
      const o = $('#authOut', g); if (o) o.onclick = async () => { await this.close(); res('logout'); };
    });
  },

  /* ---------- this phone had data from before accounts existed ---------- */
  legacyFound() { try { return !!localStorage.getItem('bbp.profile') && !localStorage.getItem('bbp.legacyClaimed'); } catch (e) { return false; } },
  async claimLegacy() {
    if (!this.legacyFound() || LSX.get(LS.profile, null)) return;
    const old = LSX.get('bbp.profile', {}), name = esc((old && old.name) || 'an athlete');
    const yes = await new Promise(res => {
      const g = this.shell(`<div class="ghero" data-gs><span class="label">Training found on this phone</span><h1 class="gtitle">Is this yours<span>?</span></h1>
        <p class="gsub">This phone has training saved from before accounts (profile: <b>${name}</b>). Move it into <b>${esc(this.profile.username)}</b>'s account so it is backed up and follows you to any phone?</p></div>
        <div class="stack" data-gs><button class="btn big red block" type="button" id="lgYes">Yes, it's mine — move it</button><button class="btn block ghost" type="button" id="lgNo">No, start fresh</button></div>`);
      $('#lgYes', g).onclick = () => res(true); $('#lgNo', g).onclick = () => res(false);
    });
    if (yes) {
      Object.keys(LS).forEach(k => { const legacy = 'bbp.' + LS[k].split('.').pop(); try { const v = localStorage.getItem(legacy); if (v != null && k !== 'gate') localStorage.setItem(LS[k], v); } catch (e) { } });
      try { const w = localStorage.getItem('bbp.water'); if (w) localStorage.setItem(Water.key, w); } catch (e) { }
      const stores = await this.readLegacyStores();
      const mode = await DB.open();
      for (const s of STORES) { if (mode === 'idb') { for (const o of (stores[s] || [])) await DB.put(s, o, true); } else if (mode === 'ls') LSX.set(DB.lsPrefix + s, stores[s] || []); }
      if (mode === 'idb' && DB.db) { DB.db.close(); DB.db = null; }
    }
    try { localStorage.setItem('bbp.legacyClaimed', this.profile.username); } catch (e) { }
    await this.close();
  },
  readLegacyStores() {
    return new Promise(res => {
      const out = {}; STORES.forEach(s => out[s] = LSX.get('bbp.store.' + s, []) || []);
      if (!window.indexedDB) return res(out);
      let req; try { req = indexedDB.open(APP_ID, 1); } catch (e) { return res(out); }
      req.onupgradeneeded = () => { const d = req.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
      req.onerror = () => res(out);
      req.onsuccess = async () => {
        const db = req.result;
        for (const s of STORES) out[s] = out[s].concat(await new Promise(r => { try { const q = db.transaction(s).objectStore(s).getAll(); q.onsuccess = () => r(q.result || []); q.onerror = () => r([]); } catch (e) { r([]); } }));
        db.close(); res(out);
      };
    });
  },

  /* ---------- sync ---------- */
  snapshot() {
    const strip = (k, v) => (k.startsWith('_') ? undefined : v);
    return JSON.parse(JSON.stringify({ v: 1, app: APP_ID, schema: SCHEMA_VERSION, savedAt: Date.now(), resetAt: State.meta.cloudResetAt || 0,
      settings: State.settings, profile: State.profile, meta: { onboarded: !!State.meta.onboarded, introSeen: !!State.meta.introSeen, finaleSeen: !!State.meta.finaleSeen },
      water: LSX.get(Water.key, {}), deleted: State.meta.deleted || {}, sessions: State.sessions, results: State.results, bodyweight: State.bodyweight, achievements: State.achievements }, strip));
  },
  /* merge the cloud copy into this phone: newest version of each record wins, deletions travel too */
  async merge(r) {
    if (!r || r.app !== APP_ID) return false;
    let changed = false;
    if (r.resetAt && r.resetAt > (State.meta.cloudResetAt || 0)) {          // someone pressed "erase all" on another phone
      for (const s of STORES) { await DB.clear(s); State[s] = []; }
      State.meta.cloudResetAt = r.resetAt; State.meta.deleted = {}; changed = true;
      State.profile = r.profile || null; LSX.set(LS.profile, State.profile); State.meta.onboarded = !!(r.meta && r.meta.onboarded); State.meta.activeSessionId = null;
    }
    const del = State.meta.deleted = State.meta.deleted || {};
    for (const s of STORES) {
      const rd = (r.deleted || {})[s] || {}; del[s] = Object.assign({}, del[s] || {}, rd);
      for (const o of (r[s] || [])) {
        if (!o || !o.id || (del[s][o.id] && del[s][o.id] >= (o.updatedAt || 0))) continue;
        const i = State[s].findIndex(x => x.id === o.id), cur = i >= 0 ? State[s][i] : null;
        if (!cur || (o.updatedAt || 0) > (cur.updatedAt || 0)) { if (i >= 0) State[s][i] = o; else State[s].push(o); await DB.put(s, o, true); changed = true; }
      }
      for (const id in del[s]) { const i = State[s].findIndex(x => x.id === id); if (i >= 0 && (State[s][i].updatedAt || 0) <= del[s][id]) { State[s].splice(i, 1); await DB.del(s, id); changed = true; } }
    }
    if (r.profile && (!State.profile || (r.profile.updatedAt || 0) > (State.profile.updatedAt || 0))) { State.profile = r.profile; LSX.set(LS.profile, r.profile); changed = true; }
    if (r.settings && (r.settings.savedAt || 0) > (State.settings.savedAt || 0)) { State.settings = Object.assign({}, DEFAULT_SETTINGS, r.settings); LSX.set(LS.settings, State.settings); Motion.apply && Motion.apply(); changed = true; }
    const m = r.meta || {}; ['onboarded', 'introSeen', 'finaleSeen'].forEach(k => { if (m[k] && !State.meta[k]) { State.meta[k] = true; changed = true; } });
    if (r.water) { const w = LSX.get(Water.key, {}); let wc = false; for (const d in r.water) if ((r.water[d] || 0) > (w[d] || 0)) { w[d] = r.water[d]; wc = true; } if (wc) { LSX.set(Water.key, w); changed = true; } }
    LSX.set(LS.meta, State.meta);
    if (changed) State.version++;
    return changed;
  },
  async pull() {
    if (!this.sb || !this.user) return false;
    try {
      const { data, error } = await this.sb.from('user_data').select('data,updated_at').eq('user_id', this.user.id).maybeSingle();
      if (error) throw error;
      this.lastPull = Date.now();
      const changed = data ? await this.merge(data.data) : false;
      if (!data || changed) this.dirty(0);
      this.set('synced');
      return changed;
    } catch (e) { this.set('offline'); return false; }
  },
  dirty(ms = 2500) {
    if (!this.on || !this.user || !this.sb) return;
    clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), ms);
    if (this.status !== 'saving') this.set('pending');
  },
  async push() {
    if (!this.sb || !this.user) return;
    if (this.pushing) { this.again = true; return; }
    this.pushing = true; this.set('saving');
    try {
      const { error } = await this.sb.from('user_data').upsert({ user_id: this.user.id, data: this.snapshot(), updated_at: new Date().toISOString() });
      if (error) throw error;
      this.lastSync = Date.now(); this.set('synced'); clearTimeout(this.retry);
    } catch (e) {
      this.set(/row-level security|permission|42501/i.test(String(e && e.message)) ? 'denied' : 'offline');
      clearTimeout(this.retry); this.retry = setTimeout(() => this.push(), 60000);
    } finally { this.pushing = false; if (this.again) { this.again = false; this.push(); } }
  },
  set(st) {
    this.status = st;
    const el = $('#syncState'); if (el) el.outerHTML = this.badge();
  },
  badge() {
    const m = { synced: ['ok', 'cloud', `Saved to your account${this.lastSync ? ' · ' + new Date(this.lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}`], saving: ['', 'refresh-cw', 'Saving…'], pending: ['', 'refresh-cw', 'Changes waiting to save'], offline: ['warn', 'cloud-off', 'Offline — saved on this phone, will sync later'], denied: ['red', 'cloud-off', 'Not saved to the cloud — your access may be off'], idle: ['', 'cloud', 'Connecting…'] }[this.status] || ['', 'cloud', ''];
    return `<span class="badge ${m[0]}" id="syncState">${icon(m[1])} ${esc(m[2])}</span>`;
  },
  watch() {
    window.addEventListener('online', () => this.dirty(500));
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') { if (this.status === 'pending') { clearTimeout(this.timer); this.push(); } }
      else if (Date.now() - this.lastPull > 60000) this.pull().then(ch => { if (ch && !$('#sheet-root').innerHTML && UI.route.name !== 'workout') UI.render(); });
    });
  },
  async logout(silent) {
    if (!silent && this.status === 'pending') await this.push();
    try { await this.sb.auth.signOut(); } catch (e) { }
    LSX.del('bbp.cloud.last'); location.reload();
  },

  /* ---------- admin ---------- */
  /* the intro, locker and quotes greet each athlete by their own name */
  personalize() {
    const nm = String(State.settings.name || 'Cliff').trim(), up = nm.toUpperCase(); if (up === 'CLIFF') return;
    MOTIVATION.forEach((q, i) => { MOTIVATION[i] = q.replace(/\bCLIFF\b/g, esc(up)); });
    const t = $('.t-cliff'), np = $('#nameplate'); if (t) t.textContent = up; if (np) np.textContent = up;
  },
  isAdmin() { return !!(this.on && this.profile && this.profile.role === 'admin' && this.profile.status === 'active'); },
  async adminLoad(force) {
    if (!force && this.admin.list && Date.now() - this.admin.at < 15000) return;
    try { const { data, error } = await this.sb.rpc('admin_list_users'); if (error) throw error; this.admin = { list: data || [], at: Date.now(), err: '' }; }
    catch (e) { this.admin.err = this.msg(e); this.admin.list = this.admin.list || []; this.admin.at = Date.now(); }
    if (UI.route.name === 'admin') UI.render();
  },
  async adminDo(fn, args, ok) {
    try { const { error } = await this.sb.rpc(fn, args); if (error) throw error; UI.toast(ok); await this.adminLoad(true); }
    catch (e) { UI.toast(this.msg(e), 'bad'); }
  }
};

/* every local save also schedules a cloud save; deletions leave a dated marker so they sync too */
(() => {
  const wrap = k => { const f = Store[k]; Store[k] = function (...a) { const r = f.apply(Store, a); Cloud.dirty(); return r; }; };
  const rm = Store.remove; Store.remove = function (store, id) { const d = State.meta.deleted = State.meta.deleted || {}; (d[store] = d[store] || {})[id] = Date.now(); LSX.set(LS.meta, State.meta); return rm.call(Store, store, id); };
  const ss = Store.saveSettings; Store.saveSettings = function () { State.settings.savedAt = Date.now(); return ss.call(Store); };
  ['save', 'remove', 'saveSettings', 'saveProfile'].forEach(wrap);
  const wset = Water.set; Water.set = function (n) { const r = wset.call(Water, n); Cloud.dirty(); return r; };
})();

/* ============ KINETIC TYPE & TAP FX ============
   • Page change: a maroon/orange wipe sweeps across with the page name in huge letters.
   • New screen: titles assemble letter by letter, scoreboard numbers roll like a slot machine.
   • Tap: an orange ring and sparks burst from the finger.
   • Loading: letters ride a wave ("LOADING", "SAVING…") and a thin bar runs along the top.
   Everything is skipped when Motion is set to minimal / reduced. */
const Kinetic = {
  last: '', busyN: 0,
  NAMES: { home: 'GAME DAY', training: 'TRAINING', workout: 'WORKOUT', progress: 'PROGRESS', nutrition: 'FUEL', more: 'LOCKER', history: 'HISTORY', session: 'REPORT', settings: 'SETTINGS', profile: 'PROFILE', backup: 'BACKUP', summary: 'SUMMARY', about: 'ABOUT', admin: 'TEAM' },
  /* split a plain-text element into letter spans (words stay unbroken) */
  letters(el, base = 0, cls = 'kl') {
    if (!el || el.dataset.kSplit || el.children.length) return 0;
    const t = el.textContent; if (!t.trim() || t.length > 60) return 0;
    el.dataset.kSplit = '1'; el.setAttribute('aria-label', t.trim());
    let i = base;
    el.innerHTML = t.split(/(\s+)/).map(w => /^\s+$/.test(w) ? w : `<span class="kw" aria-hidden="true">${[...w].map(c => `<span class="${cls}" style="--i:${i++}">${esc(c)}</span>`).join('')}</span>`).join('');
    return i - base;
  },
  /* slot-machine digits: every digit spins, then lands left to right */
  roll(el, dur = 700) {
    if (!el || el.dataset.kRoll) return; el.dataset.kRoll = '1';
    const nodes = []; const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
    while ((n = w.nextNode())) if (/\d/.test(n.nodeValue)) nodes.push([n, n.nodeValue]);
    if (!nodes.length) return;
    const t0 = performance.now(), total = nodes.reduce((a, [, v]) => a + (v.match(/\d/g) || []).length, 0);
    const step = t => {
      const k = Math.min(1, (t - t0) / dur); let seen = 0;
      nodes.forEach(([node, orig]) => {
        if (!node.isConnected) return;
        node.nodeValue = orig.replace(/\d/g, d => { const settle = (seen++ + 1) / (total + 1); return k >= settle ? d : String((Math.random() * 10) | 0); });
      });
      if (k < 1) requestAnimationFrame(step); else nodes.forEach(([node, orig]) => { if (node.isConnected) node.nodeValue = orig; });
    };
    requestAnimationFrame(step);
  },
  /* a fresh screen arrived */
  enter(root) {
    if (Motion.off || !root) return;
    const titles = $$('.topbar > h1, .ex-name, .gtitle:not(:has(*)), .hero .label, .sheet-head h2', root);
    titles.forEach(h => { if (this.letters(h)) h.classList.add('k-on'); });
    $$('.target, .metric .v, .sb-val, .season-pct, .calc-out, .hero .h1, .award-total, .kpi', root).forEach((el, i) => setTimeout(() => this.roll(el, 650 + i * 40), 80 + i * 30));
  },
  /* full-screen wipe with the destination's name */
  wipe(name) {
    if (Motion.off) return;
    const word = this.NAMES[name] || String(name || '').toUpperCase(); if (!word) return;
    const old = $('#kwipe'); if (old) old.remove();
    const el = document.createElement('div'); el.id = 'kwipe'; el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `<div class="kw-band b1"></div><div class="kw-band b2"></div><div class="kw-word"></div><div class="kw-num">${String(TABS.indexOf(TAB_OF[name]) + 1).padStart(2, '0')}</div>`;
    $('.kw-word', el).textContent = word; this.letters($('.kw-word', el), 0, 'kwl');
    document.body.appendChild(el);
    const E = 'cubic-bezier(.7,0,.2,1)';
    el.animate([{ clipPath: 'polygon(0 0,0 0,-20% 100%,-20% 100%)' }, { clipPath: 'polygon(0 0,120% 0,100% 100%,-20% 100%)', offset: .38 }, { clipPath: 'polygon(0 0,120% 0,100% 100%,-20% 100%)', offset: .6 }, { clipPath: 'polygon(120% 0,120% 0,100% 100%,100% 100%)' }], { duration: 640, easing: E, fill: 'forwards' })
      .finished.then(() => el.remove(), () => el.remove());
  },
  /* tap burst at the finger */
  burst(x, y, strong) {
    if (Motion.off) return;
    const el = document.createElement('div'); el.className = 'kburst'; el.style.left = x + 'px'; el.style.top = y + 'px';
    const n = strong ? 10 : 6;
    el.innerHTML = '<i class="kring"></i>' + Array.from({ length: n }, (_, i) => `<b style="--a:${(360 / n) * i + Math.random() * 20}deg;--d:${(strong ? 46 : 30) + Math.random() * 16}px;--c:${i % 2 ? '#E87722' : '#861F41'}"></b>`).join('');
    document.body.appendChild(el); setTimeout(() => el.remove(), 700);
  },
  /* animated loading words */
  wave(text) { return `<span class="kwave" role="status" aria-label="${esc(text)}">${[...text].map((c, i) => c === ' ' ? ' ' : `<span style="--i:${i}">${esc(c)}</span>`).join('')}</span>`; },
  busy(on) {
    this.busyN = Math.max(0, this.busyN + (on ? 1 : -1));
    let bar = $('#kbar'); if (!bar) { bar = document.createElement('div'); bar.id = 'kbar'; bar.setAttribute('aria-hidden', 'true'); document.body.appendChild(bar); }
    bar.classList.toggle('on', this.busyN > 0);
  }
};

/* hooks: page wipe on tab change, kinetic entrance whenever a new screen lands */
(() => {
  const go = Nav.go.bind(Nav);
  Nav.go = function (name, param = null, opts = {}) {
    const from = TAB_OF[UI.route.name];
    if (TAB_OF[name] !== from && name !== UI.route.name) Kinetic.wipe(TAB_OF[name] === name ? name : name);
    return go(name, param, opts);
  };
  const watch = () => {
    const view = $('#view'); if (!view) return;
    new MutationObserver(() => {
      const key = UI.route.name + ':' + (UI.route.param || '');
      const scr = view.firstElementChild;
      if (key !== Kinetic.last) { Kinetic.last = key; Kinetic.enter(scr); }
      else if (UI.route.name === 'workout' && scr) {      // new exercise in the logger: name + target re-assemble
        const nm = $('.ex-name', scr); if (nm && nm.textContent !== Kinetic.lastEx) { Kinetic.lastEx = nm.textContent; Kinetic.enter(scr); }
      }
    }).observe(view, { childList: true });
    // sheets get the same letter treatment
    const sr = $('#sheet-root'); if (sr) new MutationObserver(() => { const h = $('.sheet-head h2', sr); if (h && !Motion.off && Kinetic.letters(h)) h.classList.add('k-on'); }).observe(sr, { childList: true });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch); else watch();
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest('.btn, .list-item, .wk-item, .chip, .ex-tab, #nav button, .seg button, .key, .chk, [data-act]');
    if (t && !t.disabled) Kinetic.burst(e.clientX, e.clientY, t.matches('.btn.big, .chk, .btn.primary, .btn.red'));
  }, { passive: true });
  // loading indicators for cloud work

/* ============ LOCK-SCREEN TRACKER + POCKET MODE ============

   and fills that card with a live, animated picture of the workout (exercise, set, rest ring),
   a native progress bar for the rest timer, and buttons:  ⏭ complete the set · ⏮ skip rest ·
   ⏯ pause/resume rest. When rest ends it plays a short whistle, even with the screen locked.

  },
  toggleRest() { const t = Rest.st; if (!t) return; if (t.running) Rest.pause(); else Rest.start(); this.update(true); },
  completeSet() {
    const s = Workout.active(); if (!s) return;
    const x = s.ex[s.cur]; if (!x) return; const si = x.sets.findIndex(t => !t.done);
    if (si < 0) { const nx = s.ex.findIndex(z => !z.skipped && z.sets.some(t => !t.done && !t.warm)); if (nx > -1) { s.cur = nx; Workout.persist(s); UI.renderLogger(); } this.update(true); return; }

  /* what the tracker shows right now */
  state() {

    const x = s.ex[s.cur] || s.ex[0], si = x.sets.findIndex(t => !t.done), t = si > -1 ? x.sets[si] : null;
    const work = x.sets.filter(z => !z.warm), doneX = work.filter(z => z.done).length;
    const total = s.ex.reduce((n, z) => n + (z.skipped ? 0 : z.sets.filter(q => !q.warm).length), 0), done = s.ex.reduce((n, z) => n + z.sets.filter(q => q.done && !q.warm).length, 0);
    const r = Rest.st, resting = !!(r && (r.running || r.remaining > 0) && !r.done), left = Rest.left();
    let target = '';
    if (t) { if (x.type === 'pct' && t.w) target = `${Units.fmtW(t.w)} ${unitW()} × ${t.pReps || t.reps || ''}`; else if (x.type === 'reps') target = `${t.w ? Units.fmtW(t.w) + ' ' + unitW() + ' × ' : ''}${t.pLabel || t.pReps || ''} ${x.unitLabel || 'reps'}`; else if (x.type === 'timed') target = `${t.pSec}s`; else if (x.type === 'sprint') target = x.distLabel || ''; else if (x.type === 'check') target = t.pLabel ? t.pLabel.split(' — ')[0] : 'Tap ⏭ when done'; }

  fmt(sec) { sec = Math.max(0, Math.ceil(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; },
  /* animated lock-screen picture */

/* ---------- Pocket mode: full-screen tracker, hold to act ---------- */
const Pocket = {
  open: false,
  show() {
    if (!Workout.active()) return;
    let el = $('#pocket'); if (!el) { el = document.createElement('div'); el.id = 'pocket'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Pocket mode'); document.body.appendChild(el); }
    el.innerHTML = `<div class="pk-bg" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="pk-top"><span class="label">POCKET MODE · SCREEN STAYS ON</span><span class="pk-sets" id="pkSets"></span></div>
      <div class="pk-ring" id="pkRing"><div class="pk-in"><div class="pk-big" id="pkBig"></div><div class="pk-sub" id="pkSub"></div></div><i class="pk-orb" id="pkOrb"></i></div>
      <div class="pk-dots" id="pkDots"></div>
      <h2 class="pk-name" id="pkName"></h2><div class="pk-target" id="pkTarget"></div>
      <div class="pk-acts"><button class="pk-hold primary" type="button" data-hold="done"><span class="pk-fill"></span><b>Hold · set done</b></button>
        <button class="pk-hold" type="button" data-hold="rest"><span class="pk-fill"></span><b>Hold · skip rest</b></button></div>
      <button class="pk-hold pk-exit" type="button" data-hold="exit"><span class="pk-fill"></span><b>Hold to unlock</b></button>`;
    el.hidden = false; this.open = true; WakeLock.on(); LockTrack.start();
    $$('[data-hold]', el).forEach(b => this.hold(b));
    const st = LockTrack.state(); st && this.paint(st, true);
    Motion.anim(el, [{ opacity: 0, transform: 'scale(1.08)' }, { opacity: 1, transform: 'none' }], { duration: 420 });
    clearInterval(this.iv); this.iv = setInterval(() => { const s2 = LockTrack.state(); if (!s2) return this.hide(); this.paint(s2); }, 500);
  },
  hide() { clearInterval(this.iv); this.open = false; const el = $('#pocket'); if (el) { el.hidden = true; el.innerHTML = ''; } UI.renderLogger(); },
  hold(b) {
    let t = null, raf = null; const fill = $('.pk-fill', b), need = b.dataset.hold === 'exit' ? 900 : 650;
    const reset = () => { clearTimeout(t); cancelAnimationFrame(raf); fill.style.transition = 'transform .2s'; fill.style.transform = 'scaleX(0)'; b.classList.remove('holding'); };
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); b.classList.add('holding'); fill.style.transition = `transform ${need}ms linear`; requestAnimationFrame(() => fill.style.transform = 'scaleX(1)');
      t = setTimeout(() => { reset(); Haptics.tap && Haptics.tap(); const a = b.dataset.hold; if (a === 'exit') this.hide(); else if (a === 'done') LockTrack.completeSet(); else { Rest.stop(); LockTrack.update(true); } }, need);

    $('#pkRing').style.setProperty('--p', (frac * 100).toFixed(2)); $('#pkRing').classList.toggle('rest', st.resting);
    $('#pkOrb').style.transform = `rotate(${frac * 360}deg)`;
    $('#pkBig').textContent = st.resting ? LockTrack.fmt(st.left) : st.rDone ? 'GO!' : `${st.setN}/${st.setOf}`;
    $('#pkSub').textContent = st.resting ? (st.paused ? 'REST PAUSED' : 'REST') : st.rDone ? 'REST OVER' : 'SET';
    $('#pkSets').textContent = `${st.done}/${st.total} sets`;
    $('#pkDots').innerHTML = Array.from({ length: Math.min(st.setOf, 12) }, (_, i) => `<i class="${i < st.doneX ? 'on' : ''}"></i>`).join('');

    $('#pkTarget').textContent = st.target;
  }
};

/* start the lock-screen card on the first tap during a workout; stop it when the workout ends */
document.addEventListener('pointerup', () => { if (!LockTrack.playing && Workout.active() && LockTrack.enabled()) LockTrack.start(); }, { passive: true });
setInterval(() => { if (LockTrack.playing && !Workout.active()) LockTrack.stop(); if (Pocket.open && !Workout.active()) Pocket.hide(); }, 2000);
Object.assign(Actions, {
  pocket: () => Pocket.show(),
  'lock-toggle': () => { State.settings.lockTracker = LockTrack.enabled() ? 'off' : 'on'; Store.saveSettings(); if (!LockTrack.enabled()) LockTrack.stop(); else LockTrack.start(); UI.renderLogger(); UI.toast(LockTrack.enabled() ? 'Lock-screen tracker on' : 'Lock-screen tracker off'); }

#view .calc-out{font-size:clamp(96px,32vw,150px)}

/* ---------- RULE 1 · three planes with overlap ---------- */
/* back plane: giant week number behind the headline */
#view .hero{isolation:isolate;padding-top:22px}
#view .hero .jersey{z-index:-1;right:auto;left:-10px;top:auto;bottom:38px;font-size:clamp(220px,72vw,340px);line-height:.72;
  color:rgba(255,255,255,.13);letter-spacing:-.04em}
body:not(.theme-light) #view .hero .jersey{color:rgba(183,190,195,.10)}
/* middle plane: headline sits over the number, ring nests into it */
#view .hero > .row{position:relative;z-index:1}
#view .hero .h1{text-shadow:0 12px 30px rgba(0,0,0,.25)}
/* front plane: scoreboard overlaps the hero's bottom edge like a button bar */
#view .hero .scoreboard{position:relative;z-index:2;margin:0 -6px -6px;box-shadow:0 18px 30px -18px rgba(0,0,0,.6);border-radius:14px}
body.theme-light #view .hero .scoreboard{background:rgba(255,255,255,.25)}
body.theme-light #view .hero .scoreboard>div{background:#fff;color:var(--ink)}
body.theme-light #view .hero .scoreboard .label{color:#75787B}
/* mission card: back word + action floating over the edge */
#view .mission{overflow:visible;isolation:isolate}
#view .mission .mhead{position:relative;overflow:hidden;border-radius:16px 16px 0 0}
#view .mission .mhead::after{content:"GO";position:absolute;right:-8px;bottom:-34px;z-index:-1;font-family:var(--f-display);font-weight:900;
  font-size:150px;line-height:1;color:currentColor;opacity:.07;pointer-events:none}
#view .mission .mbody .btn.big{position:relative;z-index:2;box-shadow:0 18px 30px -12px rgba(232,119,34,.9)!important}
/* workout card: target weight floats over a giant set number */
#view .excard{position:relative;isolation:isolate;overflow:hidden}
#view .excard::before{content:attr(data-plane);position:absolute;right:-10px;top:-30px;z-index:-1;font-family:var(--f-display);font-weight:900;
  font-size:230px;line-height:1;color:rgba(255,255,255,.08);pointer-events:none}
#view .excard .target{position:relative;text-shadow:0 14px 34px rgba(0,0,0,.35)}
/* page titles sit slightly behind the first panel (overlap) */
#view .screen>.topbar>h1.h2:not(.grow){position:relative;z-index:0}
#view .screen>.topbar+*{position:relative;z-index:1}
@media (min-width:1024px){
  #view .hero .h1{font-size:clamp(96px,8vw,140px)}
  #view .hero .jersey{font-size:300px}
  #view .topbar>h1.h2{font-size:84px}
}

/* v5 fixes: season card calmer, field strip without orange, safe title widths, CTA text fits */
#view .season-pct{font-size:30px!important;line-height:.9}
#view .season-pct small{font-size:.5em}
.sfield{background:linear-gradient(90deg,#1A1D20 0 7%,transparent 7% 93%,#1A1D20 93%),var(--g-maroon)!important}
.sfield .ball ellipse{fill:#FFFFFF!important}
.sfield .ball path{stroke:#861F41!important}
#view .topbar>h1.h2{font-size:clamp(40px,12vw,84px)!important;max-width:100%}
#view .topbar>h1.h2.grow{font-size:clamp(36px,11vw,68px)!important}
:where(#app) .btn.big{white-space:normal;line-height:1;padding-block:10px;font-size:clamp(17px,5.4vw,22px)}
</style>
