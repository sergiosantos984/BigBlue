/* chart reveal: axes → grid → points → lines/bars */
const ChartFX = {
  run(root) {
    $$('svg.chart', root).forEach(svg => {
      if (Motion.off) return; const m = Motion.m;
      $$('.grid line', svg).forEach((l, i) => Motion.anim(l, [{ opacity: 0 }, { opacity: 1 }], { duration: m.std, delay: i * 40 }));
      $$('.cline', svg).forEach(p => Motion.drawPath(p, 1, m.cine * 1.2, 200));
      $$('.dot', svg).forEach((d, i) => Motion.anim(d, [{ opacity: 0, transform: 'scale(0)' }, { opacity: 1, transform: 'scale(1)' }], { duration: m.std, delay: 300 + i * 50, easing: m.spring }));
      $$('.bar', svg).forEach((b, i) => Motion.anim(b, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: m.std + 200, delay: 120 + i * 45 }));
    });
  }
};
/* subtle touch/pointer perspective on hero cards (cinematic & balanced only, no sensors) */
const Tilt = {
  bind(root) {
    $$('[data-tilt]', root).forEach(el => {
      const move = e => { if (Motion.off) return; const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5, k = 6 * Motion.m.camera; el.style.transform = `perspective(900px) rotateX(${(-y * k).toFixed(2)}deg) rotateY(${(x * k).toFixed(2)}deg)`; };
      el.addEventListener('pointermove', move, { passive: true }); el.addEventListener('pointerleave', () => el.style.transform = '');
      el.addEventListener('pointerup', () => el.style.transform = '');
    });
  }
};

          await Store.save('results', rec); PR.annotate(); Achievements.evaluate();

/* ============ 16. DATA EXPORT & IMPORT ============ */
const Backup = {
  pending: null,
  bundle() {
    const strip = (k, v) => (k.startsWith('_') ? undefined : v);
    return JSON.parse(JSON.stringify({ app: APP_ID, schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(), settings: State.settings, profile: State.profile, meta: { onboarded: State.meta.onboarded, introSeen: State.meta.introSeen, finaleSeen: State.meta.finaleSeen }, sessions: State.sessions, results: State.results, bodyweight: State.bodyweight, achievements: State.achievements, program: State.program.source === 'sample' ? undefined : State.program }, strip));
  },
  export() {
    const json = JSON.stringify(this.bundle(), null, 1), name = `cliff-big-blue-backup-${todayISO()}.json`;
    let downloaded = false;
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); downloaded = true; } catch (e) { }
    $('#exportOut').innerHTML = `<p class="muted" style="font-size:13px">${downloaded ? `If a download did not start (some embedded viewers block downloads), copy the backup below and save it as <b>${name}</b>.` : 'Copy the backup below and save it as a .json file.'}</p>
      <textarea class="input" id="exportText" rows="6" readonly style="font-family:var(--f-mono);font-size:11px">${esc(json)}</textarea>
      <div class="row"><button class="btn primary grow" type="button" data-act="copy-export">${icon('copy')} Copy backup</button><span class="label">${(json.length / 1024).toFixed(1)} KB · ${State.sessions.length} sessions</span></div>`;
    UI.icons();
  },
  async copy() {
    const ta = $('#exportText'); if (!ta) return;
    try { await navigator.clipboard.writeText(ta.value); UI.toast('Backup copied.'); } catch (e) { ta.focus(); ta.select(); UI.toast('Text selected — copy it with your keyboard or long-press.'); }
  },
  validProgram(p, errs) {
    if (!p || typeof p !== 'object' || !Array.isArray(p.workouts) || !p.workouts.length) { errs.push('Program: missing workouts.'); return false; }
    const types = ['pct', 'reps', 'timed', 'sprint', 'test'];
    for (const w of p.workouts) {
      if (!w || typeof w.id !== 'string' || !(w.week >= 1) || !(w.day >= 1 && w.day <= 7) || !Array.isArray(w.exercises)) { errs.push(`Program: workout ${w && w.id || '?'} is malformed.`); return false; }
      for (const e of w.exercises) {
        if (!e || !types.includes(e.type) || typeof e.ex !== 'string') { errs.push(`Program: an exercise in ${w.id} is malformed.`); return false; }
        if (!EXERCISES[e.ex] && !(p.customExercises && p.customExercises[e.ex])) { errs.push(`Program: unknown exercise "${e.ex}" (add it to customExercises).`); return false; }
        if (e.type === 'pct' && !(Array.isArray(e.scheme) && e.scheme.every(s => Array.isArray(s) && s[0] >= 1 && s[1] > 0 && s[1] <= 150))) { errs.push(`Program: invalid percentage scheme in ${w.id}.`); return false; }
      }
    }
    return true;
  },
  validate(obj) {
    const errs = [], warn = [];
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { errs: ['The file is not a JSON object.'] };
    const programOnly = !obj.app && obj.program;
    if (!programOnly && obj.app !== APP_ID) return { errs: ['This is not a Cliff: Big Blue Performance backup.'] };
    if (obj.schema && obj.schema > SCHEMA_VERSION) return { errs: [`This backup comes from a newer version (schema ${obj.schema}). Update the app first.`] };
    let b = obj;
    if (!programOnly && obj.schema < SCHEMA_VERSION) { try { b = runMigrations(JSON.parse(JSON.stringify(obj)), obj.schema); warn.push(`Upgraded from schema ${obj.schema}.`); } catch (e) { return { errs: ['Could not upgrade this backup: ' + e.message] }; } }
    const out = { settings: null, profile: null, sessions: [], results: [], bodyweight: [], achievements: [], program: null };
    if (b.program) { if (this.validProgram(b.program, errs)) out.program = Object.assign({ source: 'imported', weeks: Math.max(...b.program.workouts.map(w => w.week)), dayOffsets: [0, 1, 3, 4], cycles: State.program.cycles, name: 'Imported program', version: 1 }, b.program); }
    if (!programOnly) {
      if (b.settings && typeof b.settings === 'object') out.settings = Object.assign({}, DEFAULT_SETTINGS, b.settings);
      if (b.profile && typeof b.profile === 'object' && b.profile.baselines) out.profile = b.profile;
      const okW = o => o && isFinite(o.kg) && o.kg >= 0 && o.kg < 1000;
      const check = (name, fn) => { const arr = Array.isArray(b[name]) ? b[name] : []; if (b[name] && !Array.isArray(b[name])) errs.push(`${name} is not a list.`); let bad = 0; arr.forEach(r => { if (r && typeof r.id === 'string' && fn(r)) out[name].push(r); else bad++; }); if (bad) warn.push(`${bad} invalid ${name} record${bad > 1 ? 's' : ''} will be skipped.`); };
      check('sessions', s => ['completed', 'in_progress', 'skipped', 'abandoned'].includes(s.status) && typeof s.tid === 'string' && Array.isArray(s.ex) && s.ex.every(x => Array.isArray(x.sets) && x.sets.every(t => (!t.w || okW(t.w)) && (t.reps == null || isFinite(t.reps)))));
      check('results', r => METRICS[r.metric] && r.o && isFinite(Units.canon(r.metric, r.o)) && Units.canon(r.metric, r.o) > 0 && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && ['tested', 'recorded'].includes(r.cls));

function bindEvents() {
  document.addEventListener('click', e => {
    const tab = e.target.closest('#nav [data-tab]'); if (tab) { Nav.go(tab.dataset.tab, null); Haptics.tap(); return; }
    if (e.target.closest('[data-sheet-close]')) { Sheet.close(); return; }
    const ob = e.target.closest('[data-ob]'); if (ob && ob.tagName === 'BUTTON') { Locker.click(ob); return; }
    const pt = e.target.closest('svg.chart .pt'); if (pt) { const tip = pt.closest('svg').nextElementSibling; if (tip) tip.textContent = pt.dataset.tip; $$('.pt .dot, .pt .bar', pt.closest('svg')).forEach(d => d.style.opacity = .55); const d = $('.dot, .bar', pt); if (d) { d.style.opacity = 1; Motion.press(d); } return; }
    const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
    const fn = Actions[a.dataset.act]; if (fn) { if (a.classList.contains('btn')) Motion.press(a); fn(a, e); }
  });
  // keyboard activation for non-button interactive elements (SVG markers, chart points, table rows)
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#sheet-root').hidden) return Sheet.close(); if (!$('#celebrate').hidden) return Celebrate.close(); if (!$('#finale').hidden) return Finale.close(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]:not(button), tr[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
    if (e.key === 'Enter' && e.target.matches('.set input')) { e.target.blur(); }
  });
  const uiDeb = debounce(el => { UI.ui[el.dataset.ui] = el.value; refocusRender(el); }, 220);
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.ob) { Locker.input(t); return; }
    if (t.dataset.f) { const s = Workout.active(); if (!s) return; const err = SetLog.setField(s, +t.dataset.e, +t.dataset.s, t.dataset.f, t.value); t.classList.toggle('err', !!err); return; }

  const fromSchema = storedMeta ? (storedMeta.schema || 1) : SCHEMA_VERSION;
  if (fromSchema > SCHEMA_VERSION) { App.migrationError(new Error(`saved by a newer version (schema ${fromSchema})`), { meta: storedMeta, profile: storedProfile, settings: State.settings }); return; }

  // crash recovery: the synchronous mirror may be newer than the async store
  const mirror = LSX.get(LS.active, null);
  if (mirror && mirror.status === 'in_progress') {
    const i = State.sessions.findIndex(s => s.id === mirror.id);
    if (i < 0 || (mirror.rev || 0) > (State.sessions[i].rev || 0)) { if (i < 0) State.sessions.push(mirror); else State.sessions[i] = mirror; DB.put('sessions', mirror); }

  if (!State.meta.activeSessionId) { const ip = State.sessions.filter(s => s.status === 'in_progress').sort((a, b) => b.startedAt - a.startedAt)[0]; if (ip) State.meta.activeSessionId = ip.id; }

  }

    const c = await Sheet.choose({ title: 'Resume your workout?', body: `<p><b>${esc(act.title)}</b> (Week ${act.week} · Day ${act.day}) was not finished. ${Stats.sessionStats(act).sets} sets are saved.</p>`, options: [{ id: 'resume', label: 'Resume mission', cls: 'red' }, { id: 'later', label: 'Keep it for later' }, { id: 'discard', label: 'Discard it', cls: 'danger' }] });

  },
  ticker(offset = 0) {

  },
  start(root) {

    this.reveal(el); this.paused = false;

    $$('.w', el).forEach((w, i) => {
      const hot = !!w.querySelector('em');
      Motion.anim(w, [{ opacity: 0, transform: 'translateY(.6em) rotateX(-70deg)', filter: 'blur(4px)' }, { opacity: 1, transform: 'none', filter: 'none' }], { duration: 520, delay: 80 + i * 70 + (hot ? 160 : 0), easing: 'cubic-bezier(.2,1.3,.4,1)' });
    });
  },
  /* short full-screen pre-mission quote; tap anywhere to skip; never blocks logging */
  flash(s) {
    if (Motion.off) return;
    const q = MOTIVATION[(s.week * 4 + s.day + this.today()) % MOTIVATION.length];
    const el = document.createElement('div'); el.id = 'qflash'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Mission start');
    el.innerHTML = `<div class="qbeam" aria-hidden="true"></div><div class="qk">MISSION START · WEEK ${s.week} · DAY ${s.day}</div><p class="qtext">${this.words(q)}</p><div class="qline"><i></i></div><div class="qtap">TAP TO START LOGGING</div>`;
    document.body.appendChild(el);
    const dur = Motion.modeName() === 'cinematic' ? 2600 : 1600;
    this.reveal($('.qtext', el));
    Motion.anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
    Motion.anim($('.qline i', el), [{ width: '0%' }, { width: '100%' }], { duration: dur, easing: 'linear', fill: 'forwards' });
    let gone = false;
    const close = () => { if (gone) return; gone = true; Motion.anim(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(1.06)' }], { duration: 260, fill: 'forwards' }).then(() => el.remove()); };
    el.addEventListener('click', close); setTimeout(close, dur);
    Haptics.beep([392, 523], .12);
  },
  forRest() { return this.plain(MOTIVATION[Math.floor(Date.now() / 20000) % MOTIVATION.length]); }
};

/* season progress block: big %, field bar with ball, 11 week bars, this week's sessions, next milestone */
const Season = {
  html(st, opts = {}) {
    const pct = st.programPct, P = State.program, wk = st.programWeek, done = st.doneUnique, total = st.total;
    const fillPct = pct * 100;
    const yards = ['G', '10', '20', '30', '40', '50', '40', '30', '20', '10', 'G'];
    const bars = st.weekly.map((w, i) => { const f = w.scheduled ? w.done / w.scheduled : 0, cls = (f >= 1 ? 'done ' : '') + (i + 1 === wk && !st.preSeason ? 'cur' : ''); return `<button class="wb ${cls}" type="button" data-act="go-week" data-w="${i + 1}" style="--f:${f.toFixed(3)};--i:${i}" aria-label="Week ${i + 1}: ${w.done} of ${w.scheduled} workouts"><span class="col"><i></i></span><span>W${i + 1}</span></button>`; }).join('');
    const ws = Program.week(wk), stIcon = { completed: 'check', in_progress: 'play', missed: 'x', skipped: 'skip-forward', due: 'flag', upcoming: 'circle' };
    const pills = ws.map(w => { const s = st.status[w.id]; return `<button class="wp ${s}" type="button" data-act="preview" data-id="${w.id}" aria-label="Day ${w.day}, ${esc(w.title)}, ${ST_LABEL[s]}"><span class="ic">${s === 'upcoming' ? '' : icon(stIcon[s] || 'circle')}</span><b>D${w.day}</b><small>${esc(w.title)}</small></button>`; }).join('');
    const weekDone = ws.filter(w => st.status[w.id] === 'completed').length;
    const ms = [[.25, 'First Quarter'], [.5, 'Halftime'], [.75, 'Fourth Quarter'], [1, 'Full Season']].find(([t]) => pct < t);
    const msText = ms ? `<b>${Math.max(1, Math.ceil(ms[0] * total) - done)}</b> more workout${Math.ceil(ms[0] * total) - done === 1 ? '' : 's'} to <b>${ms[1]}</b> (${ms[0] * 100}%)` : '<b>Every scheduled workout is complete.</b>';
    return `<section class="panel season" data-stg aria-label="Season progress">
      <div class="spread"><span class="label">Season progress</span><span class="badge blue">${st.preSeason ? 'Pre-season' : `Week ${wk} of ${P.weeks}`}</span></div>
      <div class="season-top"><div class="season-pct"><span data-count="${Math.round(fillPct)}" data-key="${opts.key || 'season'}">${Math.round(fillPct)}</span><small>%</small></div>
        <div><b>${done} of ${total} workouts</b><span class="muted" style="font-size:13.5px">${weekDone} of ${ws.length} done this week · ${st.weeksComplete} week${st.weeksComplete === 1 ? '' : 's'} complete</span></div></div>
      <div class="sfield" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(fillPct)}" aria-label="Program completion">
        <span class="ez" style="left:0">START</span><span class="ez" style="right:0">GAME DAY</span>
        <div class="lines"></div><div class="sfill" data-w="${fillPct.toFixed(2)}"></div>
        <div class="nums" aria-hidden="true">${yards.map(y => `<span>${y}</span>`).join('')}</div>
        <span class="bubble" data-l="${(7 + fillPct * .86).toFixed(2)}" style="left:7%">${Math.round(fillPct)}%</span>
        <svg class="ball" data-l="${(7 + fillPct * .86).toFixed(2)}" style="left:7%" viewBox="0 0 34 22" aria-hidden="true"><ellipse cx="17" cy="11" rx="15" ry="9" fill="#A71930" stroke="#FFFFFF" stroke-width="1.6"/><path d="M9 11h16M13 8.5v5M16 8.5v5M19 8.5v5M22 8.5v5" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round"/></svg>
      </div>
      <div><div class="label" style="margin-bottom:6px">Week by week</div><div class="weekbars">${bars}</div></div>
      ${opts.compact ? '' : `<div><div class="label" style="margin-bottom:6px">This week</div><div class="weekpills">${pills}</div></div>`}
      <div class="milestone">${icon('trophy')}<span>${msText}</span></div>
    </section>`;
  },
  /* animate the field fill and the ball from the goal line to today's position */
  run(root) {
    $$('.sfield', root).forEach(f => {
      const fill = $('.sfill', f), ball = $('.ball', f), bub = $('.bubble', f);
      const go = () => { fill.style.width = (fill.dataset.w * .86) + '%'; ball.style.left = ball.dataset.l + '%'; bub.style.left = bub.dataset.l + '%'; };
      if (Motion.off) { fill.style.transition = ball.style.transition = bub.style.transition = 'none'; go(); } else requestAnimationFrame(() => setTimeout(go, 250));
    });
  }
};

/* scroll reveals for anything that starts below the fold (already visible content is never hidden) */
const Reveal = {
  io: null,
  observe(root) {
    if (this.io) this.io.disconnect();
    if (Motion.off || !('IntersectionObserver' in window)) return;
    this.io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return; this.io.unobserve(e.target);
      const m = Motion.m; Motion.anim(e.target, [{ opacity: 0, transform: `translateY(${28 * m.camera + 10}px) scale(.97) rotateX(${6 * m.camera}deg)` }, { opacity: 1, transform: 'none' }], { duration: m.std + 220, easing: EASE.out });
    }), { threshold: .12 });
    const vh = innerHeight;
    $$('.panel, .metric, .wk-item, .lib-item, .quote-hero, .ticker, .season, .journey', root).forEach(el => { if (el.getBoundingClientRect().top > vh * .92) this.io.observe(el); });
  }
};

</script>
