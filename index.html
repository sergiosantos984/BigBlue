  async remove(store, id) { State[store] = State[store].filter(x => x.id !== id); State.version++; return DB.del(store, id); },
  saveSettings() { LSX.set(LS.settings, State.settings); State.version++; },
  saveProfile() { if (State.profile) State.profile.updatedAt = Date.now(); LSX.set(LS.profile, State.profile); State.version++; },
  saveMeta() { LSX.set(LS.meta, State.meta); }
};

/* schema migrations: each step takes the raw stored bundle and returns the next version */
const MIGRATIONS = {
  // v1 → v2: baseline values moved from plain numbers to {w:{kg,v,u}} weight objects; athletic baselines added.
  1(b) {
    const p = b.profile;
    if (p && p.baselines) for (const k in p.baselines) { const x = p.baselines[k]; if (x && typeof x.value === 'number') { p.baselines[k] = { w: Units.wt(x.value, x.unit || 'lb'), cls: x.cls || 'recorded', date: x.date || null, notes: x.notes || '' }; } }
    if (p && !p.athletic) p.athletic = {};
    return b;
  }
};
function runMigrations(bundle, from) {
  let v = from;
  while (v < SCHEMA_VERSION) { if (!MIGRATIONS[v]) throw new Error(`No migration from schema ${v}`); bundle = MIGRATIONS[v](bundle); v++; }
  return bundle;
}

/* ============ 7. WEIGHT CONVERSION ============
   Internal canonical units: kg (weight), cm (height), seconds (time).
   Every entered weight is stored as {kg, v, u} — the canonical value plus exactly what
   was typed — so showing it back in the same unit never drifts through repeated conversion. */
const Units = {
  toKg: (v, u) => u === 'kg' ? v : v / LB_PER_KG,
  fromKg: (kg, u) => u === 'kg' ? kg : kg * LB_PER_KG,
  wt(v, u) { v = +v; return { kg: Units.toKg(v, u), v, u }; },
  showW(o, u = State.settings.unit) { if (!o) return null; return o.u === u ? o.v : Units.fromKg(o.kg, u); },
  fmtW(o, u = State.settings.unit, d = 1) { const v = Units.showW(o, u); return v == null ? '—' : fmtNum(v, d); },
  hUnit: () => State.settings.unit === 'kg' ? 'cm' : 'in',
  ht(v, u) { v = +v; return { cm: u === 'cm' ? v : v * CM_PER_IN, v, u }; },
  showH(o, u = Units.hUnit()) { if (!o) return null; return o.u === u ? o.v : (u === 'cm' ? o.cm : o.cm / CM_PER_IN); },
  /* canonical numeric value of a metric result */
  canon(metric, o) { const k = METRICS[metric].kind; return k === 'weight' ? o.kg : k === 'height' ? o.cm : o.sec; },
  showMetric(metric, o, withUnit = true) {
    if (!o) return '—'; const k = METRICS[metric].kind;
    if (k === 'weight') return fmtNum(Units.showW(o), 1) + (withUnit ? ' ' + State.settings.unit : '');
    if (k === 'height') return fmtNum(Units.showH(o), 1) + (withUnit ? ' ' + Units.hUnit() : '');
    return fmtNum(o.sec, 2) + (withUnit ? ' s' : '');
  },
  metricUnit(metric) { const k = METRICS[metric].kind; return k === 'weight' ? State.settings.unit : k === 'height' ? Units.hUnit() : 's'; },
  makeMetric(metric, v) { const k = METRICS[metric].kind; return k === 'weight' ? Units.wt(v, State.settings.unit) : k === 'height' ? Units.ht(v, Units.hUnit()) : { sec: +v }; },
  /* metric value expressed in a given display unit, for change maths */
  metricIn(metric, o) { const k = METRICS[metric].kind; return k === 'weight' ? Units.showW(o) : k === 'height' ? Units.showH(o) : o.sec; },
  inc() { return State.settings.unit === 'kg' ? State.settings.incKg : State.settings.incLb; }
};

/* ============ 8. PERCENTAGE CALCULATIONS ============
   Target = reference max × prescribed %. The raw value is always kept and shown.
   Rounding (to the plate increment in the display unit):
   - 'down' (default): never rounds a load above the prescription.
   - 'nearest': may round up; when it does, the target is flagged "rounded up". */
const Calc = {
  refFor(lift) { const b = State.profile && State.profile.baselines && State.profile.baselines[lift]; return b && b.w ? b : null; },
  target(ref, pct, unit = State.settings.unit, inc = Units.inc(), mode = State.settings.rounding) {
    if (!ref || !ref.w || !(pct > 0)) return null;
    const refU = Units.showW(ref.w, unit), raw = refU * pct / 100;
    const q = raw / inc, steps = mode === 'nearest' ? Math.round(q) : Math.floor(q + 1e-9);
    const rounded = Math.round(steps * inc * 1000) / 1000;
    return { raw, rounded, unit, pct, kg: Units.toKg(rounded, unit), roundedUp: rounded > raw + 1e-9, over100: pct > 100, refV: refU, refCls: ref.cls };
  },
  clsLabel: c => ({ tested: 'TESTED 1RM', recorded: 'RECORDED MAX', training: 'TRAINING MAX', estimated: 'ESTIMATED' }[c] || 'MAX'),
  /* Epley estimate from a submaximal set; reported only as an estimate */
  epley: (kg, reps) => reps >= 1 && reps <= 10 ? (reps === 1 ? kg : kg * (1 + reps / 30)) : null
};

/* ============ 9. WORKOUT EXECUTION ============ */
const Workout = {
  busy: false,
  active() { const id = State.meta.activeSessionId; return id ? State.sessions.find(s => s.id === id && s.status === 'in_progress') || null : null; },
  elapsed(s) { if (!s || !s.startedAt) return 0; const end = s.endedAt || s.pausedAt || Date.now(); return Math.max(0, end - s.startedAt - (s.pausedMs || 0)); },
  prescText(e) {
    if (e.type === 'pct') {
      const g = []; e.scheme.forEach(([r, p, lab]) => { const k = `${lab || r}@${p}`, last = g[g.length - 1]; if (last && last.k === k) last.n++; else g.push({ k, r: lab || r, p, n: 1 }); });
      const pre = (e.extras || []).filter(x => x.pos === 'before').map(x => x.warm ? `warm-up ${x.r}` : `${x.r} ${x.label === 'build' ? 'build' : x.label}`);
      const post = (e.extras || []).filter(x => x.pos === 'after').map(x => x.label === 'build' ? `${x.r} build` : `then ${x.label}`);
      return [...pre, ...g.map(x => `${x.n > 1 ? x.n + '×' : ''}${x.r} @ ${x.p}%`), ...post].join(', ');
    }
    if (e.type === 'reps') return `${e.sets} × ${e.repsList ? e.repsList.join(', ') : (e.label || e.reps)}${e.unitLabel ? ' ' + e.unitLabel + 's' : ''}`;
    if (e.type === 'timed') return e.sec >= 90 && e.sets === 1 ? `${fmtDur(e.sec * 1000)} min` : `${e.sets} × ${e.sec}s`;
    if (e.type === 'sprint') return `${e.sets} × ${e.dist}${e.target ? ` · ${fmtDur(e.target * 1000)} target` : ''}`;
    if (e.type === 'test') return `Up to ${e.sets} attempts`;
    if (e.type === 'check') return Program.exDef(e.ex).steps ? `${e.sets} exercises × 10 reps · with a partner` : e.sets > 1 ? `${e.sets} sets` : 'Complete';
    return '';
  },
  nSets(e) { return e.type === 'pct' ? e.scheme.length + (e.extras || []).filter(x => !x.warm).length : e.sets || 1; },
  setCount(w) { return w.exercises.reduce((n, e) => n + this.nSets(e), 0); },
  estMinutes(w) { let s = 0; w.exercises.forEach(e => { const n = this.nSets(e) + (e.type === 'pct' && (e.extras || []).some(x => x.warm) ? 1 : 0), work = e.type === 'timed' ? e.sec : e.type === 'sprint' ? (e.target || 30) : e.type === 'test' ? 60 : e.type === 'check' ? 150 : 40; s += n * (work + Math.min(e.rest || 60, 240)); }); return Math.max(10, Math.round(s / 60 / 5) * 5); },
  build(w) {
    const s = { id: uid('ses'), tid: w.id, week: w.week, day: w.day, cycle: w.cycle, title: w.title, category: w.category, date: todayISO(), startedAt: Date.now(), endedAt: null, pausedAt: null, pausedMs: 0, status: 'in_progress', cur: 0, notes: '', ex: [], createdAt: Date.now() };
    w.exercises.forEach(e => {
      const x = this.buildEx(e);
      if (e.alts && e.alts.length) x.alts = e.alts.map((a, i) => this.buildEx(Object.assign({ uid: `${e.uid}a${i + 1}` }, a)));
      s.ex.push(x);
    });
    return s;
  },
  /* one exercise → its logging model (sets with prescriptions) */
  buildEx(e) {
    const def = Program.exDef(e.ex), x = { uid: e.uid, exId: e.ex, name: e.title || def.name, cat: def.cat, type: e.type, rest: e.rest || 0, lift: def.lift || null, metric: e.metric || def.metric || null, dist: e.yards || null, distLabel: e.dist || null, target: e.target || null, testRun: !!e.testRun, key: !!e.key, unitLabel: e.unitLabel || null, presc: this.prescText(e), pNote: e.note || '', optional: !!e.optional, notes: '', skipped: false, pair: null, sets: [] };
    // non-percentage strength work can carry an optional weight so the next session can show it
    x.weighted = e.type === 'reps' && def.cat === 'strength';
    if (e.type === 'pct') {
      const ref = Calc.refFor(def.lift);
      x.ref = ref ? { w: ref.w, cls: ref.cls } : null;     // frozen reference: later baseline edits never rewrite this session
      const mk = (o) => Object.assign({ id: uid('set'), n: 0, warm: false, pReps: null, pPct: null, pT: null, w: null, reps: null, done: false, rpe: null, ts: null }, o);
      const bar = State.settings.unit === 'kg' ? 20 : 45;   // warm-ups start from the empty bar; edit as needed
      (e.extras || []).filter(z => z.pos === 'before').forEach(z => x.sets.push(mk({ warm: !!z.warm, pReps: z.r, reps: z.r, w: z.warm ? Units.wt(bar, State.settings.unit) : null, pLabel: z.warm ? 'Warm-up' : z.label })));
      e.scheme.forEach(([reps, pct, lab]) => {
        const t = Calc.target(ref, pct);
        x.sets.push(mk({ pReps: reps, pPct: pct, pLabel: lab, pT: t ? { v: t.rounded, u: t.unit, kg: t.kg, raw: t.raw, roundedUp: t.roundedUp } : null, w: t ? Units.wt(t.rounded, t.unit) : null, reps }));
      });
      (e.extras || []).filter(z => z.pos === 'after').forEach(z => x.sets.push(mk({ pReps: z.r, reps: z.r, pLabel: z.label })));
      SetLog.renumber(x);
    } else {
      const n = e.sets || 1;
      for (let i = 0; i < n; i++) {
        const st = { id: uid('set'), n: i + 1, warm: false, done: false, ts: null };
        if (e.type === 'check' && def.steps && def.steps[i]) st.pLabel = def.steps[i];
        if (e.type === 'reps') { const r = e.repsList ? e.repsList[i] ?? e.reps : e.reps; Object.assign(st, { pReps: r, reps: r, pLabel: e.label || null, w: null }); }
        if (e.type === 'timed') Object.assign(st, { pSec: e.sec, sec: e.sec });
        if (e.type === 'sprint') Object.assign(st, { dist: e.yards || 0, sec: null });
        if (e.type === 'test') Object.assign(st, { val: null });
        x.sets.push(st);
      }
    }
    return x;
  },
  /* the most recent completed session's sets for an exercise, matched set-by-set for "last time" hints */
  lastSets(exId, excludeSid) {
    const prev = State.sessions.filter(s => s.status === 'completed' && s.id !== excludeSid && (s.ex || []).some(x => x.exId === exId && x.sets.some(t => t.done))).sort((a, b) => (b.endedAt || 0) - (a.endedAt || 0))[0];
    if (!prev) return null;
    const x = prev.ex.find(x => x.exId === exId);
    return { date: prev.date, week: prev.week, work: x.sets.filter(t => t.done && !t.warm) };
  },
  async start(tid) {
    if (this.busy) return; this.busy = true;
    try {
      const act = this.active();
      if (act) {
        if (act.tid === tid) { Nav.go('workout'); return; }
        const c = await Sheet.choose({ title: 'Unfinished mission', body: `<p>You have <b>${esc(act.title)}</b> (${wkLabel(act.week)} · Day ${act.day}) in progress. Finish or resume it before starting another.</p>`, options: [{ id: 'resume', label: 'Resume it', cls: 'primary' }, { id: 'abandon', label: 'Abandon it and start this one', cls: 'danger' }] });
        if (c === 'resume') { Nav.go('workout'); return; }
        if (c !== 'abandon') return;
        await this.abandon(act, true);
      }
      const w = Program.byId(tid); if (!w) return;
      if (Stats.statusOf(tid) === 'completed') {
        const ok = await Sheet.confirm({ title: 'Log this workout again?', body: '<p>This workout is already completed. A second log is kept as its own session; the first one stays on the record.</p>', ok: 'Log again' });
        if (!ok) return;
      }
      const s = this.build(w);
      await this.persist(s, true);
      State.meta.activeSessionId = s.id; Store.saveMeta();
      WakeLock.on();
      Nav.go('workout', null, { big: true });
      Quotes.flash(s);
    } finally { this.busy = false; }
  },
  async persist(s, now = false) {
    s.rev = (s.rev || 0) + 1;
    if (s.status === 'in_progress') LSX.set(LS.active, s); // synchronous mirror survives an abrupt tab close
    if (now) return Store.save('sessions', s);
    State.version++; this._deb = this._deb || debounce(x => Store.save('sessions', x), 350); this._deb(s);
  },
  flush() { if (this._deb) { const s = this.active(); if (s) this._deb.flush(s); } },
  async pause(s) { if (s.pausedAt) { s.pausedMs += Date.now() - s.pausedAt; s.pausedAt = null; } else s.pausedAt = Date.now(); await this.persist(s, true); UI.render(); },
  async saveExit(s) { await this.persist(s, true); UI.toast('Saved. Resume any time from Home.'); Nav.go('home'); },
  async abandon(s, silent) {
    if (!silent) { const ok = await Sheet.confirm({ title: 'Discard this workout?', body: '<p>The session is kept in history as <b>Abandoned</b> and will not count as completed. Logged sets stay visible in its report.</p>', ok: 'Discard workout', danger: true }); if (!ok) return; }
    if (s.pausedAt) { s.pausedMs += Date.now() - s.pausedAt; s.pausedAt = null; }
    s.status = 'abandoned'; s.endedAt = Date.now();
    await Store.save('sessions', s); State.meta.activeSessionId = null; Store.saveMeta(); LSX.del(LS.active); Rest.stop(); WakeLock.off();
    if (!silent) { UI.toast('Workout discarded.'); Nav.go('home'); }
  },
  async finish(s) {
    const open = s.ex.filter(x => !x.skipped).reduce((n, x) => n + x.sets.filter(t => !t.done && !t.warm).length, 0);
    if (open) {
      const ok = await Sheet.confirm({ title: 'Finish the workout?', body: `<p>${open} prescribed set${open > 1 ? 's are' : ' is'} not logged. ${open > 1 ? 'They' : 'It'} will be recorded as not completed.</p>`, ok: 'Finish workout' });
      if (!ok) return;
    }
    if (s.pausedAt) { s.pausedMs += Date.now() - s.pausedAt; s.pausedAt = null; }
    s.status = 'completed'; s.endedAt = Date.now();
    // 16 × 110 test: keep the best timed rep as a recorded 110-yard result, and the pass/fail outcome on the session
    s.ex.filter(x => x.testRun).forEach(x => { const ts = x.sets.filter(t => t.done && t.sec > 0); x.passed = x.target && ts.length === x.sets.length ? ts.every(t => t.sec <= x.target) : null; });
    await Store.save('sessions', s);            // saved before any celebration
    for (const x of s.ex.filter(x => x.testRun && x.metric)) { const ts = x.sets.filter(t => t.done && t.sec > 0); if (ts.length) await Store.save('results', { id: `${s.id}:${x.metric}`, metric: x.metric, sid: s.id, week: s.week, cls: 'recorded', src: 'session', createdAt: Date.now(), notes: 'Best rep of the 16 × 110 test', o: { sec: Math.min(...ts.map(t => t.sec)) }, date: s.date }); }
    State.meta.activeSessionId = null; Store.saveMeta(); LSX.del(LS.active); Rest.stop(); WakeLock.off();
    const fresh = Achievements.evaluate();
    Celebrate.workout(s, fresh);
  },
  async skipWorkout(tid) {
    const w = Program.byId(tid);
    const ok = await Sheet.confirm({ title: `Skip ${w.title}?`, body: '<p>Skipped workouts are recorded honestly, break the streak and do not count toward completion. You can undo this.</p>', ok: 'Skip workout' });
    if (!ok) return;
    await Store.save('sessions', { id: uid('ses'), tid, week: w.week, day: w.day, cycle: w.cycle, title: w.title, category: w.category, date: todayISO(), status: 'skipped', ex: [], startedAt: null, endedAt: null, createdAt: Date.now() });
    Achievements.evaluate(); UI.render();
  },
  async unskip(tid) { const s = State.sessions.filter(x => x.tid === tid && x.status === 'skipped'); for (const x of s) await Store.remove('sessions', x.id); UI.render(); },
  lastPerf(exId, excludeSid) {
    const prev = State.sessions.filter(s => s.status === 'completed' && s.id !== excludeSid && s.ex.some(x => x.exId === exId && x.sets.some(t => t.done))).sort((a, b) => b.endedAt - a.endedAt)[0];
    if (!prev) return null;
    const x = prev.ex.find(x => x.exId === exId), done = x.sets.filter(t => t.done && !t.warm);
    return { date: prev.date, sets: done, type: x.type, metric: x.metric };
  },
  perfText(p) {
    if (!p || !p.sets.length) return null;
    const t = p.sets;
    if (p.type === 'pct') { const top = t.reduce((a, b) => (b.w && (!a.w || b.w.kg > a.w.kg)) ? b : a, t[0]); return `${t.length} sets · top ${Units.fmtW(top.w)} ${State.settings.unit} × ${top.reps}`; }
    if (p.type === 'reps') { const ws = t.filter(x => x.w); if (ws.length) { const top = ws.reduce((a, b) => b.w.kg > a.w.kg ? b : a); return `${t.length} sets · top ${Units.fmtW(top.w)} ${State.settings.unit} × ${top.reps}`; } return `${t.length} sets · ${t.reduce((a, b) => a + (b.reps || 0), 0)} total reps`; }
    if (p.type === 'timed') return `${t.length} × ${fmtNum(t[0].sec, 0)}s`;
    if (p.type === 'sprint') { const tm = t.filter(x => x.sec); return `${t.length} reps${tm.length ? ' · best ' + fmtNum(Math.min(...tm.map(x => x.sec)), 2) + 's' : ''}`; }
    if (p.type === 'test') { const v = t.filter(x => x.val); return v.length ? `${v.length} attempts` : null; }
    if (p.type === 'check') return `${t.length} done`;
    return null;
  }
};

/* ============ 10. SET LOGGING ============ */
const SetLog = {
  validate(x, t) {
    if (x.type === 'pct') { if (!(t.w && t.w.v > 0)) return 'Enter the weight you lifted.'; if (!(Number.isInteger(t.reps) && t.reps >= 1 && t.reps <= 100)) return 'Reps must be a whole number of at least 1.'; }
    if (x.type === 'reps' && !(Number.isInteger(t.reps) && t.reps >= 0 && t.reps <= 1000)) return 'Reps must be a whole number.';
    if (x.type === 'reps' && t.w && !(t.w.v > 0 && t.w.v < 2000)) return 'Weight must be a positive number.';
    if (x.type === 'timed' && !(t.sec > 0 && t.sec < 36000)) return 'Enter the time in seconds.';
    if (x.type === 'sprint' && t.sec != null && !(t.sec > 0 && t.sec < 600)) return 'Sprint time must be a positive number of seconds.';
    if (x.type === 'test' && !(t.val && Units.canon(x.metric, t.val) > 0)) return 'Enter the result you achieved.';
    if (t.rpe != null && !(t.rpe >= 1 && t.rpe <= 10)) return 'RPE must be between 1 and 10.';
    return null;
  },
  /* write a single field from an input into the session model */
  setField(s, ei, si, f, raw) {
    const x = s.ex[ei], t = x && x.sets[si]; if (!t) return;
    const v = String(raw).trim() === '' ? null : Number(String(raw).replace(',', '.'));
    if (v != null && !isFinite(v)) return 'Numbers only.';
    if (f === 'w') t.w = v == null || (x.type === 'reps' && v === 0) ? null : Units.wt(v, State.settings.unit);
    else if (f === 'reps') t.reps = v == null ? null : v;
    else if (f === 'sec') t.sec = v;
    else if (f === 'rpe') t.rpe = v;
    else if (f === 'val') t.val = v == null ? null : Units.makeMetric(x.metric, v);
    if (t.done) { const err = this.validate(x, t); if (err) return err; t.editedAt = Date.now(); }
    Workout.persist(s);
    if (t.done && x.type === 'test') PR.recordFromSession(s, x);
    return null;
  },
  async toggle(s, ei, si, btn) {
    const x = s.ex[ei], t = x.sets[si];
    if (t.done) { t.done = false; t.ts = null; await Workout.persist(s, true); if (x.type === 'test') await PR.recordFromSession(s, x); UI.renderLogger(); return; }
    const err = this.validate(x, t);
    if (err) { UI.toast(err, 'bad'); const row = $(`[data-set="${ei}-${si}"]`); if (row) Motion.anim(row, [{ transform: 'translateX(0)' }, { transform: 'translateX(-8px)' }, { transform: 'translateX(8px)' }, { transform: 'none' }], { duration: 260 }); return; }
    t.done = true; t.ts = Date.now();
    if (x.weighted && t.w) { const nx = x.sets.find((q, k) => k > si && !q.done && !q.warm && !q.w); if (nx) nx.w = Object.assign({}, t.w); }   // carry the weight to the next set
    await Workout.persist(s, true);         // immediate persistence
    let pr = null;
    if (x.type === 'test') pr = await PR.recordFromSession(s, x);
    UI.renderLogger({ pulse: `${ei}-${si}` });
    // superset: alternate A → B → rest → A … ; rest only once both have done this round
    const partner = x.pair != null ? s.ex[x.pair] : null;
    const left = z => z && !z.skipped && z.sets.some(q => !q.done && !q.warm);
    if (!t.warm && partner && left(partner)) {
      const doneX = x.sets.filter(q => q.done && !q.warm).length, doneP = partner.sets.filter(q => q.done && !q.warm).length;
      if (doneP >= doneX && x.rest && !pr) Rest.offer(Math.max(x.rest, partner.rest || 0));
      if (pr) Celebrate.pr(pr);
      const to = x.pair;
      setTimeout(() => { const a = Workout.active(); if (a && a.cur === ei) { a.cur = to; Workout.persist(a); UI.renderLogger({ dir: to > ei ? 1 : -1 }); } }, Motion.off ? 0 : 550);
      return;
    }
    if (!t.warm && x.rest && !pr) Rest.offer(x.rest);
    if (pr) Celebrate.pr(pr);
    // all prescribed sets finished → bring the next exercise into focus (never blocks logging)
    if (x.sets.every(z => z.done || z.warm) && ei === s.cur) {
      const nxt = partner && left(partner) ? x.pair : s.ex.findIndex((z, i) => i > ei && !z.skipped && z.sets.some(q => !q.done));
      if (nxt > -1) setTimeout(() => { const a = Workout.active(); if (a && a.cur === ei) { a.cur = nxt; Workout.persist(a); UI.renderLogger({ dir: 1 }); } }, Motion.off ? 0 : 750);
    }
  },
  addSet(s, ei, warm) {
    const x = s.ex[ei], base = x.sets.find(t => !t.warm) || {};
    const t = { id: uid('set'), n: 0, warm, extra: true, done: false, ts: null };
    if (x.type === 'pct') Object.assign(t, { pReps: warm ? null : base.pReps, pPct: warm ? null : base.pPct, pLabel: warm ? 'Warm-up' : 'Extra', pT: null, w: warm && base.w ? Units.wt(Math.max(0, Math.round(Units.showW(base.w) * .5 / Units.inc()) * Units.inc()), State.settings.unit) : base.w ? Object.assign({}, base.w) : null, reps: warm ? 5 : base.reps, rpe: null });
    if (x.type === 'reps') Object.assign(t, { pReps: base.pReps, pLabel: base.pLabel || null, reps: base.reps, w: base.w ? Object.assign({}, base.w) : null });
    if (x.type === 'timed') Object.assign(t, { pSec: base.pSec, sec: base.sec });
    if (x.type === 'sprint') Object.assign(t, { dist: x.dist || 0, sec: null });
    if (x.type === 'test') Object.assign(t, { val: null });

  },
  async removeSet(s, ei, si) { const x = s.ex[ei]; x.sets.splice(si, 1); this.renumber(x); await Workout.persist(s, true); if (x.type === 'test') await PR.recordFromSession(s, x); UI.renderLogger(); },
  renumber(x) { let n = 0; x.sets.forEach(t => { if (!t.warm) t.n = ++n; }); }

/* ============ 11. PERSONAL RECORD TRACKING ============
   Results have a classification: 'tested' (a real max attempt), 'recorded' (a logged best).
   A result is a PR only when it is TESTED and strictly beats every earlier result and the
   baseline (if the baseline was a tested or recorded max). Estimated maxima are never PRs. */
const PR = {
  better: (metric, a, b) => METRICS[metric].better === 'higher' ? a > b : a < b,
  baseline(metric) {
    const p = State.profile; if (!p) return null; const m = METRICS[metric];
    if (m.lift) { const b = p.baselines && p.baselines[m.lift]; return b && b.w ? { o: b.w, value: b.w.kg, cls: b.cls, date: b.date || p.startDate } : null; }
    const a = p.athletic && p.athletic[metric]; return a && a.o ? { o: a.o, value: Units.canon(metric, a.o), cls: a.cls || 'recorded', date: a.date || p.startDate } : null;
  },
  /* annotate results chronologically: r._pr, r._prev (previous best value object) */
  annotate() {
    const out = {};
    Object.keys(METRICS).forEach(metric => {
      const b = this.baseline(metric), comparable = b && (b.cls === 'tested' || b.cls === 'recorded');
      let best = comparable ? { value: b.value, o: b.o, src: 'baseline' } : null;
      const rs = State.results.filter(r => r.metric === metric).sort((a, c) => (a.date || '').localeCompare(c.date || '') || (a.createdAt - c.createdAt));
      rs.forEach(r => {
        const v = Units.canon(metric, r.o); r._prev = best; r._pr = false;
        if (!best || this.better(metric, v, best.value)) { r._pr = r.cls === 'tested' && !!best; best = { value: v, o: r.o, src: r.id }; }
      });
      out[metric] = { baseline: b, results: rs, best: rs.length ? rs.reduce((a, c) => this.better(metric, Units.canon(metric, c.o), Units.canon(metric, a.o)) ? c : a) : null, latest: rs[rs.length - 1] || null };
    });
    return out;
  },
  /* keep one result per (session, metric) = best completed attempt. Returns PR info if this write produced a new PR. */
  async recordFromSession(s, x) {
    const metric = x.metric; if (!metric) return null;
    const vals = x.sets.filter(t => t.done && t.val).map(t => t.val);
    const id = `${s.id}:${metric}`, existing = State.results.find(r => r.id === id);
    if (!vals.length) { if (existing) await Store.remove('results', id); return null; }
    const best = vals.reduce((a, c) => this.better(metric, Units.canon(metric, c), Units.canon(metric, a)) ? c : a);
    if (existing && Units.canon(metric, existing.o) === Units.canon(metric, best)) return null;
    const r = Object.assign(existing || { id, metric, sid: s.id, week: s.week, cls: 'tested', src: 'session', createdAt: Date.now(), notes: '' }, { o: best, date: s.date });
    await Store.save('results', r);
    this.annotate();
    if (r._pr) { Achievements.evaluate(); return { metric, o: r.o, prev: r._prev }; }
    return null;
  }
};

/* ============ 12. ANALYTICS ============ */
const Stats = {
  _c: null, _v: -1, _u: null,
  get() {
    if (this._c && this._v === State.version && this._u === State.settings.unit + State.settings.includeWarmups) return this._c;
    this._v = State.version; this._u = State.settings.unit + State.settings.includeWarmups; return (this._c = this.compute());
  },
  statusOf(tid) {
    const ss = State.sessions.filter(s => s.tid === tid);
    if (ss.some(s => s.status === 'completed')) return 'completed';
    if (ss.some(s => s.status === 'in_progress')) return 'in_progress';
    if (ss.some(s => s.status === 'skipped')) return 'skipped';
    const w = Program.byId(tid), d = w && Program.schedDate(w);
    if (w && w.prep) return 'upcoming';   // prep weeks are optional build-up: never "missed"
    if (d && d < todayISO()) return 'missed';
    if (d && d === todayISO()) return 'due';
    return 'upcoming';
  },
  setVolumeKg(x, t) { return ((x.type === 'pct' || x.type === 'reps') && t.done && t.w && t.reps > 0 && (!t.warm || State.settings.includeWarmups)) ? t.w.kg * t.reps : 0; },
  sessionStats(s) {
    let vol = 0, sets = 0, reps = 0, dist = 0, secs = 0, exDone = 0;
    (s.ex || []).forEach(x => {
      let any = false;
      x.sets.forEach(t => {
        if (!t.done) return; any = true;
        if (!t.warm) sets++;
        vol += this.setVolumeKg(x, t);
        if ((x.type === 'pct' || x.type === 'reps') && !t.warm) reps += t.reps || 0;
        if (x.type === 'sprint') { dist += t.dist || 0; if (t.sec) secs += t.sec; }
        if (x.type === 'timed' && x.cat !== 'core') secs += t.sec || 0;
      });
      if (any) exDone++;
    });
    const total = (s.ex || []).reduce((n, x) => n + x.sets.filter(t => !t.warm).length, 0);
    return { vol, sets, reps, dist, secs, exDone, exTotal: (s.ex || []).length, total, prs: State.results.filter(r => r.sid === s.id && r._pr).length };
  },
  compute() {
    const P = State.program, today = todayISO(), prof = State.profile || {};
    PR.annotate();
    const completed = State.sessions.filter(s => s.status === 'completed');
    const order = P.workouts, status = {}; order.forEach(w => status[w.id] = this.statusOf(w.id));
    const doneTids = new Set(completed.map(s => s.tid));
    let vol = 0, sets = 0, reps = 0, dist = 0, secs = 0;
    completed.forEach(s => { const st = this.sessionStats(s); vol += st.vol; sets += st.sets; reps += st.reps; dist += st.dist; secs += st.secs; });
    // streak rule: consecutive scheduled workouts (program order) completed; a skipped or past-due unfinished workout breaks it.
    const due = order.filter(w => { const d = Program.schedDate(w); return (d && d <= today) || doneTids.has(w.id); });
    let run = 0, longest = 0;
    order.forEach(w => { const st = status[w.id]; if (st === 'completed') { run++; longest = Math.max(longest, run); } else if (st === 'skipped' || st === 'missed') run = 0; });
    // current streak counts back from the latest scheduled workout; not-yet-due workouts are ignored
    let cur = 0, started = false;
    for (let i = order.length - 1; i >= 0; i--) { const st = status[order[i].id]; if (st === 'completed') { cur++; started = true; } else if (st === 'skipped' || st === 'missed') break; else if (started) break; }
    const dueCount = order.filter(w => { const d = Program.schedDate(w); return d && d < today; }).length + order.filter(w => Program.schedDate(w) === today && status[w.id] === 'completed').length;
    const doneOfDue = order.filter(w => { const d = Program.schedDate(w); return d && d <= today && status[w.id] === 'completed'; }).length;
    const missed = order.filter(w => status[w.id] === 'missed').length, skipped = order.filter(w => status[w.id] === 'skipped').length;
    const weekly = Array.from({ length: P.weeks }, (_, i) => { const ws = order.filter(w => w.week === i + 1); return { week: i + 1, scheduled: ws.length, done: ws.filter(w => status[w.id] === 'completed').length, vol: completed.filter(s => s.week === i + 1).reduce((a, s) => a + this.sessionStats(s).vol, 0) }; });
    const weeksComplete = weekly.filter(w => w.done === w.scheduled && w.scheduled).length;
    let curWeek = 1, preSeason = false;
    if (prof.startDate) { const d = daysBetween(prof.startDate, today); preSeason = d < 0; curWeek = preSeason ? 1 : Math.floor(d / 7) + 1; }
    const programWeek = clamp(curWeek, 1, P.weeks);
    const next = order.find(w => status[w.id] !== 'completed' && status[w.id] !== 'skipped') || null;
    const firstDate = completed.length ? completed.map(s => s.date).sort()[0] : null;
    const spanWeeks = firstDate ? Math.max(1, Math.ceil((daysBetween(firstDate, today) + 1) / 7)) : 0;
    const pr = PR.annotate();
    const prCount = State.results.filter(r => r._pr).length;
    const testIds = order.filter(w => w.category === 'test' || w.exercises.some(e => e.type === 'test' || e.testRun)).map(w => w.id);
    const testingDone = testIds.length > 0 && testIds.every(id => status[id] === 'completed');
    return {
      status, completed, doneUnique: doneTids.size, total: order.length, programPct: order.length ? order.filter(w => status[w.id] === 'completed').length / order.length : 0,
      vol, sets, reps, dist, secs, streak: cur, longest, adherence: dueCount ? doneOfDue / dueCount : null, dueCount, doneOfDue, missed, skipped,
      weekly, weeksComplete, curWeek, programWeek, preSeason, postProgram: curWeek > P.weeks, next, avgPerWeek: spanWeeks ? completed.length / spanWeeks : 0,
      pr, prCount, testingDone, bw: this.bwSeries()
    };
  },
  bwSeries() {
    const p = State.profile, pts = [];
    if (p && p.initialBw) pts.push({ date: p.bwDate || p.startDate || toISO(new Date(p.createdAt || Date.now())), o: p.initialBw, initial: true, id: 'initial' });
    State.bodyweight.slice().sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt).forEach(e => pts.push({ date: e.date, o: e.w, id: e.id }));
    return pts;
  },
  currentBw() { const s = this.bwSeries(); return s.length ? s[s.length - 1].o : null; },
  estimates(lift) {
    // Epley estimates from completed working sets, kept separate from tested values
    const out = [];
    State.sessions.filter(s => s.status === 'completed').forEach(s => s.ex.forEach(x => { if (x.type !== 'pct' || x.lift !== lift || x.exId === 'clean_pull') return; let best = null; x.sets.forEach(t => { if (!t.done || t.warm || !t.w) return; const e = Calc.epley(t.w.kg, t.reps); if (e && (!best || e > best.kg)) best = { kg: e, from: t }; }); if (best) out.push({ date: s.date, kg: best.kg, from: best.from, sid: s.id }); }));
    return out.sort((a, b) => a.date.localeCompare(b.date));
  }
};

  { id: 'streak_16', name: 'Iron Line', desc: 'Sixteen scheduled workouts completed in a row.', test: s => s.longest >= 16 },
  { id: 'prog_25', name: 'First Quarter', desc: '25% of the program completed.', test: s => s.programPct >= .25 },
  { id: 'prog_50', name: 'Halftime', desc: '50% of the program completed.', test: s => s.programPct >= .5 },
  { id: 'prog_75', name: 'Fourth Quarter', desc: '75% of the program completed.', test: s => s.programPct >= .75 },

  { id: 'sets_250', name: '250 Working Sets', desc: '250 working sets logged.', test: s => s.sets >= 250 },
  { id: 'sets_500', name: '500 Working Sets', desc: '500 working sets logged.', test: s => s.sets >= 500 },
  { id: 'reliable', name: 'Reliable', desc: '90%+ adherence after at least 8 scheduled workouts.', test: s => s.dueCount >= 8 && s.adherence >= .9 },
  { id: 'testing_done', name: 'Game Day', desc: 'Completed every Week 11 testing session.', test: s => s.testingDone }
];
const Achievements = {
  evaluate() {
    const s = Stats.get(), have = new Map(State.achievements.map(a => [a.id, a])), fresh = [], valid = new Set();
    ACH.forEach(a => { if (a.test(s)) { valid.add(a.id); if (!have.has(a.id)) fresh.push({ id: a.id, type: 'milestone', name: a.name, desc: a.desc, date: todayISO(), createdAt: Date.now() }); } });
    State.results.filter(r => r._pr).forEach(r => {
      const id = 'pr_' + r.id, m = METRICS[r.metric]; valid.add(id);
      if (!have.has(id)) fresh.push({ id, type: m.group === 'strength' ? 'strength_pr' : (m.kind === 'time' ? 'sprint_best' : 'jump_best'), name: `${m.name} PR`, desc: `${Units.showMetric(r.metric, r.o)} — new personal record`, date: r.date, result: r.id, workout: r.sid || null, createdAt: Date.now() });
    });
    fresh.forEach(a => Store.save('achievements', a));
    // achievements are data-driven: remove any whose evidence was edited away
    State.achievements.filter(a => !valid.has(a.id)).forEach(a => Store.remove('achievements', a.id));
    return fresh;
  },
  def: id => ACH.find(a => a.id === id)

/* ============ REST TIMER (timestamp based — accurate in background tabs) ============ */
const Rest = {
  t: null, iv: null,
  get st() { return State.meta.timer; },
  save() { Store.saveMeta(); },
  offer(sec) {
    const d = sec || State.settings.restDefault;
    State.meta.timer = { duration: d, endAt: null, remaining: d, running: false, done: false };
    if (State.settings.restAuto) this.start(); else { this.save(); this.render(); }
  },
  start() { const t = this.st; if (!t) return; t.endAt = Date.now() + t.remaining * 1000; t.running = true; t.done = false; this.save(); this.loop(); this.render(); },
  pause() { const t = this.st; if (!t || !t.running) return; t.remaining = Math.max(0, (t.endAt - Date.now()) / 1000); t.running = false; t.endAt = null; this.save(); this.render(); },
  reset() { const t = this.st; if (!t) return; t.remaining = t.duration; t.running = false; t.endAt = null; t.done = false; this.save(); this.render(); },
  add(s) { const t = this.st; if (!t) return; if (t.running) t.endAt = Math.max(Date.now(), t.endAt + s * 1000); else t.remaining = Math.max(0, t.remaining + s); t.duration = Math.max(15, t.duration + s); t.done = false; this.save(); this.render(); },
  stop() { State.meta.timer = null; this.save(); clearInterval(this.iv); this.iv = null; this.render(); },
  left() { const t = this.st; if (!t) return 0; return t.running ? Math.max(0, (t.endAt - Date.now()) / 1000) : t.remaining; },
  loop() { clearInterval(this.iv); this.iv = setInterval(() => this.tick(), 250); },
  tick() {
    const t = this.st; if (!t) { clearInterval(this.iv); return; }
    if (t.running && Date.now() >= t.endAt) { t.running = false; t.remaining = 0; t.done = true; this.save(); Haptics.beep(); Haptics.buzz(); UI.toast('Rest complete. Next set.'); }
    this.paint();
  },
  render() {
    const el = $('#rest'), t = this.st, show = !!t && !!Workout.active() && UI.route.name === 'workout';
    el.hidden = !show; document.body.classList.toggle('rest-on', show);
    if (!show) return;
    el.innerHTML = `<div class="dock">
      <div class="rring" aria-hidden="true"><svg viewBox="0 0 46 46" width="46" height="46"><circle cx="23" cy="23" r="20" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="4"/><circle id="restArc" cx="23" cy="23" r="20" fill="none" stroke="${C.glow}" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="0"/></svg></div>
      <div class="grow"><div class="label">${t.done ? 'Rest complete' : t.running ? 'Resting' : 'Rest ready'}</div><div class="rt" id="restT">0:00</div><div class="rq">${esc(Quotes.forRest())}</div></div>
      <button class="btn icon sm" type="button" data-act="rest-add" data-v="-15" aria-label="Remove 15 seconds">−15</button>
      <button class="btn icon sm" type="button" data-act="rest-add" data-v="15" aria-label="Add 15 seconds">+15</button>
      ${t.running ? `<button class="btn icon sm primary" type="button" data-act="rest-pause" aria-label="Pause rest">${icon('pause')}</button>` : `<button class="btn icon sm primary" type="button" data-act="rest-start" aria-label="${t.remaining < t.duration && !t.done ? 'Resume rest' : 'Start rest'}">${icon('play')}</button>`}
      <button class="btn icon sm" type="button" data-act="rest-reset" aria-label="Reset rest">${icon('rotate-ccw')}</button>
      <button class="btn icon sm" type="button" data-act="rest-skip" aria-label="Skip rest">${icon('x')}</button></div>`;
    el.classList.toggle('done', !!t.done);

  }
};

  },

    t.className = kind; t.innerHTML = `${icon(kind === 'bad' ? 'circle-alert' : 'check')}<span>${esc(msg)}</span>`; this.icons(t);
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('show'), kind === 'bad' ? 4200 : 2600);
  },
  /* count-up a value only when it changed since the last time it was shown */
  count(el) {

    if (this.built) return; this.built = true;
    // Blacksburg at night: layered Blue Ridge ridgelines with scattered town lights
    const ridge = (seed, base, amp, col, lights) => {
      const r = seeded(seed); let d = `M0 300 L0 ${base}`, x = 0, y = base, out = '';
      while (x < 2000) { x += 40 + r() * 70; y = clamp(base + (r() - .5) * amp * 2, base - amp, base + amp * .6); d += ` Q${(x - 30).toFixed(0)} ${(y - amp * .35 * r()).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)}`; }
      d += ' L2000 300 Z'; out += `<path d="${d}" fill="${col}"/>`;
      for (let i = 0; i < lights; i++) { const lx = r() * 2000, ly = base + 30 + r() * (260 - base); out += `<rect x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" width="1.8" height="1.8" fill="${r() > .5 ? '#FFB36B' : '#FFFFFF'}" opacity="${(.35 + r() * .55).toFixed(2)}"/>`; }
      return `<svg viewBox="0 0 2000 300" preserveAspectRatio="xMidYMax slice" width="100%" height="100%" aria-hidden="true">${out}</svg>`;

    for (let i = 0; i <= 13; i++) { const x = 40 + i * 40; mullions += `<rect x="${x - 2}" y="${(roof(x) + 6).toFixed(1)}" width="4" height="${(206 - roof(x) - 6).toFixed(1)}" fill="rgba(26,29,32,.55)"/>`; }
    { const r = seeded(9); for (let row = 0; row < 18; row++) { const y = 60 + row * 8; let x = -10 + (row % 2) * 9; while (x < 610) { const w = 10 + r() * 16, g = 92 + Math.floor(r() * 40); stones += `<rect x="${x.toFixed(1)}" y="${y}" width="${(w - 1.4).toFixed(1)}" height="6.6" rx="1" fill="rgb(${g + 6},${g + 2},${g - 4})"/>`; x += w; } } }
    const r = seeded(3); for (let i = 0; i < 70; i++) park += `<circle cx="${(r() * 600).toFixed(1)}" cy="${(211 + r() * 9).toFixed(1)}" r="${(.6 + r() * .8).toFixed(1)}" fill="${r() > .6 ? '#FFB36B' : '#FFFFFF'}" opacity="${(.4 + r() * .5).toFixed(2)}"/>`;

    const r40 = roof(40), r560 = roof(560), mid = roof(300);
    const body = `M40 ${r40 + 4} Q30 ${r40 + 6} 30 120 L26 206 L574 206 L570 120 Q570 ${r560 + 6} 560 ${r560 + 4} Q300 ${mid - 4} 40 ${r40 + 4} Z`;

      ${tower(40, 14)}${tower(560, 14)}
      <rect x="262" y="184" width="76" height="22" rx="2" fill="#0C0608" stroke="#B7BEC3" stroke-width="1"/>

      <text x="300" y="180" text-anchor="middle" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="800" font-size="8" fill="#FFFFFF" letter-spacing="2.5">GATE 2005</text>
      <rect x="0" y="206" width="600" height="16" fill="#0C0608"/>${park}
    </svg>${[6.7, 50, 93.3].map((l, i) => `<div class="cone" style="left:${l}%;transform:translateX(-50%) rotate(${(i - 1) * 9}deg);bottom:62%"></div>`).join('')}`;
    $('#tunnel').insertAdjacentHTML('beforeend', Array.from({ length: 9 }, () => '<div class="tf"></div>').join(''));
  },
  stars() {
    const cv = $('#stars'), c = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight, r = seeded(5);
    cv.width = w * dpr; cv.height = h * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.starList = Array.from({ length: 120 }, () => ({ x: r() * w, y: r() * h * .4, s: r() * 1.3, p: r() * 6 }));
    this.starCtx = c; this.sw = w; this.sh = h;
  },
  loop() {
    const tick = t => {
      const el = $('#intro'); if (el.hidden) { this.raf = null; return; }
      const c = this.starCtx; c.clearRect(0, 0, this.sw, this.sh);
      this.starList.forEach(s => { c.globalAlpha = .2 + .45 * Math.abs(Math.sin(t / 900 + s.p)); c.fillStyle = '#FFFFFF'; c.fillRect(s.x, s.y, s.s + .4, s.s + .4); });
      if (el.classList.contains('s-d')) {
        this.camZ += this.speed * 16;

          f.style.transform = `translateZ(${z.toFixed(1)}px)`;
          f.style.opacity = z > 200 ? Math.max(0, (300 - z) / 100) : clamp((z + 1680) / 700, 0, 1);
        });

      this.raf = requestAnimationFrame(tick);
    };
    if (!this.raf) this.raf = requestAnimationFrame(tick);
  },
  /* about two seconds from black to title: ridgelines → stadium rises → lights come on → title */
  play(onDone) {
    this.onDone = onDone; this.build();
    const el = $('#intro'); el.hidden = false; el.className = ''; $('#flash').style.opacity = 0;
    $$('#tunnel .tf').forEach(f => { f.style.opacity = 0; });
    this.stars(); this.speed = .4; this.camZ = 0; this.loop();

/* football-field progress strip: 11 yard lines, the route drawn to the current position */
function fieldStrip(pct) {
  let lines = '', nums = ['G', '10', '20', '30', '40', '50', '40', '30', '20', '10', 'G'];
  for (let i = 0; i <= 10; i++) { const x = 21 + i * 25.8; lines += `<line x1="${x}" y1="6" x2="${x}" y2="54" stroke="rgba(255,255,255,${i === 0 || i === 10 ? .5 : .16})" stroke-width="${i === 0 || i === 10 ? 1.4 : 1}"/><text x="${x}" y="58" text-anchor="middle" fill="rgba(255,255,255,.35)" font-size="6" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="800">${nums[i]}</text>`; for (let k = 1; k < 5 && i < 10; k++) { const hx = x + k * 5.16; lines += `<line x1="${hx}" y1="22" x2="${hx}" y2="25" stroke="rgba(255,255,255,.12)"/><line x1="${hx}" y1="35" x2="${hx}" y2="38" stroke="rgba(255,255,255,.12)"/>`; } }
  const endX = 21 + pct * 258;
  let d = `M21 30`; const n = 12; for (let i = 1; i <= n; i++) { const x = 21 + (endX - 21) * i / n, y = 30 + Math.sin(i * 1.1) * 9 * (i < n ? 1 : 0); d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; }
  return `<div class="field-strip" aria-label="Program progress ${Math.round(pct * 100)} percent"><svg viewBox="0 0 300 62" preserveAspectRatio="none" aria-hidden="true">${lines}
    <path d="M21 30 H279" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 4" fill="none"/>
    <path class="route-draw" d="${d}" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 0 3px #B7BEC3)"/>
    <g transform="translate(${endX.toFixed(1)} 30)"><ellipse rx="6" ry="3.8" fill="#E87722" stroke="#fff" stroke-width="1"/><path d="M-2.5 0h5" stroke="#fff" stroke-width=".8"/></g></svg></div>`;
}

/* ---- simple accessible SVG charts (all values are real recorded data) ---- */
const Chart = {
  nice(min, max, n = 4) {
    if (min === max) { min -= 1; max += 1; }
    const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag, step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
    for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
    return { lo, hi, ticks };
  },
  line({ series, hline, yUnit = '', dec = 1, h = 200, title = 'Chart' }) {
    const all = series.flatMap(s => s.pts); if (!all.length) return '';
    const W = 340, L = 44, R = 14, T = 14, B = 28;
    const xs = all.map(p => p.t), ys = all.map(p => p.y).concat(hline ? [hline.y] : []);
    let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1) { x0 -= 86400000 * 3; x1 += 86400000 * 3; }
    const pad = (Math.max(...ys) - Math.min(...ys)) * .12 || Math.abs(ys[0]) * .05 || 1;
    const { lo, hi, ticks } = this.nice(Math.min(...ys) - pad, Math.max(...ys) + pad);
    const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (h - T - B);
    let g = `<g class="grid">${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${L - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${fmtNum(v, dec)}</text>`).join('')}</g>`;
    const dts = [x0, (x0 + x1) / 2, x1].map(t => { const d = new Date(t); return `<text x="${X(t).toFixed(1)}" y="${h - 8}" text-anchor="middle">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</text>`; }).join('');
    let body = '';
    if (hline) body += `<line x1="${L}" x2="${W - R}" y1="${Y(hline.y).toFixed(1)}" y2="${Y(hline.y).toFixed(1)}" class="hline" stroke="#B7BEC3" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - R}" y="${(Y(hline.y) - 5).toFixed(1)}" text-anchor="end" class="hl-t">${esc(hline.label)}</text>`;
    series.forEach(s => {
      const pts = s.pts.slice().sort((a, b) => a.t - b.t);
      if (pts.length > 1) body += `<path class="cline" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ')}" fill="none" stroke="${Theme.c(s.color)}" stroke-width="2.2" ${s.dashed ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach(p => body += `<g class="pt" tabindex="0" role="button" data-tip="${esc(p.tip)}" aria-label="${esc(p.tip)}"><circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="11" fill="transparent"/><circle class="dot" cx="${X(p.t).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.big ? 5.5 : 4}" fill="${s.hollow ? Theme.c('#16171A') : Theme.c(p.color || s.color)}" stroke="${Theme.c(p.color || s.color)}" stroke-width="2"/></g>`);
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(title)}"><line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${h - B}"/><line class="axis" x1="${L}" x2="${W - R}" y1="${h - B}" y2="${h - B}"/>${g}${dts}${body}<text x="${L}" y="9" text-anchor="start">${esc(yUnit)}</text></svg><div class="chart-tip" aria-live="polite">Tap a point for details.</div>`;
  },
  bars({ items, fmt = v => fmtNum(v, 0), h = 170, title = 'Chart', max }) {
    const W = 340, L = 8, R = 8, T = 18, B = 24, n = items.length; if (!n) return '';
    const mx = max || Math.max(1, ...items.map(i => Math.max(i.v, i.v2 || 0)));
    const bw = (W - L - R) / n, Y = v => T + (1 - v / mx) * (h - T - B);
    const body = items.map((it, i) => {
      const x = L + i * bw + bw * .18, w = bw * .64;
      const bg = it.v2 != null ? `<rect x="${x.toFixed(1)}" y="${Y(it.v2).toFixed(1)}" width="${w.toFixed(1)}" height="${(h - B - Y(it.v2)).toFixed(1)}" rx="3" fill="rgba(183,190,195,.12)"/>` : '';
      return `${bg}<g class="pt" tabindex="0" role="button" data-tip="${esc(it.tip)}" aria-label="${esc(it.tip)}"><rect class="bar" x="${x.toFixed(1)}" y="${Y(it.v).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, h - B - Y(it.v)).toFixed(1)}" rx="3" fill="${it.hl ? '#E87722' : '#A0335A'}" style="transform-origin:${(x + w / 2).toFixed(1)}px ${h - B}px"/></g>
        <text x="${(x + w / 2).toFixed(1)}" y="${h - 9}" text-anchor="middle">${esc(it.label)}</text>${it.v ? `<text x="${(x + w / 2).toFixed(1)}" y="${(Y(it.v) - 4).toFixed(1)}" text-anchor="middle" class="vl">${fmt(it.v)}</text>` : ''}`;
    }).join('');
    return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(title)}"><line class="axis" x1="${L}" x2="${W - R}" y1="${h - B}" y2="${h - B}"/>${body}</svg><div class="chart-tip" aria-live="polite">Tap a bar for details.</div>`;
  }
};

  journeyMap(st, sel) {

    const pathOf = arr => arr.map((p, i) => i ? `C${arr[i - 1].x} ${(arr[i - 1].y + gap / 2).toFixed(0)} ${p.x} ${(p.y - gap / 2).toFixed(0)} ${p.x} ${p.y}` : `M${p.x} ${p.y}`).join(' ');

    const endY = pts[n - 1].y;
    field += `<rect x="16" y="${endY}" width="${W - 32}" height="80" fill="url(#ez)"/><text x="${W / 2}" y="${endY + 54}" text-anchor="middle" fill="rgba(255,255,255,.5)" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="30" letter-spacing="6">GAME DAY</text>`;
    const done = st.weekly.map(w => w.done === w.scheduled && w.scheduled > 0), curIdx = Math.max(0, done.findIndex(d => !d)), litTo = done.every(Boolean) ? n - 1 : curIdx;
    const ms = pts.map((p, i) => {
      const w = st.weekly[i], isDone = done[i], isCur = i === litTo && !done.every(Boolean), isSel = i + 1 === sel, right = p.x < 180;

        ${isDone ? `<path d="M${p.x - 7} ${p.y} l5 5 l9 -10" stroke="#861F41" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` : `<text x="${p.x}" y="${p.y + 6}" text-anchor="middle" fill="#fff" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="900" font-size="18">${i + 1}</text>`}
        <text class="ml" x="${lx}" y="${p.y - 3}" text-anchor="${anchor}" fill="${isSel ? '#fff' : '#B7BEC3'}" font-family="Big Shoulders Display,Impact,sans-serif" font-weight="800" font-size="14" letter-spacing=".3" paint-order="stroke" stroke="#2D0D18" stroke-width="5">${WEEK_LABELS[i] || 'WEEK ' + (i + 1)}</text>

  logger(s) {
    const x = s.ex[s.cur] || s.ex[0], ei = s.cur, u = unitW(), ss = Stats.sessionStats(s);

    const nextEx = s.ex.findIndex((z, i) => i !== ei && !z.skipped && z.sets.some(t => !t.done && !t.warm));
    const allDone = s.ex.every(exDone);

    } else if (x.type === 'test') focal = `<div class="target" data-rev style="font-size:clamp(54px,17vw,84px)">TEST</div>`;
    else focal = `<div class="target" data-rev style="font-size:clamp(56px,18vw,88px)">${x.type === 'check' ? `${x.sets.length}<small>${x.sets[0] && x.sets[0].pLabel ? 'EXERCISES' : x.sets.length > 1 ? 'SETS' : 'ROUND'}</small>` : x.type === 'sprint' ? (x.target ? `${fmtDur(x.target * 1000)}<small>TARGET</small>` : `${x.sets.length}<small>REPS</small>`) : x.type === 'timed' ? (x.sets[0].pSec >= 120 ? `${Math.round(x.sets[0].pSec / 60)}<small>MIN</small>` : `${x.sets[0].pSec}<small>SEC</small>`) : `${x.sets[0].pReps}<small>${(x.unitLabel || 'reps').toUpperCase()}</small>`}</div>`;

    else cta = `<button class="btn big red grow" type="button" data-act="finish">${icon('flag')} Finish mission</button>`;
    return `<div class="screen">
      <header class="hud" aria-label="Workout status">
        <div class="row"><button class="btn icon sm" type="button" data-act="save-exit" aria-label="Save and exit">${icon('save')}</button>

          <div style="text-align:right"><div class="hud-time" id="hudTime" aria-label="Elapsed time">${fmtDur(Workout.elapsed(s))}</div><div class="label num">${doneSets}/${total} sets · ${total ? Math.round(doneSets / total * 100) : 0}%</div></div>

        <div class="yardbar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${doneSets}" aria-label="Sets completed"><i style="width:${total ? doneSets / total * 100 : 0}%"></i></div>
        <div class="ex-tabs" role="tablist" aria-label="Exercises">${s.ex.map((z, i) => `<button type="button" role="tab" class="ex-tab ${i === ei ? 'cur' : ''} ${z.skipped ? 'skip' : exDone(z) ? 'done' : ''}" data-act="ex-go" data-i="${i}" aria-selected="${i === ei}" aria-label="Exercise ${i + 1}: ${esc(z.name)}${exDone(z) && !z.skipped ? ', done' : ''}${z.pair != null ? ', superset' : ''}">${exDone(z) && !z.skipped ? icon('check') : i + 1}${z.pair != null ? '<i class="pairdot" aria-hidden="true"></i>' : ''}</button>`).join('')}</div>
        <div class="label tabhint">Tap a number to jump · ${icon('link')} Superset alternates two</div>
      </header>
      ${s.pausedAt ? `<div class="resume-banner">${icon('pause')}<div class="grow"><b>Clock paused.</b> You can still log sets.</div><button class="btn sm" type="button" data-act="pause">Resume</button></div>` : ''}
      ${(() => { const w = Program.byId(s.tid); return w && w.warmup && w.warmup.length ? `<details class="panel flat warmup"><summary class="label" style="cursor:pointer">${icon('flame')} Pre-workout · ${w.warmup.length} drills</summary><ol class="wlist">${w.warmup.map(d => `<li>${Video.forDrill(d) ? `<button type="button" data-act="video-drill" data-name="${esc(d)}">${icon('play')}${esc(d)}</button>` : esc(d)}</li>`).join('')}</ol></details>` : ''; })()}
      <div class="exstage"><article class="excard" aria-label="Current exercise" data-plane="${pad2(ei + 1)}">
        <div class="spread"><span class="label" data-rev>${esc(x.cat)} · ${ei + 1} of ${s.ex.length}</span>${x.skipped ? '<span class="badge">Skipped</span>' : ''}</div>
        <h2 class="ex-name" data-rev>${esc(x.name)}</h2>${focal}${sub}
        <div class="presc" data-rev>${esc(x.presc)}</div>${x.pNote ? `<div class="muted" data-rev style="font-size:14px;margin-top:4px">${esc(x.pNote)}</div>` : ''}
        <div class="row wrap" data-rev style="margin-top:8px">${Video.btn(x.exId, 'Watch how')}${x.rest ? `<span class="badge">${icon('timer')} Rest ${fmtDur(x.rest * 1000)}</span>` : ''}${last && !x.weighted ? `<span class="badge blue">Last: ${esc(last)}</span>` : ''}${x.optional ? '<span class="badge">Optional</span>' : ''}${flags}${roundedUp}</div>
        ${(() => { if (!x.weighted) return ''; const L = Workout.lastSets(x.exId, s.id), lw = L && L.work.filter(t => t.w); if (!lw || !lw.length) return `<p class="muted" data-rev style="font-size:13px;margin-top:8px">${icon('scale')} Weight is optional here — log it and next time you'll see where you were.</p>`; return `<div class="last-box" data-rev><div class="grow"><span class="label">Last time · ${wkLabel(L.week)} · ${fmtDate(L.date)}</span><div class="num" style="font-weight:700">${L.work.map(t => (t.w ? Units.fmtW(t.w) + '×' : '') + (t.reps ?? '—')).join(' · ')} <small>${u}</small></div></div>${x.sets.some(t => !t.done && !t.warm) ? `<button class="btn sm" type="button" data-act="use-last" data-e="${ei}">${icon('undo-2')} Use last</button>` : ''}</div>`; })()}
        <div class="row wrap" data-rev style="margin-top:10px">${x.alts && x.alts.length ? `<button class="btn sm" type="button" data-act="swap-alt" data-e="${ei}">${icon('repeat')} Swap for ${esc(x.alts[0].name)}</button>` : ''}${x.pair != null && s.ex[x.pair] ? `<span class="badge blue">${icon('link')} Superset with ${esc(s.ex[x.pair].name)}</span><button class="btn sm ghost" type="button" data-act="unpair" data-e="${ei}">${icon('x')} Unpair</button>` : (x.type === 'reps' || x.type === 'pct' || x.type === 'timed' || x.type === 'check') && !x.skipped ? `<button class="btn sm" type="button" data-act="pair" data-e="${ei}">${icon('link')} Superset</button>` : ''}</div>
        <details style="margin-top:10px"><summary class="label" style="cursor:pointer">Technique notes</summary><p class="muted" style="margin-top:6px;font-size:14px">${esc(Program.exDef(x.exId).notes || '—')}</p></details>
      </article></div>
      <div class="row wrap lock-row"><button class="btn sm" type="button" data-act="pocket">${icon('smartphone')} Pocket mode</button><button class="btn sm ghost" type="button" data-act="lock-toggle" aria-pressed="${LockTrack.enabled()}">${icon('lock')} Lock screen: ${LockTrack.enabled() ? 'On' : 'Off'}</button></div>

        <button class="btn sm ghost" type="button" data-act="skip-ex" data-e="${ei}">${icon(x.skipped ? 'undo-2' : 'skip-forward')} ${x.skipped ? 'Unskip exercise' : 'Skip exercise'}</button></div>
      <div class="field"><label for="exNotes">Exercise notes — discomfort, limits, substitutions</label><textarea class="input" id="exNotes" rows="2" data-xf="notes" data-e="${ei}" placeholder="Optional">${esc(x.notes)}</textarea></div>
      <div class="row"><button class="btn grow" type="button" data-act="ex-go" data-i="${Math.max(0, ei - 1)}" ${ei === 0 ? 'disabled' : ''}>${icon('chevron-left')} Previous</button><button class="btn grow" type="button" data-act="ex-go" data-i="${Math.min(s.ex.length - 1, ei + 1)}" ${ei === s.ex.length - 1 ? 'disabled' : ''}>Next ${icon('chevron-right')}</button></div>
      <section class="panel stack"><div class="label">Session</div>
        <div class="field"><label for="sesNotes">Workout notes</label><textarea class="input" id="sesNotes" rows="2" data-sf="notes" placeholder="How did it feel? Any pain or limitations?">${esc(s.notes)}</textarea></div>
        <p class="muted" style="font-size:12.5px">Stop if you feel sharp pain. Skipping or modifying an exercise is always fine — log what you actually did.</p>
        <div class="grid2"><button class="btn red" type="button" data-act="finish">${icon('flag')} Finish workout</button><button class="btn danger" type="button" data-act="discard">${icon('trash-2')} Discard</button></div></section>
      <div class="logger-actions">${cta}</div>
    </div>`;
  },
  setRow(s, x, ei, t, si, isNext) {
    const u = unitW(), id = (f) => `in-${ei}-${si}-${f}`, inp = (f, val, unitLabel, ph, aria) => `<div class="input-unit"><input class="input num" id="${id(f)}" inputmode="decimal" enterkeyhint="done" data-f="${f}" data-e="${ei}" data-s="${si}" value="${esc(val)}" placeholder="${esc(ph || '')}" aria-label="${esc(aria)}"><span>${unitLabel}</span></div>`;
    let ins = '', presc = '';
    const lbl = t.warm ? 'Warm-up' : (x.type === 'test' ? 'Attempt ' : 'Set ') + t.n;
    if (x.type === 'pct') { ins = inp('w', numVal(Units.showW(t.w)), u, 'weight', `${lbl} weight in ${u}`) + inp('reps', numVal(t.reps), 'reps', 'reps', `${lbl} reps`); presc = t.warm ? `Warm-up${t.pReps ? ' · ' + t.pReps + ' reps' : ''} · not in volume` : t.pPct == null ? `${t.pReps || ''} reps · ${t.pLabel === '3RM' ? 'work up to a 3-rep max' : t.pLabel === 'build' ? 'build-up set, your choice of weight' : esc(t.pLabel || 'your weight')}` : `${t.pLabel || t.pReps} @ ${t.pPct}% · ${frozenTargetText(t.pT)}${t.pT && t.pT.roundedUp ? ' ↑' : ''}${t.pPct > 100 ? ' · above 100%' : ''}`; }
    else if (x.type === 'reps') {
      const lt = x.weighted ? lastFor(s, x, t) : null;
      ins = (x.weighted ? inp('w', numVal(Units.showW(t.w)), u, lt && lt.w ? fmtNum(Units.showW(lt.w), 2) : 'weight', `${lbl} weight in ${u} (optional)`) : '') + inp('reps', numVal(t.reps), x.unitLabel ? x.unitLabel + 's' : 'reps', 'reps', `${lbl} reps`);
      presc = `Target ${t.pLabel || t.pReps}${lt ? ` · last ${lt.w ? Units.fmtW(lt.w) + ' ' + u + ' × ' : ''}${lt.reps ?? '—'}` : ''}`;
    }
    else if (x.type === 'timed') { ins = inp('sec', numVal(t.sec), 'sec', 'seconds', `${lbl} seconds`); presc = `Target ${t.pSec}s`; }
    else if (x.type === 'sprint') { ins = inp('sec', numVal(t.sec), 'sec', x.testRun ? 'time' : 'time (optional)', `${lbl} time in seconds`); presc = `${x.distLabel || t.dist + ' yd'}${x.target ? ` · target ${fmtDur(x.target * 1000)}` : ''}${t.sec && x.target ? (t.sec <= x.target ? ' · made it' : ' · over') : ''}`; }
    else if (x.type === 'check') { ins = `<span class="muted" style="align-self:center;font-size:14px">${t.pLabel ? `<b style="color:var(--ink,#1A1D20)">${esc(t.pLabel.split(' — ')[0])}</b><br>${esc(t.pLabel.split(' — ')[1] || '')}` : esc(x.sets.length > 1 ? 'Tap ✓ when this set is done' : 'Tap ✓ when done')}</span>`; presc = x.sets.length > 1 ? `${t.pLabel ? 'Exercise' : 'Set'} ${t.n} of ${x.sets.length}` : ''; }
    else if (x.type === 'test') { const mu = Units.metricUnit(x.metric); ins = inp('val', t.val ? numVal(Units.metricIn(x.metric, t.val)) : '', mu, 'result', `${lbl} result in ${mu}`); presc = 'Record only a successful attempt'; }
    const rpe = x.type === 'pct' ? `<label class="sr" for="${id('rpe')}">RPE</label><select class="rpe" id="${id('rpe')}" data-f="rpe" data-e="${ei}" data-s="${si}"><option value="">RPE</option>${[6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10].map(v => `<option value="${v}" ${t.rpe === v ? 'selected' : ''}>RPE ${v}</option>`).join('')}</select>` : '';
    return `<div class="set ${t.done ? 'done' : ''} ${t.warm ? 'warm' : ''} ${isNext ? 'next' : ''}" data-set="${ei}-${si}">
      <div class="sn" aria-hidden="true">${t.warm ? 'W' : t.n}</div><div class="ins">${ins}</div>
      <button class="chk" type="button" data-act="set-toggle" data-e="${ei}" data-s="${si}" aria-pressed="${t.done}" aria-label="${t.done ? 'Mark ' + lbl + ' not done' : 'Complete ' + lbl}"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M6 13.5l4.5 4.5L20 8.5"/></svg></button>
      <div class="meta"><span class="label">${esc(presc)}</span>${rpe}${t.done ? '<span class="badge ok">Logged</span>' : ''}${t.extra && !t.done ? `<button class="btn sm ghost" type="button" data-act="rm-set" data-e="${ei}" data-s="${si}" aria-label="Remove this set">${icon('x')}</button>` : ''}</div></div>`;
  },

  /* ---------- Progress & analytics ---------- */
  progress(tab) {
    tab = tab || 'overview';
    const tabs = [['overview', 'Overview'], ['strength', 'Strength'], ['athletic', 'Speed & jump'], ['volume', 'Volume'], ['consistency', 'Consistency'], ['body', 'Body weight'], ['report', 'Test report']];
    const body = { overview: this.pOverview, strength: this.pStrength, athletic: this.pAthletic, volume: this.pVolume, consistency: this.pConsistency, body: this.pBody, report: this.pReport }[tab].call(this, Stats.get());
    return `<div class="screen"><div class="topbar" data-stg><h1 class="h2">Performance</h1><button class="btn sm" type="button" data-act="log-result">${icon('plus')} Log result</button></div>
      <div class="chips" role="tablist" data-stg>${tabs.map(([k, l]) => `<button class="chip" type="button" role="tab" data-act="go" data-r="progress" data-p="${k}" aria-pressed="${tab === k}">${l}</button>`).join('')}</div>${body}</div>`;
  },
  prCard(metric, st) {
    const m = METRICS[metric], d = st.pr[metric], b = d.baseline, best = d.best, latest = d.latest, u = Units.metricUnit(metric), dec = m.kind === 'time' ? 2 : 1;
    const bv = b ? Units.metricIn(metric, b.o) : null, bestV = best ? Units.metricIn(metric, best.o) : null;
    const change = bv != null && bestV != null ? bestV - bv : null, improved = change != null && (m.better === 'higher' ? change > 0 : change < 0);
    return `<div class="metric" data-stg><span class="label">${m.name}</span>
      <div class="v">${bestV != null ? fmtNum(bestV, dec) : '—'}<small> ${bestV != null ? u : ''}</small></div>
      <div class="muted" style="font-size:12px">${best ? `Best · ${best.cls === 'tested' ? 'tested' : 'recorded'} · ${fmtDate(best.date)}` : 'No result recorded'}</div>
      <div style="font-size:12.5px">Baseline: ${b ? `${fmtNum(bv, dec)} ${u} <span class="muted">(${Calc.clsLabel(b.cls).toLowerCase()})</span>` : '<span class="muted">not set</span>'}</div>
      ${latest && latest !== best ? `<div style="font-size:12.5px">Latest: ${Units.showMetric(metric, latest.o)} · ${fmtDate(latest.date)}</div>` : ''}
      ${change != null ? `<div class="row wrap"><span class="badge ${improved ? 'ok' : ''}">${change > 0 ? '+' : ''}${fmtNum(change, dec)} ${u}${bv ? ` · ${change > 0 ? '+' : ''}${fmtNum(change / bv * 100, 1)}%` : ''}</span>${State.results.some(r => r.metric === metric && r._pr) ? '<span class="badge red">PR</span>' : ''}</div>` : ''}
      <div class="muted" style="font-size:11px">${m.better === 'lower' ? 'Lower is better' : 'Higher is better'}</div></div>`;
  },
  pOverview(st) {
    const earned = new Set(State.achievements.map(a => a.id));
    return `${Season.html(st, { key: 'season-p' })}${Awards.html()}<div class="label" data-stg>Personal record tracker</div><div class="metrics">${Object.keys(METRICS).map(k => this.prCard(k, st)).join('')}</div>
      <p class="muted" style="font-size:12.5px" data-stg>A PR is a <b>tested</b> result that beats every earlier result and your baseline (when the baseline was a tested or previous max). Estimated maxima never count as PRs.</p>
      <section class="panel" data-stg><div class="panel-head"><h2 class="h3">Achievements</h2><span class="label">${State.achievements.length} earned</span></div>
        <div class="stack" style="gap:0">${State.achievements.filter(a => a.type !== 'milestone').sort((a, b) => b.date.localeCompare(a.date)).map(a => `<div class="list-item">${icon('trophy')}<div class="grow"><b>${esc(a.name)}</b><div class="muted" style="font-size:12.5px">${esc(a.desc)} · ${fmtDate(a.date)}</div></div><span class="badge red">PR</span></div>`).join('')}
        ${ACH.map(a => { const e = State.achievements.find(x => x.id === a.id); return `<div class="list-item" style="${e ? '' : 'opacity:.5'}">${icon(e ? 'award' : 'lock')}<div class="grow"><b>${a.name}</b><div class="muted" style="font-size:12.5px">${a.desc}${e ? ' · earned ' + fmtDate(e.date) : ''}</div></div>${e ? '<span class="badge ok">Earned</span>' : ''}</div>`; }).join('')}</div></section>`;
  },
  resultsTable(metric) {
    const rs = State.results.filter(r => r.metric === metric).sort((a, b) => b.date.localeCompare(a.date));
    if (!rs.length) return '';
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Result</th><th>Type</th><th></th></tr></thead><tbody>${rs.map(r => `<tr><td>${fmtDate(r.date)}</td><td><b>${Units.showMetric(r.metric, r.o)}</b>${r._pr ? ' <span class="badge red">PR</span>' : ''}</td><td>${r.cls}${r.src === 'session' ? ' · W' + r.week : ''}</td><td><button class="btn sm ghost" type="button" data-act="edit-result" data-id="${esc(r.id)}" aria-label="Edit result">${icon('pencil')}</button></td></tr>`).join('')}</tbody></table></div>`;
  },
  pStrength(st) {

function metric(label, val, key, dec, unit, sub, ic) {

/* post-render choreography per screen */
const After = {
  home(view, opts) {
    const first = !State.meta.dashSeen; State.meta.dashSeen = true; Store.saveMeta();
    $$('.route-draw', view).forEach(p => Motion.drawPath(p, 1, first ? Motion.m.cine * 1.6 : Motion.m.cine, first ? 400 : 120));
    const arc = $('.ring-arc', view); if (arc && !Motion.off) Motion.anim(arc, [{ strokeDashoffset: arc.dataset.len }, { strokeDashoffset: arc.dataset.off }], { duration: Motion.m.cine * 1.3, delay: first ? 600 : 100, easing: EASE.out });
    UI.observeCounts(view); Tilt.bind(view); Season.run(view); Quotes.start(view); Reveal.observe(view);
  },
  training(view) {
    Season.run(view); Reveal.observe(view);
    $$('.route-draw', view).forEach(p => Motion.drawPath(p, 1, Motion.m.cine * 2, 200));
    const io = 'IntersectionObserver' in window && !Motion.off ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { Motion.anim(e.target, [{ opacity: 0, transform: 'translateX(10px)' }, { opacity: 1, transform: 'none' }], { duration: Motion.m.std }); io.unobserve(e.target); } }), { threshold: .4 }) : null;
    if (io) $$('.journey .ml', view).forEach(t => io.observe(t));
    ChartFX.run(view);
  },
  workout(view, opts) { if (opts && opts.big) { const c = $('.excard', view); c && Motion.exerciseIn(c, 1); } },
  progress(view) { UI.observeCounts(view); ChartFX.run(view); Season.run(view); Reveal.observe(view); },
  summary(view) { $$('.route-draw', view).forEach(p => Motion.drawPath(p)); },
  session(view) { }
};
/* chart reveal: axes → grid → points → lines/bars */
const ChartFX = {
  run(root) {
    $$('svg.chart', root).forEach(svg => {
      if (Motion.off) return; const m = Motion.m;
      $$('.grid line', svg).forEach((l, i) => Motion.anim(l, [{ opacity: 0 }, { opacity: 1 }], { duration: m.std, delay: i * 40 }));
      $$('.cline', svg).forEach(p => Motion.drawPath(p, 1, m.cine * 1.2, 200));
      $$('.dot', svg).forEach((d, i) => Motion.anim(d, [{ opacity: 0, transform: 'scale(0)' }, { opacity: 1, transform: 'scale(1)' }], { duration: m.std, delay: 300 + i * 50, easing: m.spring }));
      $$('.bar', svg).forEach((b, i) => Motion.anim(b, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: m.std + 200, delay: 120 + i * 45 }));
    });
  }
};
/* subtle touch/pointer perspective on hero cards (cinematic & balanced only, no sensors) */
const Tilt = {
  bind(root) {
    $$('[data-tilt]', root).forEach(el => {
      const move = e => { if (Motion.off) return; const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5, k = 6 * Motion.m.camera; el.style.transform = `perspective(900px) rotateX(${(-y * k).toFixed(2)}deg) rotateY(${(x * k).toFixed(2)}deg)`; };
      el.addEventListener('pointermove', move, { passive: true }); el.addEventListener('pointerleave', () => el.style.transform = '');
      el.addEventListener('pointerup', () => el.style.transform = '');
    });
  }
};

/* ============ 16. DATA EXPORT & IMPORT ============ */
const Backup = {
  pending: null,
  bundle() {
    const strip = (k, v) => (k.startsWith('_') ? undefined : v);
    return JSON.parse(JSON.stringify({ app: APP_ID, schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(), settings: State.settings, profile: State.profile, meta: { onboarded: State.meta.onboarded, introSeen: State.meta.introSeen, finaleSeen: State.meta.finaleSeen }, sessions: State.sessions, results: State.results, bodyweight: State.bodyweight, achievements: State.achievements, program: State.program.source === 'vt2005' ? undefined : State.program }, strip));
  },
  export() {
    const json = JSON.stringify(this.bundle(), null, 1), name = `cliff-big-blue-backup-${todayISO()}.json`;
    let downloaded = false;
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); downloaded = true; } catch (e) { }
    $('#exportOut').innerHTML = `<p class="muted" style="font-size:13px">${downloaded ? `If a download did not start (some embedded viewers block downloads), copy the backup below and save it as <b>${name}</b>.` : 'Copy the backup below and save it as a .json file.'}</p>
      <textarea class="input" id="exportText" rows="6" readonly style="font-family:var(--f-mono);font-size:11px">${esc(json)}</textarea>
      <div class="row"><button class="btn primary grow" type="button" data-act="copy-export">${icon('copy')} Copy backup</button><span class="label">${(json.length / 1024).toFixed(1)} KB · ${State.sessions.length} sessions</span></div>`;
    UI.icons();
  },
  async copy() {
    const ta = $('#exportText'); if (!ta) return;
    try { await navigator.clipboard.writeText(ta.value); UI.toast('Backup copied.'); } catch (e) { ta.focus(); ta.select(); UI.toast('Text selected — copy it with your keyboard or long-press.'); }
  },
  validProgram(p, errs) {
    if (!p || typeof p !== 'object' || !Array.isArray(p.workouts) || !p.workouts.length) { errs.push('Program: missing workouts.'); return false; }
    const types = ['pct', 'reps', 'timed', 'sprint', 'test', 'check'];
    for (const w of p.workouts) {
      if (!w || typeof w.id !== 'string' || !(w.week >= 1) || !(w.day >= 1 && w.day <= 7) || !Array.isArray(w.exercises)) { errs.push(`Program: workout ${w && w.id || '?'} is malformed.`); return false; }
      for (const e of w.exercises) {
        if (!e || !types.includes(e.type) || typeof e.ex !== 'string') { errs.push(`Program: an exercise in ${w.id} is malformed.`); return false; }
        if (!EXERCISES[e.ex] && !(p.customExercises && p.customExercises[e.ex])) { errs.push(`Program: unknown exercise "${e.ex}" (add it to customExercises).`); return false; }
        if (e.type === 'pct' && !(Array.isArray(e.scheme) && e.scheme.every(s => Array.isArray(s) && s[0] >= 1 && s[1] > 0 && s[1] <= 150))) { errs.push(`Program: invalid percentage scheme in ${w.id}.`); return false; }
      }
    }
    return true;
  },
  validate(obj) {
    const errs = [], warn = [];
    if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return { errs: ['The file is not a JSON object.'] };
    const programOnly = !obj.app && obj.program;
    if (!programOnly && obj.app !== APP_ID) return { errs: ['This is not a Cliff: Hokie Power backup.'] };
    if (obj.schema && obj.schema > SCHEMA_VERSION) return { errs: [`This backup comes from a newer version (schema ${obj.schema}). Update the app first.`] };
    let b = obj;
    if (!programOnly && obj.schema < SCHEMA_VERSION) { try { b = runMigrations(JSON.parse(JSON.stringify(obj)), obj.schema); warn.push(`Upgraded from schema ${obj.schema}.`); } catch (e) { return { errs: ['Could not upgrade this backup: ' + e.message] }; } }
    const out = { settings: null, profile: null, sessions: [], results: [], bodyweight: [], achievements: [], program: null };
    if (b.program) { if (this.validProgram(b.program, errs)) out.program = Object.assign({ source: 'imported', weeks: Math.max(...b.program.workouts.map(w => w.week)), dayOffsets: [0, 1, 3, 4], cycles: State.program.cycles, name: 'Imported program', version: 1 }, b.program); }
    if (!programOnly) {
      if (b.settings && typeof b.settings === 'object') out.settings = Object.assign({}, DEFAULT_SETTINGS, b.settings);
      if (b.profile && typeof b.profile === 'object' && b.profile.baselines) out.profile = b.profile;
      const okW = o => o && isFinite(o.kg) && o.kg >= 0 && o.kg < 1000;
      const check = (name, fn) => { const arr = Array.isArray(b[name]) ? b[name] : []; if (b[name] && !Array.isArray(b[name])) errs.push(`${name} is not a list.`); let bad = 0; arr.forEach(r => { if (r && typeof r.id === 'string' && fn(r)) out[name].push(r); else bad++; }); if (bad) warn.push(`${bad} invalid ${name} record${bad > 1 ? 's' : ''} will be skipped.`); };
      check('sessions', s => ['completed', 'in_progress', 'skipped', 'abandoned'].includes(s.status) && typeof s.tid === 'string' && Array.isArray(s.ex) && s.ex.every(x => Array.isArray(x.sets) && x.sets.every(t => (!t.w || okW(t.w)) && (t.reps == null || isFinite(t.reps)))));
      check('results', r => METRICS[r.metric] && r.o && isFinite(Units.canon(r.metric, r.o)) && Units.canon(r.metric, r.o) > 0 && /^\d{4}-\d{2}-\d{2}$/.test(r.date) && ['tested', 'recorded'].includes(r.cls));
      check('bodyweight', e => okW(e.w) && /^\d{4}-\d{2}-\d{2}$/.test(e.date));
      check('achievements', a => typeof a.name === 'string');
    }
    return { errs, warn, out, programOnly };
  },
  async check() {
    const f = $('#impFile').files[0], txt = $('#impText').value.trim(), box = $('#importOut');
    let raw = txt; if (f) { try { raw = await f.text(); } catch (e) { box.innerHTML = '<p class="err-msg">Could not read that file.</p>'; return; } }
    if (!raw) { box.innerHTML = '<p class="err-msg">Choose a file or paste a backup first.</p>'; return; }
    let obj; try { obj = JSON.parse(raw); } catch (e) { box.innerHTML = '<p class="err-msg">That is not valid JSON. Nothing was changed.</p>'; return; }
    const v = this.validate(obj);
    if (v.errs.length) { this.pending = null; box.innerHTML = `<div class="err-msg">${v.errs.map(esc).join('<br>')}</div><p class="muted" style="font-size:13px">Nothing was changed.</p>`; return; }
    this.pending = v; const o = v.out;
    box.innerHTML = `<div class="panel flat stack"><b>Backup looks good.</b>
      ${v.programOnly ? '' : `<div class="kv"><span>Sessions</span><span>${o.sessions.length}</span></div><div class="kv"><span>Results</span><span>${o.results.length}</span></div><div class="kv"><span>Body-weight entries</span><span>${o.bodyweight.length}</span></div><div class="kv"><span>Profile</span><span>${o.profile ? 'included' : 'not included'}</span></div>`}
      ${o.program ? `<div class="kv"><span>Program</span><span>${esc(o.program.name)} · ${o.program.workouts.length} workouts</span></div>` : ''}
      ${v.warn.length ? `<p class="muted" style="font-size:13px;color:var(--warn)">${v.warn.map(esc).join('<br>')}</p>` : ''}
      ${v.programOnly ? `<button class="btn primary" type="button" data-act="import-apply" data-mode="program">Replace curriculum (history kept)</button>` : `<div class="grid2"><button class="btn primary" type="button" data-act="import-apply" data-mode="merge">Merge</button><button class="btn danger" type="button" data-act="import-apply" data-mode="replace">Replace all</button></div>
      <p class="muted" style="font-size:12.5px">Merge adds records you don't have and keeps everything already here. Replace removes current data first.</p>`}</div>`;
  },
  async apply(mode) {
    const v = this.pending; if (!v) return; const o = v.out;
    if (mode === 'replace') { const ok = await Sheet.confirm({ title: 'Replace all data?', body: '<p>Everything currently on this device will be replaced by the backup. Export first if you are unsure.</p>', ok: 'Replace everything', danger: true, typed: 'REPLACE' }); if (!ok) return; }
    try {
      if (o.program) { LSX.set(LS.program, o.program); State.program = o.program; }
      if (mode === 'replace') {
        for (const s of STORES) { await DB.clear(s); State[s] = []; }
        if (o.settings) State.settings = o.settings; if (o.profile) State.profile = o.profile;
        State.meta.onboarded = !!State.profile; State.meta.activeSessionId = (o.sessions.find(s => s.status === 'in_progress') || {}).id || null;
      } else if (mode === 'merge') {
        if (o.profile && !State.profile) { State.profile = o.profile; State.meta.onboarded = true; }
      }
      if (mode !== 'program') for (const s of STORES) { const have = new Set(State[s].map(x => x.id)); for (const r of o[s]) if (!have.has(r.id)) await Store.save(s, r); }
      Store.saveSettings(); Store.saveProfile(); Store.saveMeta(); State.version++;
      Motion.apply(); Achievements.evaluate(); this.pending = null;
      UI.toast(mode === 'program' ? 'Curriculum replaced.' : 'Backup restored.'); Nav.go('home');
    } catch (e) { UI.toast('Restore failed: ' + e.message + '. Your existing data was kept where possible.', 'bad'); }
  }
};

  if (storedMeta) State.meta = Object.assign(State.meta, storedMeta);

  const fromSchema = storedMeta ? (storedMeta.schema || 1) : SCHEMA_VERSION;
